question: >-
  Record fixed-point L2 evidence at L1=1.4pH, IBias=260uA and RJ1=32ohm,
  preserving separate CONTROL_ORIGIN and FINAL_ORIGIN diagnostics and a
  differential-voltage post-regeneration navigation summary. The experiment
  does not prove re-arm, locate a threshold or rank L2.
motivation: >-
  This coarse L2 sequence tests a registered circuit-design hypothesis about
  post-regeneration L1 recovery. The relation involving L1, L2 and BJ1/BJ2
  voltages is design rationale only, not a pre-existing scientific conclusion.
interpretation_ceiling: >-
  Evidence-only observations and registered mechanical arithmetic for this
  fixed topology, stored history, solver and time grid. No L2 threshold,
  re-arm proof, event/SFQ count, population discrimination, optimum, control
  PASS/FAIL, mechanism or follow-up claim is authorized.

