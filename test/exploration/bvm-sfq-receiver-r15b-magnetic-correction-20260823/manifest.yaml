new_split_winding_point:
  l_fq_pH: 20.0
  l_fo_pH: 20.0
  r_f_ohm: 20.0
  k_qfq: 0.90
  k_foctl: -0.90
  k_qctl: 0.0
  k_fqfo: 0.0
  series_loop_l_over_r_ps: 2.0
  polarity: >-
    L_FQ=N_FQ->N_FX and L_FO=N_FX->0 are same series-current direction;
    L_FO is reverse-dotted relative to L_CTL=N_DRV->N_OUTJ, hence K_FOCTL=-.90.

