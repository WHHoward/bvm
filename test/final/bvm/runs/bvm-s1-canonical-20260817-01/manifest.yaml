mode: calibration
research_question: >-
  Under the fixed BVM closure, 12-ohm load, operational init_positive/
  init_negative procedures, single read PWL, and matched zero-read controls,
  do V(SL1) and I(L_SL|XBVM1) satisfy the preregistered S1 numerical
  timestep-convergence procedure (0.05 -> 0.025 -> 0.0125 ps)?

hypotheses:
  primary: >-
    Falsifiable non-acceptance predictions from the S1 design: positive read
    peak about +0.904..+0.905 mV and +75.3..+75.4 uA; negative read peak
    about -0.317 mV and -26.4 uA; small 0.025-to-0.0125-ps read-waveform
    change; controls far below paired read scale.
  alternatives:
    - Contradiction is reported, never repaired by changing the procedure.

predeclared_outcomes:
  pass: "Artifact VALID and every applicable registered comparison in both
         adjacent pairs passes (CONVERGED)."
  fail: "No physical PASS/FAIL is registered for S1."
  inconclusive: >-
    Artifact is valid but a required readiness, applicable convergence,
    matched-control residual, or exact common-time comparison fails at the
    fixed 0.0125-ps maximum; observations must not be upgraded.
  invalid: "Data or provenance failure (missing/misnamed probe, NaN,
           nonmonotonic/duplicate time, truncated window, hash break)."

