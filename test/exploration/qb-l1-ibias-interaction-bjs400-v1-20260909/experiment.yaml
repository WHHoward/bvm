question: >-
  Record the minimal two-by-two L1 and IBias interaction evidence under the
  fixed BJS400 ARRAY BVM -> COMMON_SL -> JSL -> QB -> 6JTL fixture. The
  experiment does not rank corners or interpret mechanisms.
interpretation_ceiling: >-
  Evidence-only observations for this fixed topology, history, solver and
  stored grid. No interaction conclusion, SFQ/event count, mechanism, Gate,
  robustness, optimum, hardware or follow-up claim is authorized.

physical_authority:
  experiment: test/exploration/qb-bjs400-array-population-single-matched-v1-20260909
  role: physical fixture, BJS400 QB, BVM history, controls, masks, timing, probes and solver authority
  bjs400_source_sha256: 883308517d48470cbedab878f9e3c71721cd972db248c6b821ce5dba642ff810
  authority_git_head: e72b4f568a1d49100b5e4fefa60bee8955bb0db8

changed:
  - L1: 2.0pH -> 1.6pH for registered C/D corners
  - IBias: 250uA -> 260uA for registered B/D corners
  - final-read mask: only 0001 or 0011
  - no other QB parameter, topology, timing, solver or load change

frozen:
  BJS: area=4; Ic=400uA
  RJ1: 12ohm
  bvm: historical JM2-connected variant, four BVM shared COMMON_SL
  jsl: eight jjmit area=5.0 elements
  qb: all values from BJS400 authority except registered L1/IBias
  jtl: six jtl2 stages and 10ohm termination
  stimulus: WRITE0 -> ZERO_STATE_READ_CONTROL -> WRITE1 -> SETTLE -> mask-selective FINAL READ -> TAIL
  controls: WL/BL/SE amplitude 100uA; 1ps rise/fall; 9ps plateau
  timing: .tran 0.1p 200p; stored 0 to 199.9ps
  probes: broad BVM/interface/QB/JTL P/V/I coverage from BJS400 authority
  raw: immutable solver output; no derived standalone plot CSV

interaction_matrix:
  A: {label: A, L1_pH: 2.0, IBias_uA: 250, mask_cases: ["0001", "0011"], role: nominal-BJS400 reference}
  B: {label: B, L1_pH: 2.0, IBias_uA: 260, mask_cases: ["0001", "0011"], role: historical BJS400 reuse}
  C: {label: C, L1_pH: 1.6, IBias_uA: 250, mask_cases: ["0001", "0011"], role: L1-only reference}
  D: {label: D, L1_pH: 1.6, IBias_uA: 260, mask_cases: ["0001", "0011"], role: combined registered corner}

authorized_runs:
  - runs/ARRAY_L1P20_IB250_0001
  - runs/ARRAY_L1P20_IB250_0011
  - runs/ARRAY_L1P16_IB250_0001
  - runs/ARRAY_L1P16_IB250_0011
  - runs/ARRAY_L1P16_IB260_0001
  - runs/ARRAY_L1P16_IB260_0011
