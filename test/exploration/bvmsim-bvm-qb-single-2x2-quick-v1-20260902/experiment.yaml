    - V(SL1)
    - I(L_SL|XBVM1)
    - V(QBIN)
  qb:
    - P(BJS|XBQ1)
    - V(BJS|XBQ1)
    - I(BJS|XBQ1)
    - P(BJ1|XBQ1)
    - V(BJ1|XBQ1)
    - I(BJ1|XBQ1)
    - P(BJ2|XBQ1)
