preflight_timestamp: 2026-09-02T16:50:54+08:00

question:
  - Does one historical BVMSim BVM drive a clean local event or a multi-fire burst in BQ_BVMSIM_V1 through the original 12-JJ sensing-line load?
  - Does the six-stage JTL transport the QB output stage by stage, and does its load feed back on the QB?
hypothesis: The read-1 condition may produce discrete QB activity, while read-0 should not; the JTL result must be determined from same-JJ event and transport evidence rather than cumulative phase alone.

topology:
  bvm_source: BVMSim/bvm_cell.cir
  bvm_authority: historical_bvmsim_source_only
  qb_cell: circuits/qb/bq_cell_bvmsim_v1.cir
  qb_subckt: BQ_BVMSIM_V1
  jj_model: circuits/models/jjmit.cir
  jtl_source: BVMSim/library_josim/jtl2.cir
  bvm_instances: 1
  terminal_sensing_line:
    elements: 11 B_LD4_01..B_LD4_11 plus BVMout
    jj_count: 12
    area: 3.2
    terminal: SL1 -> BVMout -> QBin
  qb_bias_uA: 250
  direct_load_ohm: 10
  jtl_stages: 6
  jtl_load_ohm: 10

changed:
  - logical write sign: S0 uses -100 uA on WL and BL; S1 uses +100 uA on WL and BL
  - downstream load: direct 10 ohm versus six BVMSim jtl cells followed by 10 ohm
frozen:
  - BVMSim/bvm_cell.cir is historical and unedited
  - single BVM plus exactly 12 terminal sensing-line junctions
  - BQ_BVMSIM_V1 topology and 250 uA external bias waveform
  - exact BVMSim/library_josim/jtl2.cir behavior in J conditions
  - 1 ps ramp, 9 ps hold, 1 ps fall pulse shape
  - write slot 50..61 ps and positive read slot 70..81 ps
  - logical 1 is the same-slot positive counterpart of the existing BVMSim logical-0 waveform
  - .tran 0.025p 200p, saved from t=0
  - no canonical BVM, four-BVM fixture, parameter sweep, timestep ladder, magnetic coupling, JSL redesign, T1, or automatic follow-up

conditions:
  - id: S0-R
    logical_state: 0
    load: direct_10ohm
    deck: inputs/s0-r.cir
    run_dir: runs/A001/S0-R
  - id: S1-R
    logical_state: 1
    load: direct_10ohm
    deck: inputs/s1-r.cir
    run_dir: runs/A001/S1-R
  - id: S0-J
    logical_state: 0
    load: jtl1_to_jtl6_plus_10ohm
    deck: inputs/s0-j.cir
    run_dir: runs/A001/S0-J
  - id: S1-J
    logical_state: 1
    load: jtl1_to_jtl6_plus_10ohm
    deck: inputs/s1-j.cir
    run_dir: runs/A001/S1-J

windows_ps:
  pre: [0, 50]
  write: [50, 62]
  read: [70, 82]
  post: [82, 200]
  full: [0, 200]
  boundary_rule: associate a candidate by onset and context; do not cut a monotonic or voltage-active candidate at a window boundary

event_segmentation:
  status: TASK_LOCAL_EXPLORATORY
  method: voltage_activity_then_quiescent_gap_then_same_jj_phase_area
  active_threshold: max(1e-6 V, 0.01 * peak_abs_voltage)
  quiescent_threshold: max(0.2e-6 V, 0.002 * peak_abs_voltage)
  min_quiescent_gap_ps: 0.25
  min_candidate_duration_ps: 0.05
  near_unit_turns: [0.75, 1.25]
  max_phase_area_residual_turns: 0.20
  event_counter_authority: candidate phase-area and retrap evidence; not Vpeak, I>Ic, derivative activity, whole-window phase, or whole-window area
  algorithm_scope: analysis-only helper for this exploration; bvmtools.sfq is not modified

signals:
