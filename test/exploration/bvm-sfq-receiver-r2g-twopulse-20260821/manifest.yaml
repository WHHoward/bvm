event_criterion:
  definition: >-
    Per pulse window: continuous monotonic segment of adjacent-sample-unwrapped
    P(B_OUT|XTRIG) with abs(delta(phi))/(2*pi) >= 1.0 turn starting within that
    pulse's analysis window, with same-segment direct V(B_OUT|XTRIG) trapezoid
    integral / Phi0 within 0.05 turn of phase delta.
interpretation_plan:
  repeatable: REPEATABLE_TWO_PULSE_SINGLE_SLIP if each pulse yields exactly one
    qualifying slip with clean retrap/rearm between.
  rearm_failure: REARM_FAILURE if pulse 2 yields zero slips.
  multi_fire: MULTI_FIRE if any pulse yields >=2 slips.
  unstable: UNSTABLE_RUNNING if free-running appears.
