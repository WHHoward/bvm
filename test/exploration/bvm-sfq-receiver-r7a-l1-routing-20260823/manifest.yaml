research_question:
  single_question: >-
    Does reducing native-QB L1 from 3.91 pH to 2.50 pH increase the fraction
    of read1 front-stage perturbation routed into L2/BJL2 while preserving
    read0 selectivity and canonical BVM source/storage behavior?

hypotheses:
  primary: >-
    Lower L1 reactance increases node2-to-node3 transient transfer, so
    control-subtracted read1 G_L2 and/or G_BJL2 increase over R6-B while
    read0 remains separated and source/storage guards remain bounded.
  alternatives:
    - >-
      L1 changes settled phase/current operating points without clear routing
      gain.
    - >-
      L1 does not support the routing hypothesis at this point.
    - >-
      L1 causes reflected-load back-action, nonselective activity, or
      free-running behavior.
    - >-
      Read1 produces exactly one BJL2 local phase/area-consistent event.

