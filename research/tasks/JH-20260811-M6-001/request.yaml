acceptance:
  - id: AC1
    condition: "M6 对每个声明映射显式保存 phase_column、direct voltage_column、orientation、端点窗口；phase_delta_turns=(P_last-P_first)/(2*pi)，area_turns=orientation*trapezoid(V,time)/Phi0，保留原始 rad/V/s，不提前取整或取绝对值。"
    evidence:
      - "实现与 CLI/plan 输出"
      - "独立合成非均匀时间轴测试"
  - id: AC2
    condition: "实现拒绝非有限或不严格递增时间、缺列、少于两点、无效窗口、非有限 P/V、未知 orientation，以及未经声明的时间重采样/插值；同一窗口的首末实际样本同时用于相位端点与电压梯形积分。"
    evidence:
      - "负例测试日志"
      - "合成正例测试日志"
  - id: AC3
    condition: "新增两个 M6 网表只是在历史匹配 bump 0/300 uA 条件上增加 B1/B2/B3 的直接 V(Bn|XDCSFQ) 与 P(Bn|XDCSFQ) 探针；原历史网表和 raw 保持逐字不变。"
    evidence:
      - "受限网表 diff"
      - "include/provenance manifest"
  - id: AC4
    condition: "在唯一 run ID 下运行这两个新网表，保存实际 netlist snapshot、include/model 闭包、build/josim-cli version+sha256、stdout/stderr、原始 CSV 及 sha256；不得覆盖已有 raw 或失败输出。"
    evidence:
      - "attempt run manifest"
      - "raw CSV、日志和哈希"
  - id: AC5
    condition: "对每个新 run、每个 B1/B2/B3 生成同一 JJ 的 raw phase delta、voltage-area turns 与 signed residual；0/300 条件如要做差分，只能在逐 run 同一 JJ 结果已完整报告后另列为控制校正，不得混淆为单运行交叉校验。"
    evidence:
      - "M6 JSON/report"
      - "从 raw CSV 独立复算的审计说明"
  - id: AC6
    condition: "M4 15 项与 M5 29 项测试保持通过，新增 M6 测试独立验证非均匀时间 trapezoid、正负 orientation、端点一致性、Phi0 单位换算和错误输入拒绝；测试 oracle 不调用被测积分实现。"
    evidence:
      - "测试日志"
      - "测试代码审查"
  - id: AC7
    condition: "receipt 完整列出每个新文件、raw/log/manifest 哈希、命令与退出码、AC 映射、solver 警告、未知与限制；proposed_physical_verdict 只能为 NOT_APPLICABLE 或 INCONCLUSIVE。"
    evidence:
      - "attempt receipt.yaml"
      - "handoff verify-task 输出"
invalid_conditions:
  - "把 P() 原始 rad 直接称为 SFQ 数，或把局部相位/面积结果称为下游接收、fluxoid 或系统 Gate。"
  - "phase 与 voltage 不是同一 JJ、同一运行、同一方向、同一端点窗口，或以外部节点电压替代直接 JJ 电压。"
  - "重采样、插值、常规时间步假设替代 CSV 实际时间轴梯形积分。"
  - "修改、覆盖、删除、重命名任何历史 raw/netlist，或未保存新的失败运行。"
  - "把预注册数值检查误写为已冻结 M9 容差或论文/路线结论。"
inconclusive_conditions:
  - "JoSIM 的 V(Bn|XDCSFQ) 语义或相位方向无法由网表、输出和可复现的同运行数据确定。"
  - "任一新运行出现 solver/CSV 异常而无法从保存的原始产物判定其对面积比较的影响。"
  - "原始同 JJ 数值残差已报告，但在 M9 前没有已冻结的物理接受容差。"
stop_conditions:
  - "当前 HEAD、dirty 快照、绑定哈希、依赖、范围或任一 lock 不符合预检。"
  - "需要修改 scope.write_paths 之外的路径，或需要覆盖、删除、重命名、联网、安装依赖、创建 worktree 或提交。"
  - "直接 JJ V 探针不能被 JoSIM 解析，或输出不能与同名 P 列一一对应；保留失败证据并停止，不以外部节点 V 代替。"
  - "需要引入未预注册的参数扫掠、时间步收敛、阈值/容差冻结或 M7+ 逻辑以取得结论。"
  - "同一根因已造成两个 attempt 无法得到可用的同 JJ raw 输出。"
issuance_blockers: []
