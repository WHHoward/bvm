    - analysis
    - visualization
    - references/historical_bjs300
    - HISTORICAL_BRIDGE_MANIFEST.json

prohibited_followups:
  - any mask other than 0000, 1000, 0001, 0011
  - any parameter other than BJS area=4 and the four registered working points
  - any combined parameter tuning or topology tuning
  - any focused-window, mechanism, ranking, dashboard or event plot
  - any retry because a waveform appears strange or differs from expectation
  - any scientific interpretation, SFQ/event classification, Gate claim or next experiment

