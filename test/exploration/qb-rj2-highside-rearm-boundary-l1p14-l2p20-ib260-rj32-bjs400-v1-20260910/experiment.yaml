scientific_analysis_performed: false

question: >-
  At fixed L1=1.4pH, L2=2.0pH, IBias=260uA, RJ1=32ohm and BJS400 ARRAY
  history, record whether increasing RJ2 from the exact reused 6ohm point to
  8/10/12ohm produces a first stored-sample post-first-BJ2 I(L1)
  negative-to-positive re-crossing while the ZERO_STATE_READ_CONTROL and the
  0001 first downstream response remain clean. If a re-crossing is observed,
  record the separately registered second multi-signal progression candidate.
motivation: >-
  This is a bounded high-side RJ2 boundary search motivated by the prior
  evidence-only RJ2=2/3/4/6ohm sweep. The prior result is source context, not a
  pre-decided outcome.
interpretation_ceiling: >-
  Preserve OBSERVED, DERIVED, BOUNDED_RESULT and UNKNOWN separately. No phase
  turn, voltage area, terminal area, current threshold or sign transition is
  an SFQ count. No damping mechanism, successful re-arm, route choice,
  optimum, universal threshold or paper claim is made in this experiment.

