research_question: >-
  At the frozen R1 differential receiver operating point, does increasing only
  transformer mutual coupling K increase the state-dependent secondary drive
  enough to produce a complete B_OUT phase/voltage-area transition?
hypothesis: >-
  If H1 is the dominant bottleneck, increasing K at fixed BVM, JJ, bias,
  inductances, and loads will increase secondary voltage/current and B_OUT
  phase activity, possibly approaching one complete turn for read1 while
  read0 remains sub-turn.
alternative_hypotheses:
  H2_dynamic_receiver: >-
    Secondary transfer increases, but loaded B_OUT phase activity remains near
    the R1 sub-turn response because JJ damping/dynamic operating point limits
    completion.
  polarity_or_loading: >-
    K changes the signed transfer or BVM loading non-monotonically, so a larger
    nominal mutual coupling does not imply a larger useful B_OUT drive.
  control_artifact: >-
    A control or initial-condition transient could mimic K-dependent output
    activity without a read-state-dependent transfer.
