  shared_boundary: "V(COMMON_SL); P/V/I B_JSL1..8; V(QBIN); I(B_JSL8); I(R_QBIN_SHUNT); I(LIN|XBQ)."
  qb: "P/V/I BJS/BJ1/BJ2; I/V LIN/L1/L2/L3; I/V RJ1/RJ2; V(QBOUT). Canonical internal IB source is fixed in the included QB; JoSIM does not expose a reliable hierarchical I(IB) column, so no value is fabricated."
  jtl: "P/V/I B01/B02 for every XJTL1_1..XJTL1_6; V(JTL1_OUT)..V(JTL6_OUT); I(R_TERM)."
  direction_convention: "B_JSL8: JSL_NODE7 -> QBIN; R_QBIN_SHUNT: QBIN -> ground; LIN|XBQ: QBIN -> BQ internal node 1. KCL residual = I(B_JSL8) - I(R_QBIN_SHUNT) - I(LIN|XBQ)."

