scientific_question: >-
  Can a physically realizable split-winding/two-core transfer loop preserve
  BVM discrimination and J_Q refractory/state compression while retaining
  independent J_OUT bias-powered energy and providing a bounded active drive
  toward frozen DCSFQ_BVM.a?

architecture_decision:
  route: split_winding_two_core
  rejected_alternative: >-
    True three-winding common-core completion requires strong K_Q_CTL above
    0.62 when K_QF=K_FO=0.90; its direct Q->CTL load-line change is not chosen.
  rationale: >-
    Two independent cores make K_Q_CTL=0 physically explicit. A series damped
    transfer loop preserves the 2 ps bridge L/R scale, while independent I_OUT
    remains the active energy source.

