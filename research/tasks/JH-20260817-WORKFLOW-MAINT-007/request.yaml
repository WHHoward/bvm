  - {id: AC2, condition: "Protocol documentation states that authority is the bundle's declared entries; handoff independently checks every declared entry for repository-safe path, regular-file existence, SHA-256, bytes, and duplicate policy, without asserting directory closure.", evidence: [handoff-protocol.md]}
