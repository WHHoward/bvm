preregistration_amendment:
  amended_at: "2026-08-22T21:19:30+08:00"
  reason: >-
    The first draft candidate 6.0 uA used a phase-excursion extrapolation
    without enforcing the signed external-flux fold separation. Before any
    JoSIM run, an independent Sol review and direct fluxoid-sign check on the
    committed raw selected the signed read1/read0 fold midpoint 9.93 uA.
  superseded_candidate_uA: 6.0
  selected_candidate_uA: 9.93
  raw_artifacts_changed: false

design_question:
  single_question: >-
    At one analytically selected bias point, does the existing reduced
    biased-quantizer cross the actual inductive-loop saddle selectively on
    read1, while read0 and both READ=0 controls remain below the saddle?

analytic_basis:
  model_equation: >-
    phi + beta_L*(I_bias/Ic + sin(phi)) + 2*pi*M*I(L_TX)/Phi0 = 2*pi*n
  stability: 1 + beta_L*cos(phi) > 0
  saddle_condition: 1 + beta_L*cos(phi) = 0
  r5a_bias_rejected_uA: 4.2
  selected_bias_uA: 9.93
  selection_note: >-
    R5-A read1 relative excursion was -0.249559 turn while the exact 4.2-uA
    reverse-saddle distance is 0.281494 turn. With the declared M*I_TX polarity,
    the read1 positive external-flux lobe is +0.093924 Phi0 and read0 is
    +0.038292 Phi0. Solving the same nonlinear branch places the corresponding
    read1/read0 static selectivity interval at approximately 9.356–10.506 uA;
    9.93 uA is the midpoint using the actual signed raw lobe. The connected n=0
    branch is stable there. This is an inference to test, not a guaranteed
    dynamic result.

