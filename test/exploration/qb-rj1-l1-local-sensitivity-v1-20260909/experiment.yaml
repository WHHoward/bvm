question:
  primary: >-
    Under the matched 4-BVM shared-SL physical fixture, test the local first-order
    sensitivity of the QB trigger trajectory to L1 and RJ1 for ARRAY final READ
    mask 1000. This is a registered local sensitivity experiment, not an
    optimization sweep.
  H_L1: >-
    L1 decrease may make I(L1) more readily move from negative toward zero or
    positive and may subsequently increase I(L2)=I(IB)+I(L1).
  H_RJ1: >-
    RJ1 increase may weaken BJ1 shunt damping, allowing positive V(BJ1) and
    phase progression to persist longer and changing the retrap trajectory.
  questions_to_answer:
    - Does L1=1.9pH -> 2.0pH -> 2.1pH show a consistent local directional change in BJ1/L1 trajectory?
    - Does RJ1=12.0ohm -> 12.5ohm -> 13.0ohm change the duration of positive BJ1 voltage/phase progression?
    - Do source-side I_quiet_total, V(COMMON_SL), JSL currents, V(QBIN), and W_QBIN change together with the receiver trajectory?
  interpretation_ceiling: >-
    Bounded simulation evidence for this fixed historical JM2-connected BVM,
    fixed 4-cell shared COMMON_SL, fixed 8x500-uA JSL, fixed BVMSim BQ/JTL,
    fixed stimulus, solver and 0.1-ps timestep only. No universal mechanism,
    hardware, optimal parameter, SFQ count, or convergence claim.

