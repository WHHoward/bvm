schema_version: 1
run_id: bvm-s0-d0-20260814-01
created_at: "2026-08-14T16:40:00+08:00"
mode: exploratory
research_question: >-
  With one fixed BVM/model/load closure and no read stimulus, do the
  predeclared positive and negative initialization procedures produce two
  stable, distinguishable JM1/JM2 phase-signature vectors relative to a
  no-init control?

hypotheses:
  primary: >-
    The two write-only initialization procedures produce two distinct,
    stable operational phase signatures on the direct JJ probes, and the
    no-init control stays at the startup reference.
  alternatives:
    - Both initialized cases return to the same signature (no separation).
    - Signatures differ but drift within a state window (p2p > 0.02 rad).
    - Initialization never settles before simulation end.

predeclared_outcomes:
  pass: >-
    All three D0 guards hold in both state windows: >=2 actual samples with
    finite P columns, per-component p2p <= 0.02 rad, and L-inf separation
    >= 0.10 rad between init_positive and init_negative means.
  fail: >-
    Any guard fails, or direct P/V output is unavailable; conclusion
    INCONCLUSIVE, D0 does not advance S0.
  inconclusive: >-
    Artifacts valid but guards unmet, or only operational distinctness
    (no logical read0/read1 identity).
  invalid: >-
    Missing columns, NaN/Inf, non-monotonic time, truncated window, solver
    exit nonzero, pre-existing run root, or unregistered change.

provenance:
  git_head: 8b2b5d9
  git_dirty: true
  git_status_path: research/tasks/JH-20260814-BVM-S0-D0-001/baseline/git-status.txt
