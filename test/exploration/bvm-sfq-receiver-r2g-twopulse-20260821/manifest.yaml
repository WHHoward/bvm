research_question: >-
  At the verified h20 operating point (4.5 uA, 20 ps flat-top trapezoid), do two
  separated identical input pulses each produce exactly one complete local 2*pi
  slip with a clean retrap/rearm in between?
hypothesis: >-
  H_repeatable (primary): the h20 single-slip event is repeatable; after the
  first pulse retraps to equilibrium+1 turn, the second identical pulse produces
  exactly one more complete slip, giving exactly two slips total with no
  multi-fire, missed second event, or free-running.
alternative_hypotheses:
  rearm_failure: >-
    The second pulse fails to switch (REARM_FAILURE) because the post-first-pulse
    state differs from the initial state beyond an integer 2*pi (history-dependent
    threshold shift).
  multi_fire: >-
    A pulse produces more than one complete slip (MULTI_FIRE).
  unstable_running: >-
    Free-running after one or both pulses (UNSTABLE_RUNNING).
separation_choice:
  value_ps: 60.0
  rationale: >-
    Measured from R2-F raw h20: after the ~132.4 ps crossing, phase deviation
    from final decays to +0.0055 turn by 150 ps, +0.0013 turn by 156 ps, and
    +0.0005 turn by 160 ps; |V| falls below 0.3 uV by 160 ps.  The first pulse
    envelope ends at 144.51 ps (fall knee); requiring the second rise to start
    no earlier than full settling gives >=40 ps of quiet time.  A 60 ps gap
    between envelope ends provides margin without approaching any sweep.
drive_geometry:
  single_pulse: identical to R2-F h20 - trapezoid peak 4.5 uA, rise/fall 20 ps,
    hold 20 ps; knees [84.51, 104.51, 124.51, 144.51]
  two_pulse: same shape repeated; second pulse knees shifted by +204.51-84.51?
    no - shifted so envelope-end to next rise-start separation is 60 ps:
    pulse1 knees [84.51, 104.51, 124.51, 144.51]
    pulse2 knees [204.51, 224.51, 244.51, 264.51]
  geometry_note: >-
    The 170 ps simulation stop used across R2-C..R2-F cannot contain two pulses
    at a safe separation.  Stop time is extended to 300 ps for this experiment
    only; this is a recorded deviation from the frozen probe window because the
    research question is intrinsically two-event.  All other numerical settings
    unchanged (dt=0.0125 ps, PHASE analysis).  Analysis windows are redefined
    per pulse rather than reused from R2-F.
