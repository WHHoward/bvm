acceptance:
  - {id: AC1, condition: "Exactly four runs cover the frozen matrix A/B x positive/negative at R_LD=12 ohm, dt=0.0125 ps, tstop=92 ps; no read pulse occurs.", evidence: [manifest.yaml, inputs, raw]}
  - {id: AC2, condition: "The only inter-timing stimulus difference is the registered rising edge: S2 9-10 ps versus S1 10-11 ps, with common +/-100 uA plateau through 20 ps and common 20-21 ps return; no claim of whole-waveform translation is made.", evidence: [preregistration.yaml, inputs, closure-hashes.txt]}
  - {id: AC3, condition: "Each run reports direct JM1/JM2 p2p in [30,40), [50,60), [70,80), and [80,90) ps; readiness uses the frozen 0.020-rad condition separately by polarity.", evidence: [analysis.json, report.md]}
  - {id: AC4, condition: "Raw CSV literal timestamp tokens and registered bounds use Decimal exact semantics; no float equality, interpolation, resampling, or time alignment is used.", evidence: [analyze_timing.py, verify_timing.py, analysis.json]}
  - {id: AC5, condition: "Independent verifier reads raw plus frozen specification, recomputes all p2p/readiness/contrasts/disposition, and deterministic report is consistent with structured result.", evidence: [verify_timing.py, verify.log, report-consistency.json, report.md]}
  - {id: AC6, condition: "Frozen expected evidence/run-artifact matrix, inventory, and declared-entry pre-receipt bundle cover every required delivered item; each bundle entry is independently path/hash/bytes verified and final receipt is excluded.", evidence: [expected-matrix.yaml, inventory.yaml, evidence-bundle.yaml]}
  - {id: AC7, condition: "Final interpretation distinguishes a reproducible registered intervention effect from a detailed physical mechanism and remains within the frozen claim ceiling.", evidence: [analysis.json, report.md]}
invalid_conditions:
