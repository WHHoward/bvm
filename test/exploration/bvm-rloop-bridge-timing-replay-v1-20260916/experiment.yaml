  source: "I(B_JSL8), I(LIN|XBQ1), signed area, positive-to-negative crossing, negative dwell/min"
  rloop: "active JS1/JS2 phase p2p, same-JJ voltage-area, JM1/JM2, L_S3/R_S canonical references, replay bridge current/voltage"
