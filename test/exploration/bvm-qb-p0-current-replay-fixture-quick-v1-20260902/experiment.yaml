    - I(RB|XBQ)
    - I(RJ2|XBQ)
    - I(L0|XBQ)
  signal_occurrences:
    I(LIN|XBQ): 0
    I(I_REPLAY): 0

windows_ps:
  W2_pre_read_idle: [80, 90]
  W3_read: [95, 110]
  W4_post_read_observation: [110, 130]

pre_state_rule:
  comparison: P0_vs_RP
  phase_semantics: each phase trace is continuously unwrapped and centered by its own W2 median
  all_signals_required: true
  current_max_abs_difference_uA: 0.01
  phase_max_abs_difference_turns: 0.001
  no_interpolation: true

trajectory_closure_rule:
  comparison: exact_grid_fixed_window
  phase_semantics: continuous_unwrap(rad)/(2*pi), centered by W2 median for comparisons
  difference_convention: RP_minus_P0 and I0_minus_P0; RMS is sign-insensitive but sign is retained
  reference_gap_floor:
    current_rms_uA: 1.0e-9
    phase_rms_turns: 1.0e-9
  ratio: C_x = RMS(RP-P0) / RMS(I0-P0)
  threshold: 0.10
  windows: [W3_read, W4_post_read_observation]
  denominator_too_small: NOT_DEFINED_SMALL_REFERENCE_GAP
  if_denominator_too_small: use_absolute_comparison_and_do_not_manufacture_ratio

kcl_rule:
  implementation: scripts/bvmtools/kcl.py
  tolerance_uA: 0.001
  equations:
    input: I(LIN|XBQ) - I(BJS|XBQ) = 0
    node2: I(BJS|XBQ) - I(BJL1|XBQ) - I(RJ1|XBQ) - I(L1|XBQ) = 0
    node3: I(L1|XBQ) + I(RB|XBQ) - I(L2|XBQ) = 0
    node4: I(L2|XBQ) - I(BJL2|XBQ) - I(RJ2|XBQ) - I(L0|XBQ) = 0
  windows: [W2_pre_read_idle, W3_read, W4_post_read_observation]

