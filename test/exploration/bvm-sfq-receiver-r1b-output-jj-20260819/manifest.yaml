criterion:
  output_read1: >-
    At least one monotonic continuous B_OUT segment in OUTPUT_ANALYSIS with
    abs(delta_phase)>=2*pi and start_time<=130 ps; report raw phase endpoints
    and same-segment B_OUT voltage area.  The phase/area residual must be
    <=0.05 turns, inherited from the accepted R1a local evidence contract.
  output_read0_and_controls: >-
    No complete B_OUT segment in OUTPUT_ANALYSIS for read0 and no complete
    segment in CONTROL_FULL for either READ=0 control; no free-running control.
  trigger_guard: >-
    B_TRIG must retain a complete read1 segment and no complete read0/control
    segment under the accepted R0b/R1a direct phase and same-JJ area method.
  secondary_guard: >-
    Report retained secondary V/I activity, read1/read0 separation, and
    control quietness after adding B_OUT; secondary is a transfer guard, not
    an output-event oracle.
  storage_guard: >-
    Retain JM1/JM2 and compare with R1a; no obvious logical-sign inversion or
    collapse is allowed.  Exact storage preservation is not claimed.
  forbidden_shortcuts: [I_above_Ic, voltage_peak_alone, phase_range_alone, SFQ_count, downstream_delivery]
  SFQ_boundary: >-
    A complete local B_OUT phase transition is not called downstream SFQ
    delivery because this Exploration has no JTL.
  verdict: >-
    PASS only if read1 B_OUT has a complete phase/area-consistent segment,
    read0/control B_OUT has none, B_TRIG guard passes, and controls do not
    free-run.  FAIL if artifacts are valid and a necessary condition is
    absent; INVALID for solver or raw artifact failure.
