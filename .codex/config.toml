# JoSIM project-local Codex routing defaults.
# Named agents in .codex/agents/ pin their own model/effort where needed.
# Root controller: Luna Max (2026-08-18 user-authorized route adjustment;
# smoke-tested via luna_max_smoke).
model = "gpt-5.6-luna"
model_reasoning_effort = "max"

[agents]
enabled = true
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "medium"
max_concurrent_threads_per_session = 4
interrupt_message = true
