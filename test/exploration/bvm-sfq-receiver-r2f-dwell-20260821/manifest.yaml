event_criterion:
  definition: >-
    Continuous monotonic segment of adjacent-sample-unwrapped P(B_OUT|XTRIG)
    with abs(delta(phi))/(2*pi) >= 1.0 turn, segment start no later than 130 ps,
    same-segment direct V(B_OUT|XTRIG) trapezoid integral / Phi0 within 0.05
    turn of phase delta.  I_peak > Ic and voltage spikes are never sufficient.
required_measurements:
  per_point:
    - largest monotonic segment + same-segment V-area
    - peak and plateau I(B_OUT)
    - plateau V(B_OUT)
    - phase velocity dphi/dt during hold
    - time with I_BOUT > 0.99*Ic and > 0.999*Ic
    - first complete transition time (if any) and remaining drive fraction
    - post-event retrap / multi-turn / free-running / ringing
interpretation_plan:
  situation_A: DWELL_THRESHOLD_FOUND; record shortest qualifying hold; supports
    sustained-near-critical-drive requirement; not exactly-one SFQ delivery.
  situation_B: ACTIVATION_WITH_UNSTABLE_RUNNING; do not tune it away.
  situation_C: NO_DWELL_THRESHOLD_IN_BOUNDED_MATRIX; stop; receiver architecture
    reassessment instead of more direct-drive tuning.
