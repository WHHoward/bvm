research_question: >-
  With R9-A restored, does one finite-impedance output-side local BJL2 bias
  feed move the existing read1-selective BJL2 transient into a nonlinear or
  quantizing regime without collapsing read0/control margin or the canonical
  BVM source/storage guard?

hypotheses:
  primary: >-
    A node-4 local bias feed selected just below the calibrated coupled static
    fold will preferentially expose the read1 positive transient to BJL2.
  alternatives:
    - >-
      The feed only produces proportional bounded sub-turn activity in both
      read1 and read0.
    - >-
      The feed changes static load-line but does not increase BJL2 nonlinear
      activity.
    - >-
      The feed causes read0/control activity, free-running, or BVM back-action.
    - >-
      Read1 produces a complete BJL2 local event with retrap.

