acceptance:
  - {id: AC1, condition: "Before reconstruction, make only the narrowly authorized authority sync: correct M9-completion/M10-authorization stale statements and remove the false implication that METRIC_SPEC_V2 froze global numerical Gate tolerances; do not otherwise revise history, status, route, Gate, or candidate text.", evidence: ["docs/HANDOVER.md diff", "memory/project-todo.md diff"]}
  - {id: AC2, condition: "A deterministic stdlib-only generator validates the fixed input inventory and produces exactly the four V2 JSON outputs. Each output records raw hashes, metric-spec path/version/hash, plan path/hash, actual selected endpoint timestamps, signed raw-radian and turn deltas, and explicit limitations/not-applicable fields.", evidence: ["scripts/rebuild_historical_metrics_v2.py", "four metrics_v2 JSON files", "generator log"]}
  - {id: AC3, condition: "Only the preregistered P0 bump files use bump_0 as a named historical control. Outputs report per-run values before the correction and never represent aligned rows as proof of matched netlist closure. All other family/control and same-JJ P/V gaps are explicit.", evidence: ["p0-v2.json", "HISTORICAL_METRICS_V2_CORRECTION_TABLE.md"]}
  - {id: AC4, condition: "Regression tests reject a raw phase value treated as turns, incorrect source/spec/plan hashes, nonmonotonic or nonfinite time data, undeclared P columns, an unregistered control pairing, and forbidden event/Gate vocabulary in generated fields. Tests prove no legacy .json/.csv is modified.", evidence: ["test_rebuild_historical_metrics_v2.py", "test log"]}
  - {id: AC5, condition: "The central correction table links all four V2 JSON artifacts, distinguishes observed endpoint arithmetic from unavailable physical evidence, and each named historical overview retains its original body with only a compact SUPERSEDED banner/link addition.", evidence: ["HISTORICAL_METRICS_V2_CORRECTION_TABLE.md", "historical-document diffs"]}
  - {id: AC6, condition: "Receipt completely records the authority-sync edit, all generated/implementation/test/doc changes, commands and hashes; final verify-task succeeds. No JoSIM run occurs.", evidence: ["receipt.yaml", "verify-task log"]}
invalid_conditions:
  - "Any legacy raw CSV or legacy JSON is modified, deleted, renamed, or overwritten."
  - "Any output labels endpoint arithmetic/activity as SFQ, event, fluxoid, local event, downstream reception, candidate success/failure, or a Gate verdict."
  - "A voltage-area claim uses V(OUT1), V(JTLQ), or another non-same-JJ substitute; or BQ/BVM P/V mapping is presented as verified."
inconclusive_conditions:
  - "A valid reconstruction lacks the control, stable windows, same-JJ direct P/V mapping, or convergence evidence required for a physical inference; it must remain explicitly not applicable/inconclusive rather than become a physical FAIL."
stop_conditions:
  - "Current HEAD, dirty snapshot, scope hashes, METRIC_SPEC_V2 hash, listed input hash/header, or locks differ from the issued contract."
  - "Any required output needs an undeclared input/control/window/mapping, a JoSIM run, network/install, deletion/overwrite/rename, or an out-of-scope edit."
  - "The requested authority sync cannot be confined to the stale assertions named in AC1."
  - "Final verify-task cannot succeed; preserve the attempt and report BLOCKED/DEVIATED without claiming M10 completion."
