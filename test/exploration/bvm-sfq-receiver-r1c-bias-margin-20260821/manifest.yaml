research_question: >-
  At the frozen R1b AREA=0.10 differential receiver point, does changing only
  the B_OUT bias current create a read1 activation window while preserving
  read0 and both READ=0 controls as non-switching?
hypothesis: >-
  Increasing the fixed-AREA B_OUT bias reduces the loaded dynamical distance
  to the critical operating point.  A local bias window may therefore exist
  in which the state-dependent read1 secondary transient completes a B_OUT
  phase transition before the weaker read0 transient does.
diagnostic_alternatives:
  A_insufficient_input_energy: >-
    The secondary transient remains too small after loading, so no tested bias
    reaches a complete B_OUT phase/area-consistent segment.
  B_incorrect_JJ_operating_point: >-
    A bias interval exists, or activation changes sharply with bias, while
    the fixed secondary transfer remains state-dependent.
  C_dynamic_damping_limitation: >-
    Bias changes alter the transient but do not produce a consistent complete
    segment because the loaded JJ dynamics remain overdamped/under-retrapping
    or otherwise unable to sustain a phase transition.
