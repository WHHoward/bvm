id: bvm-population-passive-source-replay-rj2p12-l1p14-l2p20-ib260-rj32-bjs400-v1-20260911
study_phase: EXPLORATION
mode: QUICK
status: PREREGISTERED_PENDING_PREFLIGHT
role: Experimental Operator + Evidence Packager

question:
  primary: >-
    Under a passive BVM/JSL source counterfactual, determine whether exact
    captured JSL8 current replay into an isolated current RJ2=12 QB/JTL
    receiver preserves the downstream response regime seen in closed loop.
  bounded_oracle: >-
    The passive capture changes the source loading, and the current replay
    removes finite source impedance and source/receiver back-action. It is a
    waveform-sufficiency fixture, not an intrinsic-source measurement or a
    circuit-equivalent source reconstruction.
  interpretation_ceiling: >-
    Evidence-only delivery. Preserve OBSERVED, DERIVED, BOUNDED_RESULT and
    UNKNOWN separately. No SFQ count, causal mechanism, root-cause, Gate,
    hardware or route claim is authorized before scientific review.

source_authority:
  current_population_experiment: test/exploration/bvm-population-scaling-rj2p12-l1p14-l2p20-ib260-rj32-bjs400-v1-20260910
  current_population_source_class: CURRENT_BJS400_POPULATION_BVM_JSL_CONFIGURATION
  bvm_include: inputs/bvm_jm2_connected.cir
  jsl_model_include: inputs/jjmit.cir
  jsl_topology_source: inputs/array_fixture_template.cir
  qb_include: inputs/BQ_parameterized_bjs400_rj2.cir
  jtl_include: inputs/jtl2.cir
  solver: build/josim-cli
  closed_loop_references: references/closed_loop_rj2p12/
  latest_population_evidence:
    rj2p10: test/exploration/bvm-population-rj2p10-weight3-diagnostic-l1p14-l2p20-ib260-rj32-bjs400-v1-20260911/handoff/bvm-population-rj2p10-weight3-diagnostic-l1p14-l2p20-ib260-rj32-bjs400-v1-20260911_corrected-v2_raw_handoff.zip
    rj2p11: test/exploration/bvm-population-scaling-rj2p11-midpoint-l1p14-l2p20-ib260-rj32-bjs400-v1-20260911/handoff/bvm-population-scaling-rj2p11-midpoint-l1p14-l2p20-ib260-rj32-bjs400-v1-20260911_raw_handoff.zip
    rj2p12: test/exploration/bvm-population-scaling-rj2p12-l1p14-l2p20-ib260-rj32-bjs400-v1-20260910/handoff/bvm-population-scaling-rj2p12-l1p14-l2p20-ib260-rj32-bjs400-v1-20260910_raw_handoff.zip

