observations:
  - "Four runs complete (exit 0, 7360 samples each at 0.0125 ps to 92 ps).
     JM2 readiness-window p2p: S2_REGISTERED 0.05843 rad (not ready) vs
     S1_REGISTERED 0.00548 rad (ready), identical in both polarities;
     Delta_JM2 = -0.05295 rad both polarities."
  - "Disposition: CONSISTENT_TIMING_SENSITIVITY_SUPPORTED (both polarity
     strata same sign, |Delta_JM2| >= 0.020 rad, and both change the
     registered readiness classification)."
interpretations:
  - "Under the registered closure (12 ohm, 0.0125 ps, no read), the S1
     10-11 ps rising-edge timing reproducibly yields JM2 readiness-window
     settling within 0.020 rad, while the S2 9-10 ps timing does not;
     this supports a bounded, reproducible registered intervention effect,
     not a mechanism."
