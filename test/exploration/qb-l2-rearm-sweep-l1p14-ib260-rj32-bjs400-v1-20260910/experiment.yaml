    - references/reused/ARRAY_L1P14_IB260_RJ32_0011

mask_semantics:
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  "0001": BVM4 active during FINAL READ only
  "0011": BVM3 and BVM4 active simultaneously during FINAL READ only

windows:
  control_origin_ps: [70.0, 110.0]
  control_baseline_ps: [61.0, 70.0]
  final_origin_ps: [110.0, 200.0]
  final_baseline_ps: [101.0, 110.0]
  pre_switch_proxy_ps: [110.0, 114.5]
  differential_pre_first_bj1: [110.0, first_BJ1_half]
  differential_first_bj1_to_first_bj2: [first_BJ1_half, first_BJ2_0p9]
  differential_post_bj2_to_121: [first_BJ2_0p9, 121.0]
  differential_121_to_140_ps: [121.0, 140.0]
  semantics: half-open windows over actual stored timestamps; anchor endpoints are stored navigation markers

mechanical_metrics:
  phase: raw P radians; independent continuous unwrap then divide by 2*pi for diagnostic turns only
  thresholds: +0.5, +0.9 and +1.5 relative turns; threshold times are navigation diagnostics only
  differential_voltage: V(BJ1|XBQ1)-V(BJ2|XBQ1); cumulative areas use actual stored time grid
  differential_label: DERIVED_DIFFERENTIAL_VOLTAGE_IMPULSE / MECHANICAL_NAVIGATION_ONLY
  post_first_bj2_anchor: first FINAL-origin BJ2 +0.9-turn navigation marker; not an event boundary
  l1_rearm_proxy: stored-sample negative-to-positive transition after post-first-BJ2 anchor; MECHANICAL_REARM_PROXY_ONLY
  required_impulse_proxy: -(L1+L2)*I(L1_anchor) when I(L1_anchor)<0; compare with post-anchor positive cumulative differential area; MECHANICAL_PROXY_ONLY
  jtl_thresholds: +0.5 and +1.5 relative turns for P(B01|XJTL1_stage), ordered timing only; MECHANICAL_CANDIDATE_ONLY
  areas: trapezoid on actual stored time grid, no interpolation
  terminal: CONTROL-support [70,110), FINAL-support [110,200), whole-run labeled WHOLE_RUN_TOTAL_ONLY
  ratio:
    numerator_denominator: 0011 / 0001
    denominator_area_tolerance_A_s: 1.0e-18
    cancellation_fraction: 0.01
    ambiguous_status: UNKNOWN

probe_schema:
  controls: I(I_WL1..4), I(I_BL1..4), I(I_SE1..4)
  bvm: P/V/I(B_JM1,B_JM2,B_JS1,B_JS2), I/V registered branches and L_SL for XBVM1..4
  interface: V(COMMON_SL), P/V/I(B_JSL1..8), I(B_JSL8), V(QBIN)
  qb: V(QBIN), I/V(LIN), P/V/I(BJS), P/V/I(BJ1), I/V(RJ1), I/V(L1), I(IB), I/V(L2), P/V/I(BJ2), I/V(RJ2), I/V(L3), V(QBOUT)
  jtl: P/V/I(B01), P/V/I(B02), V(stage_OUT) for XJTL1_1..6, V(JTL6_OUT), I(R_TERM)
  optional_unknown: V(IB|XBQ1) if the solver does not emit it
  missing_probe_policy: preserve requested probe and mark UNKNOWN; never fabricate

