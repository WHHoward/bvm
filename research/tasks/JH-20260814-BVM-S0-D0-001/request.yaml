task:
  kind: EXPERIMENT
  objective: "Resolve the single BVM-S0 blocker by testing whether two fixed write-only procedures create distinct, stable, directly observable operational state signatures in one canonical 12-ohm BVM source fixture."
  research_question: "With one fixed BVM/model/load closure and no read stimulus, do the predeclared positive and negative initialization procedures produce two stable, distinguishable JM1/JM2 phase-signature vectors relative to a no-init control?"
  non_goals:
    - "This is not BVM-S0 source characterization: it performs no read stimulus, read0/read1 source pulse measurement, receiver characterization, JTL reception, INTERFACE_GATE_V1, candidate comparison, or route decision."
    - "Do not call either initialized signature logical 0/1, a published BVM state, an SFQ event, a loop fluxoid, or a non-destructive read result."
    - "Do not sweep load, bias, Ic, L, R, pulse amplitude, pulse width, or timestep; use exactly the three registered initialization cases and one 12-ohm load."
    - "Do not modify project authority, METRIC_SPEC_V2, historical circuits/raw data, or any M11 artifact; do not use old scripts/sfq_metrics.py or legacy JSON as evidence."
  claim_ceiling: exploratory_operational_initialization_discriminator_only_no_bvm_s0_source_characterization_or_physical_gate
