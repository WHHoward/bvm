current_head_before_preregistration: a455e14884bb43235d032fb8b60a05d033d086de

research_question:
  single_question: >-
    Can a single weak mutual-transformer interface replace direct galvanic
    canonical SL1 to native-QB IN coupling, preserve the BVM storage guard,
    and retain state-selective native-QB activity in read1 versus read0 and
    READ=0 controls?

hypotheses:
  primary: >-
    A galvanically isolated weak mutual interface reduces receiver-reflected
    loading enough to prevent the direct-SL approximately three-turn JS1/JS2
    drift while retaining a measurable read1-over-read0 native-QB response.
  alternatives:
    - >-
      The mutual transient is too weak or too short for the native QB input
      loop, so read1 activity collapses toward read0/control activity.
    - >-
      The native-QB secondary load reflects enough impedance through the
      transformer to preserve the direct-SL storage failure.
    - >-
      The secondary waveform is nonselective or produces free-running native
      QB activity.

frozen_native_qb:
  topology_snapshot: inputs/bq_cell_paper.cir
  BJs_area: 1.33
  BJL1_area: 1.12
  BJL2_area: 1.89
  Lin_pH: 0.8
  L0_pH: 1.323
  L1_pH: 3.91
  L2_pH: 3.91
  RJ1_ohm: 33.0
  RJ2_ohm: 22.0
  RB_ohm: 8.5
  IB_bias_uA: 90.0
  output_load_ohm: 10.0
  note: >-
    Native topology and reference values are copied unchanged from the
    accepted direct-SL native-QB Exploration; the 90 uA bias is the repository
    fixture value, not a universal paper input specification.

interface:
  direct_galvanic_input_removed: true
  primary_return: "R_PRI SL1 N_PRI 12 ohm; L_PRI N_PRI 0 0.20 pH"
  secondary_input_arm: "L_SEC QB_IN 0 2.0 pH; QB_IN is native BQ_PAPER IN"
  mutual_element: "KISO L_PRI L_SEC 0.50"
  L_PRI_pH: 0.20
  L_SEC_pH: 2.0
  K: 0.50
  M_pH: 0.3162277660
  R_PRI_ohm: 12.0
  added_junctions: 0
  canonical_SL_termination_preserved: true
  rationale: >-
    L_PRI/L_SEC reuse the proven R1a pickup inductance class. K=0.50 is a
    single weak-mutual point: signal scales linearly with M while a reflected
    impedance contribution is expected to scale approximately with K^2.
    R_PRI provides an explicit passive primary current return and avoids an
    open-primary no-op.

precheck:
  source_reference_raw: >-
    test/exploration/bvm-sfq-receiver-native-qb-20260822/raw/<case>/run-01.csv
  source_reference_commit: a455e14884bb43235d032fb8b60a05d033d086de
  source_current_column: I(L_SL|XBVM1)
  source_proxy_note: >-
    Direct-SL loaded current is a proxy for primary current scale only; the
    isolated run must measure I(R_PRI) and I(L_PRI), and no equality is assumed.
  required_calculations:
    - M=K*sqrt(L_PRI*L_SEC)
    - Phi_ext=M*I_PRI
    - V_induced=M*dI_PRI/dt
    - signed_current_impulse_over_activity
    - pre/post_current_return

predeclared_outcomes:
  A_isolation_preserved_state_selective_activity: >-
    JS1/JS2 no longer show direct-SL-level multi-turn drift, while read1 native
    QB activity remains clearly above read0 and both READ=0 controls. BJL2 may
    remain incomplete and this still counts as a positive isolation-feasibility
    observation.
  B_isolated_native_qb_local_pass: >-
    Outcome A plus exactly one read1 BJL2 complete monotonic same-JJ phase/V-area
    event, zero read0/control complete events, and no free-running.
  C_bounded_failures:
    transfer_starvation: >-
      Read1 native-QB activity collapses toward read0/control despite preserved
      BVM storage guards.
    reflected_load_back_action_failure: >-
      JS1/JS2 remain direct-SL-level multi-turn shifted despite the isolated
      interface.
    nonselective_activity: >-
      Read0/control native-QB complete activity or free-running comparable to
      read1 appears.
    inconclusive: >-
      Artifact, direction, phase/area, window, or storage classification cannot
      be resolved.

