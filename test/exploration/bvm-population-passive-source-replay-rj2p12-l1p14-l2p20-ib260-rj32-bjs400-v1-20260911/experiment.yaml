    phase: passive_capture
    mask: '0011'
    physical_solve: true
  - id: PASSIVE_N3_0111
    directory: runs/PASSIVE_N3_0111
    phase: passive_capture
    mask: '0111'
    physical_solve: true
  - id: PASSIVE_N4_1111
    directory: runs/PASSIVE_N4_1111
    phase: passive_capture
    mask: '1111'
    physical_solve: true
  - id: REPLAY_N2_0011_RJ2P12
    directory: runs/REPLAY_N2_0011_RJ2P12
    phase: exact_current_replay
    source_case: PASSIVE_N2_0011
    physical_solve: true
  - id: REPLAY_N3_0111_RJ2P12
    directory: runs/REPLAY_N3_0111_RJ2P12
    phase: exact_current_replay
    source_case: PASSIVE_N3_0111
    physical_solve: true
  - id: REPLAY_N4_1111_RJ2P12
    directory: runs/REPLAY_N4_1111_RJ2P12
    phase: exact_current_replay
    source_case: PASSIVE_N4_1111
    physical_solve: true

physics_solve_count: 6

run_matrix:
  passive_masks: ['0011', '0111', '1111']
  replay_cases: [REPLAY_N2_0011_RJ2P12, REPLAY_N3_0111_RJ2P12, REPLAY_N4_1111_RJ2P12]
  exact_new_physical_solves: 6
  no_other_solves: true

frozen_source_fixture:
  bvm_count: 4
  bvm_instances:
    - XBVM1 WL1 BL1 SE1 COMMON_SL BVM
    - XBVM2 WL2 BL2 SE2 COMMON_SL BVM
    - XBVM3 WL3 BL3 SE3 COMMON_SL BVM
    - XBVM4 WL4 BL4 SE4 COMMON_SL BVM
  common_sl: COMMON_SL
  jsl_count: 8
  jsl_model: jjmit
  jsl_area: 5.0
  jsl8_passive_branch: B_JSL8 JSL_NODE7 0 jjmit area=5.0
  jsl8_closed_loop_reference_branch: B_JSL8 JSL_NODE7 QBIN jjmit area=5.0
  source_probe: I(B_JSL8)
  passive_endpoint: ground
  receiver_removed: [QB, six_stage_JTL, R_TERM]
  orientation: >-
    The branch first-to-second convention is preserved. Positive
    I(B_JSL8) is the JSL7-to-downstream-endpoint direction; replay uses
    I_REPLAY 0 QBIN, so no sign change is applied.

frozen_receiver:
  only_replay_rj2_ohm: 12.0
  L1_pH: 1.4
  L2_pH: 2.0
  RJ1_ohm: 32.0
  IBias_uA: 260.0
  BJS_area: 4
  BJ1_area: 0.9
  BJ2_area: 2
  L3_pH: 1.3
  jtl_stages: 6
  termination_ohm: 10.0

stimulus:
  amplitude_uA: 100.0
  rise_time_ps: 1.0
  fall_time_ps: 1.0
  plateau_ps: 9.0
  timing_ps:
    idle_0: [0, 50]
    write0: [50, 61]
    idle_1: [61, 70]
    zero_state_read_control: [70, 81]
    idle_2: [81, 90]
    write1: [90, 101]
    settle: [101, 110]
    final_read: [110, 121]
    tail: [121, 200]
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  final_read_masks_only: ['0011', '0111', '1111']
  tran: .tran 0.1p 200p

windows:
  semantics: half-open [start_ps, end_ps); actual stored raw grid only
  source_current_ps: [[110, 121], [121, 124], [121, 126], [121, 130], [110, 200]]
  replay_navigation_ps: [110, 121, 130, 200]
  critical_n3_window_ps: [121, 130]
  terminal_final_window_ps: [110, 200]

probes:
  passive:
    controls: all I(I_WL1..4), I(I_BL1..4), I(I_SE1..4)
    bvm: P/V/I for B_JM1, B_JM2, B_JS1, B_JS2 and I/V for storage/output branches in all four XBVM instances
    shared_boundary: V(COMMON_SL)
    jsl: P/V/I for B_JSL1 through B_JSL8
  replay:
    source: I(I_REPLAY)
    qb: [P(BJ1|XBQ1), V(BJ1|XBQ1), I(BJ1|XBQ1), P(BJ2|XBQ1), V(BJ2|XBQ1), I(BJ2|XBQ1), V(QBOUT), I(L1|XBQ1), I(L2|XBQ1), I(LIN|XBQ1)]
    jtl: V(JTL1_OUT), V(JTL2_OUT), V(JTL3_OUT), V(JTL4_OUT), V(JTL5_OUT), V(JTL6_OUT)
    terminal: I(R_TERM)

metrics:
  source_current: [max, min, signed_area_A_s, absolute_area_A_s, zero_crossing_brackets, positive_support_duration_ps]
  source_integration: actual_stored_time_grid_trapezoid
  phase_navigation: cumulative_unwrapped_phase_from_110ps_in_raw_radians_and_display_turns
  phase_navigation_thresholds_turns: [0.5, 1.5, 2.5, 3.5]
  terminal_activity_threshold_V: 0.00001
  terminal_activity: peak_time, valley_boundaries, signed_integral, area_over_phi0, separation
  scientific_response_count: NOT_DEFINED_HERE

transformations:
