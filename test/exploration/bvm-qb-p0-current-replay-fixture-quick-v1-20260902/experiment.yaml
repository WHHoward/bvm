  source_occurrence: 0
  replay_output_signal: I(I_REPLAY)
  source_orientation: 0 -> IN
  positive_current_direction: into_QB_IN
  source_rule: >-
    Use every P0 source sample and its actual timestamp as a literal PWL pair;
    no fit, smoothing, scaling, holding, truncation, negative-lobe removal,
    retiming, resampling, or interpolation.
