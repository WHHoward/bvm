acceptance:
  - {id: AC1, condition: "Before edits/runs, record only /home/howard/JoSIM/build/josim-cli v2.7.2837d13, SHA-256 48655cb31d6297ba571a300c3c7e0b5665d11c8cc1f02b5b4f6e9b0db50440b2; PATH and other binaries are prohibited.", evidence: [preflight-log, manifest.yaml]}
  - {id: AC2, condition: "Create exactly one immutable 12-run root: four named init/read-control cases x exactly 0.05/0.025/0.0125 ps, copied active closure, one R_LD SL1 0 12 load, fixed initialization/read PWL, exact-zero matched-control knots, and no unregistered change. Required probes are V(SL1) SL1->0; I(L_SL|XBVM1) N8->SL1; P(B_JM1|XBVM1)/V(B_JM1|XBVM1) N1->n_jm1o vts=+1 rd=+1; and P(B_JM2|XBVM1)/V(B_JM2|XBVM1) n_jm2i->N2 vts=+1 rd=+1.", evidence: [manifest.yaml, inputs, closure-hashes]}
  - {id: AC3, condition: "All raw runs preserve CSV/stdout/stderr/input closure/hash and actual time. Required source/input/direct-JM1/direct-JM2 columns are finite, complete, strictly increasing, and cover every registered window; probe strings, endpoint order, voltage-to-phase sign, and reporting direction must equal AC2 exactly.", evidence: [raw-csv, stdout-stderr, manifest.yaml]}
  - {id: AC4, condition: "Apply the per-timestep/per-case pre-window JM1/JM2 p2p <=0.020 rad readiness check and positive/negative JM1/JM2 mean-vector L-infinity separation >=0.100 rad; report them only as timestep comparability/readiness, never a memory/state Gate.", evidence: [analysis.md, analysis.json]}
  - {id: AC5, condition: "Report full signal/control/control-corrected source waveforms, the registered control applicability status and explicit NOT_APPLICABLE reasons, exact-decimal common-time coverage, pre/post platform means in rad and derived turns, and activity-window endpoint delta in rad/derived turns plus same-JJ actual-time area/residual. Do not use event/fluxoid/logical/Gate language.", evidence: [analysis.md, analysis.json]}
  - {id: AC6, condition: "Apply only the frozen S1 two-pair ladder, zero-tolerance decimal timestamp rule, control applicability hierarchy, bands, and no-extension stop rule. Report artifact validity separately from numerical CONVERGED/INCONCLUSIVE/INVALID and bounded per-timestep observations separately from any converged characterization.", evidence: [analysis.md, analysis.json]}
  - {id: AC7, condition: "Receipt hashes/maps all created artifacts and AC1-AC6; final verify-task succeeds. Claude stops after delivery for required Copilot skeptical evidence review before Codex audit.", evidence: [receipt.yaml, verify-task-log]}
invalid_conditions:
  - "Wrong binary, missing/misnamed source or direct-JJ probe, endpoint/direction mismatch, missing copied closure/hash, raw overwrite, solver/CSV/NaN/nonmonotonic/duplicate-time failure, truncated registered window, or an out-of-scope write."
  - "Any receiver/JTL/BQ/DCSFQ_BVM/T1 attachment, Gate/logical/SFQ/fluxoid claim, load/bias/device/read sweep, unregistered parameter/timestep, network/install/commit/delete/rename action."
inconclusive_conditions:
  - "Artifact is valid but an S1 readiness, applicable convergence, matched-control residual, or exact common-time comparison requirement fails at the fixed 0.0125-ps maximum."
  - "Artifact is valid and supports named per-timestep observations, but numerical convergence is not established; those observations must not be upgraded to a timestep-converged characterization."
stop_conditions:
  - "HEAD, issuer dirty snapshot, scope hash, binary provenance, authority, metric spec, or lock preflight differs."
  - "Need a fifth case, fourth timestep, changed closure/stimulus/load/window/band/timestamp rule, interpolation/resampling/time alignment, parameter sweep, or receiver/Gate interpretation."
  - "Preflight finds a concrete reproducible active closure, stimulus, probe, or fixture inconsistency; run root exists; any required action needs unsupported authority; or final verify-task fails. Preserve evidence and report BLOCKED/DEVIATED."
