verdict_summary: >-
  AREA=.08 lowered the modeled B_OUT Ic from 10 uA to 8 uA but did not produce
  a complete read1 output transition.  The largest read1 B_OUT segment was
  0.02012177 turn with same-JJ area magnitude 0.02012715 turn, versus
  0.02205835/0.02206765 turn at the accepted AREA=.10 baseline.  Read0 and
  both READ=0 controls remained non-complete.  Secondary transfer remained
  state-dependent, while read1 secondary current decreased and the effective
  damped beta diagnostic changed from about 0.805 to 0.605.  The bounded
  interpretation is B+C loaded transfer/dynamic limitation more plausible
  than pure Ic margin alone; B and C are not uniquely separated by this one
  AREA point.  No topology/BVM change, sweep, R1c, JTL, or Candidate upgrade.
