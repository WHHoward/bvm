probes:
  upstream: "V(COMMON_SL); P/V/I(B_JSL1..8); V(TLINE_IN,0); I(T_BVM_QB)"
  receiver_boundary: "V(QBIN); I(LIN|XBQ1); V(LIN|XBQ1)"
  qb: "P/V/I(BJS|XBQ1); P/V/I(BJ1|XBQ1); P/V/I(BJ2|XBQ1); I/V(L1|XBQ1); I/V(L2|XBQ1); I/V(L3|XBQ1); I/V(RJ1|XBQ1); I/V(RJ2|XBQ1); V(QBOUT)"
  bvm: "active BVM JS1/JS2 P/V/I; LS1/LS2/LS3/R_S/LM3/L_SL I/V; JM1/JM2 P/V/I"
  downstream: "all JTL1..6 B01/B02 P/V/I and stage outputs; terminal voltage/current"
  tline_current_boundary_note: "I(T_BVM_QB) is the exposed first-port TLINE branch; I(LIN|XBQ1) is the receiver-side KCL current at QBIN because the second internal TLINE branch has no independent public print label."

registered_metrics:
  N2: "history/control CLEAN; first and second QB response; ordered BJS/BJ1/BJ2/JTL/terminal chronology; measured forward delay"
  N3: "JS1/JS2 focus p2p; same-JJ voltage-area; 114.8 ps JS1 navigation landmark; later JS2 activity; JSL8/source current; LS3/RS; COMMON_SL; QBIN; first BJ1/BJ2"
  tline_timing: "forward upstream-port to downstream-port landmark; receiver-generated downstream-to-upstream feature; overall chronology shift"
  distortion: "peak/current area; QBIN voltage; TLINE port waveform features; overshoot/ringing; zero crossings; width"
  phase_semantics: "P raw radians; continuous unwrap then rad/(2*pi) navigation only; not SFQ count"
  area_semantics: "same JJ, same endpoints/direction/window, actual-grid trapezoid; not an SFQ count"
  mechanism_guard: "Do not call timing dephasing confirmed if impedance/reflection/amplitude distortion dominates."

forbidden:
  - QB parameter changes
  - JTL/capture-stage changes
  - BVM/LS3/RS changes
  - amplitude scaling
  - extra delay points
  - extra Z0 values
  - timestep sweep
  - impedance matching network
  - sentinel follow-up
  - READ extension

