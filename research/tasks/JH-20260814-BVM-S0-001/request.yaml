invalid_conditions:
  - "Wrong binary, missing direct/source probes, raw overwrite, solver/CSV failure, changing any frozen stimulus/closure/window/band, a pre-existing run root, or any out-of-scope write."
  - "Any receiver/JTL/BQ/DCSFQ_BVM attachment, Gate/logical/SFQ/fluxoid claim, unregistered parameter or timestep, network/install/commit/delete/rename action."
inconclusive_conditions:
  - "Valid raw data but initial-state admissibility or any registered convergence comparison is not met at the fixed ladder maximum."
  - "Valid source-side observation with no physical success/Gate interpretation, absent FWHM condition, or a state/read relationship beyond this calibration scope."
stop_conditions:
