research_question: >-
  Holding B_OUT near critical drive for a fixed time (4.5 uA direct-drive
  trapezoid, flat-top hold), can it complete its first full 2*pi phase
  transition?  Tests the R2-E leading hypothesis: insufficient near-critical
  dwell time, not peak amplitude, blocks switching.
hypothesis: >-
  H_dwell (primary): at 4.5 uA the junction plateaus within ~18 nA of Ic and
  creeps toward pi/2 at ~1.3 turn/ns; a flat-top hold of ~10+ ps should let the
  creep reach the critical angle and trigger the first complete transition.
alternative_hypotheses:
  no_dwell_effect: >-
    Even 20 ps hold stays sub-turn (Situation C): the plateau current decays or
    the diversion grows during hold, so dwell alone cannot close the gap;
    receiver architecture reassessment follows.
  unstable_activation: >-
    First crossing runs away into multi-turn/free-running (Situation B):
    activation solved, one-shot/retrap becomes the next problem.
variable:
  name: flat_top_hold_ps
  units: ps
  values: [0.0, 5.0, 10.0, 20.0]
  baseline: 0.0 (triangle-like control)
  only_changed_variable: true
  maximum_operating_points: 4
  stop_rule: sequential ascending execution; stop immediately at first
    qualifying complete transition.
drive_geometry:
  amplitude_uA: 4.5 (fixed)
  shape: trapezoidal PWL on I_DIRECT 0 N_SEC; rise/fall edges fixed at 20 ps
    linear ramps matching the R2-E triangle slope; center of the pulse envelope
    kept at 104.51 ps by symmetry where possible.
  edge_definition:
    rise: linear 0 -> 4.5 uA over 20 ps
    fall: linear 4.5 uA -> 0 over 20 ps
    hold: flat 4.5 uA between rise end and fall start
  points:
    - {id: h00, hold_ps: 0.0, note: triangle-like control, zero_points [84.51,
       104.51, 124.51]}
    - {id: h05, hold_ps: 5.0, zero_or_knee_points [94.51, 99.51, 109.51, 124.51]}
    - {id: h10, hold_ps: 10.0, knee_points [94.51, 104.51, 114.51, 124.51]}
    - {id: h20, hold_ps: 20.0, knee_points [84.51, 104.51, 124.51, 144.51],
       note: symmetric about 104.51? no - center shifts to 114.51 to keep 20ps
       edges; recorded as geometry note}
  geometry_note: >-
    Adding hold time necessarily extends the pulse envelope beyond the original
    40 ps base.  Rise/fall edges stay 20 ps; the envelope center moves right by
    hold/2.  This is the unavoidable geometric consequence of holding longer and
    is recorded here rather than hidden.
