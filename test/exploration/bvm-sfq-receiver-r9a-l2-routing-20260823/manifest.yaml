analytic_selection:
  dominant_timescale_ps: 1.5
  candidate_L2_pH: [3.0, 2.5, 2.0]
  selected_L2_pH: 2.5
  selection_basis: >-
    Middle point: approximately 36 percent reactance reduction at 1.5 ps and
    a moderate first-order static flux-preserving proxy shift, avoiding the
    more aggressive 2.0 pH read0/load-line risk.
  caveat: >-
    L1*I(L1)+L2*I(L2) current redistribution is only a first-order selection
    proxy, not a full nonlinear fluxoid solution.

