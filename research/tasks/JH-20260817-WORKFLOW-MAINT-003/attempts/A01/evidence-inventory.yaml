#   attempts/A01/receipt.yaml; the canonical A02 receipt at
#   attempts/A02/receipt.yaml can never represent that deliverable, so
#   verify-task fails structurally for any multi-attempt task that uses a
#   single-path RECEIPT deliverable.  003 repairs the verifier to aggregate
#   task-wide (union of canonical receipts) and uses the glob
#   attempts/**/receipt.yaml for its own D4; 002 itself remains historical
#   read-only with its A01/A02 conflict recorded here as lineage.
