question: >-
  在固定 13 ps、12×320、logical1/read、Lin=0.8 pH scaled-QB 条件下，
  将真实 P0 physical BVM→12×JSL→QB 的完整输入支路电流 literal replay
  到同一个 QB，是否足以重现 P0 的 PRE 状态、QB 内部轨迹和 BJL2 严格本地分类？

hypotheses:
  H1: >-
    current-only replay 在输入波形、PRE 状态和 W3/W4 QB 轨迹上都足够接近 P0，
    可作为后续隔离输入边界的 causal fixture。
  H2: >-
    replay 输入、符号、时间网格或 PRE preload 不等价，导致比较无效或只能得到
    QUICK_AMBIGUOUS；此时不能解释 W3/W4。
  H3: >-
    输入 replay 有效且 PRE 等价，但 QB 轨迹仍不能重现 P0；这只支持
    current-only replay insufficient，不证明 source-impedance mechanism。

