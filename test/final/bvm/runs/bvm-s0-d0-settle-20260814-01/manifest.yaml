research_question: >-
  For the three fixed write-only cases, which (if any) preregistered adjacent
  settling-window pair first satisfies the fixed stability and
  distinguishability rule and remains so through the final witness window?

hypotheses:
  primary: >-
    The initialized junction signatures settle monotonically; a preregistered
    adjacent settle-window pair eventually becomes stable and distinguishable
    and stays so through the final witness window.
  alternatives:
    - No pair qualifies (INCONCLUSIVE; S0 remains blocked).
    - Stability is reached but distinguishability is lost (control drift).

predeclared_outcomes:
  pass: >-
    First adjacent pair (settle_35,55 / 55,75 / 75,95 / 95,115) in which both
    windows are stable (>=2 finite samples, p2p <= 0.02 rad, all cases and
    both JJ) and distinguishable (all three case-pair L-inf >= 0.10 rad), with
    every later registered window also stable and distinguishable; the pair's
    earliest start is the operational readiness bound within the tested grid.
  fail: >-
    Any guard fails, or direct P/V output is unavailable; conclusion
    INCONCLUSIVE, S0 remains blocked.
  inconclusive: >-
    Artifacts valid but no preregistered adjacent pair satisfies the rule, or
    only an operational readiness bound is established without logical
    read0/read1 identity.
  invalid: >-
    Missing provenance/columns, nonmonotonic time, nonfinite values, solver
    error, truncated windows, pre-existing run root, binary mismatch, or raw
    overwrite.

