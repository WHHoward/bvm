acceptance:
  - {id: AC1, condition: "The canonical matrix has exactly the seven unique object_ids bvm_storage, bvm_source_output, published_qb, bq_v4, standard_dcsfq, dcsfq_bvm, canonical_jtl. Every object has structured current_evidence, observable, parameter_provenance, characterization_status, reproduction_status, unknowns, claim_limitation, and next_discriminator fields.", evidence: [SCIENTIFIC_RECONSTRUCTION_OBJECT_MATRIX_V1.yaml, validator-log]}
  - {id: AC2, condition: "Every evidence/source entry is within authorized read scope, exists, carries SHA-256, source role, review state, and locator. INVENTORIED_UNREVIEWED is distinct from unavailable and cannot support [PUBLISHED]. Every [PUBLISHED] parameter has a reviewed local source plus locator; all UNKNOWN/INFERRED items identify field, reference status, project value when present, provenance tag, reviewed source boundary, impact, and next discriminator.", evidence: [SCIENTIFIC_RECONSTRUCTION_OBJECT_MATRIX_V1.yaml, validator-log]}
  - {id: AC3, condition: "Each object declares only allowed per-object reproduction and independent characterization status, with evidence-grounded rationale and observable semantics. No project-tuned/inferred behavior is presented as published reproduction; a new run needed to upgrade status is only a next_discriminator, not executed.", evidence: [SCIENTIFIC_RECONSTRUCTION_OBJECT_MATRIX_V1.yaml, validator-log]}
  - {id: AC4, condition: "The matrix explicitly states its PASS object is complete and honest reconstruction/provenance knowledge-state freeze. It explicitly excludes physical completeness, published reproduction completeness, candidate validation, interface/system Gate, T1, hardware and paper-novelty claims. UNKNOWN/INFERRED/R0/PARTIAL_R1 and uncharacterized statuses are legal.", evidence: [SCIENTIFIC_RECONSTRUCTION_OBJECT_MATRIX_V1.yaml]}
  - {id: AC5, condition: "REFERENCE_PROVENANCE.md is reduced to a clear pointer/index to the canonical matrix without duplicating a second parameter register; the matrix declares W5B provenance closure eligible only upon this task audit acceptance, while W5A/W5C remain independent and open.", evidence: [REFERENCE_PROVENANCE.md, SCIENTIFIC_RECONSTRUCTION_OBJECT_MATRIX_V1.yaml]}
  - {id: AC6, condition: "An attempt-local deterministic validator rejects missing/duplicate object IDs, out-of-scope/missing/hash-mismatched evidence, PUBLISHED from unreviewed evidence, bare UNKNOWN, undeclared status, provenance laundering by canonical field id, physical/PASS semantic bypass, and W5B/W5A/W5C conflation; it passes the delivered matrix.", evidence: [validate_scientific_reconstruction_object_matrix.py, validator-log]}
  - {id: AC7, condition: "Receipt records no JoSIM/network/external-contact activity, no unregistered status upgrade, no frozen-path edit, and final handoff verification succeeds.", evidence: [receipt.yaml, verify-task-log]}
invalid_conditions: ["Any circuit run, tuning, external contact, network use, unregistered status upgrade, or frozen-path edit.", "Any second competing provenance register, unscoped or unhashed evidence source, provenance laundering, or claim beyond the knowledge-state ceiling.", "Any candidate/physical/interface/system/T1/paper-novelty conclusion."]
inconclusive_conditions: ["An object/source cannot be bounded with the authorized local corpus; record it as UNKNOWN with an exact discriminator, unless even object identity cannot be recorded, then BLOCKED.", "A desired status requires a new circuit run, external source retrieval, or author contact; record the discriminator and do not perform it."]
stop_conditions: ["Any scope, HEAD, dirty snapshot, HANDOVER, metric-spec, or frozen-input mismatch.", "Need to edit outside authorized write paths, run JoSIM, use network/external contact, change circuits/raw/tests, or define/validate a candidate or Gate.", "Need a second provenance register, or any status elevation not supported by a hash-bound reviewed source/evidence entry."]
