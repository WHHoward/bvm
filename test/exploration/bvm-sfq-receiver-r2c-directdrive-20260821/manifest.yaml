  OUTPUT_ANALYSIS: [94.0, 170.0]
  POST: [130.0, 170.0]
  STORAGE_POST: [140.0, 150.0]
event_criterion:
  definition: >-
    A local complete event requires a continuous monotonic segment of the
    adjacent-sample-unwrapped P(B_OUT|XTRIG) with abs(delta(phi))/(2*pi) >= 1.0
    turn, segment start no later than 130 ps, and same-segment direct
    V(B_OUT|XTRIG) trapezoid integral / Phi0 within 0.05 turn of the phase
    delta.  I_peak > Ic and voltage peaks are never sufficient oracles.
  post_event_checks: retrap (phase returns to plateau), free-running (continued
    monotonic segments), multi-turn count, ringing (post-window |V| peaks).
interpretation_plan:
  threshold_found: >-
    If a point in 3-5 uA produces the first complete transition with clean
    controls, record THRESHOLD_FOUND at that amplitude, stop ascending, and
    report the delivered-vs-required margin of the real chain (~1.46 uA spike).
  no_threshold_in_matrix: >-
    If even 5 uA remains sub-turn, report NO_THRESHOLD_IN_BOUNDED_MATRIX and
    analyze failure mode (charge vs C*Phi0, duration filtering, damping);
    do not auto-extend amplitudes.
  activation_unstable: >-
    If the first switching point shows multi-turn/free-running/persistent
    ringing, report ACTIVATION_WITH_UNSTABLE_RUNNING; this bounds the
    one-shot/retrap problem; do not call it exactly-one SFQ.
outputs:
