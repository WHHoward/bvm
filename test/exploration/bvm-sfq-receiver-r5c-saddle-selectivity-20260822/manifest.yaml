    build/josim-cli -o raw/<case>/run-01.csv inputs/<case>.cir

windows:
  pre: [80.0, 90.0] # ps; operating-point median
  activity: [97.0, 130.0] # ps; canonical READ causal window
  post: [150.0, 170.0] # ps; retrap/persistent-state check
  read_state: [20.0, 95.0] # ps and post-window storage guard comparison

signals:
  junctions:
    - {name: B_SET, phase: P(B_SET|XTRIG), voltage: V(B_SET|XTRIG), current: I(B_SET|XTRIG), orientation: N_B_to_N_A}
    - {name: B_TRIG, phase: P(B_TRIG|XTRIG), voltage: V(B_TRIG|XTRIG), current: I(B_TRIG|XTRIG), orientation: N_TRIG_to_0}
  inductors:
    - {name: L_QB, current: I(L_QB|XTRIG), orientation: N_A_to_N_B}
    - {name: L_TX, current: I(L_TX|XTRIG), orientation: N_PICK_to_N_TRIG}
  guards:
    - V(SL1)
    - V(N6|XBVM1)
    - P(B_JM1|XBVM1)
    - P(B_JM2|XBVM1)
    - P(B_JS1|XBVM1)
    - P(B_JS2|XBVM1)
    - I(R_GAUGE|XTRIG)

event_oracle:
  complete_local_set_event:
    - continuous unwrapped P(B_SET|XTRIG) trajectory
    - exactly one monotonic segment reaching at least 1.0 turn in either direction
    - segment onset within [97,130) ps
    - same-segment direct V(B_SET|XTRIG) integral / Phi0 agrees with phase within 0.05 turn
    - post-event retrap: bounded stable phase/current and V decay in [150,170) ps
    - no second complete segment in [20,170] ps
  read0_and_controls:
    - zero complete B_SET segments in either direction
    - no free-running or self-oscillation
  insufficient_alone:
    - I_peak_gt_Ic
    - voltage_peak
    - phase_range_without_monotonic_segment
    - derivative_activity_samples

predeclared_outcomes:
  pass: >-
    read1 has exactly one qualifying complete same-JJ B_SET slip with phase/V-area
    consistency and retrap; read0 and both controls have zero complete slips;
    B_TRIG/source, SL/N6, JM1/JM2 and JS1/JS2 guards remain within the bounded
    R5-A-class behavior.
  fail: >-
    read1 has no qualifying complete slip, more than one slip, no retrap, or
    read0/control produces a complete slip/free-running response.
  inconclusive: >-
    artifact is valid but the event boundary, phase-area mapping, post window,
    or source/storage guard classification is unresolved; no automatic promotion.
  invalid: >-
    nonzero solver failure, malformed/truncated CSV, missing required probes,
    nonmonotonic time, NaN/Inf, or provenance failure preventing reconstruction.

