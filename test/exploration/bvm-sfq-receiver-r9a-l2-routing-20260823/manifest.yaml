research_question:
  single_question: >-
    With the accepted R7-A input-side routing point restored, does reducing
    native-QB L2 to 2.50 pH improve node3-to-node4/BJL2 dynamic transfer or
    operating margin while preserving read0 selectivity and the canonical BVM
    source/storage guard?

hypotheses:
  primary: >-
    At the approximately 1.5 ps read1 transient timescale, lower L2 reactance
    routes a larger fraction of the front-stage perturbation into L2/BJL2.
  alternatives:
    - >-
      L2 changes settled KCL/phase/current operating points without clear
      dynamic routing gain.
    - >-
      The L2 point does not support the passive load-line routing hypothesis.
    - >-
      L2 causes reflected-load back-action, nonselective activity, or
      free-running behavior.
    - >-
      Read1 produces exactly one BJL2 local phase/area-consistent event.

