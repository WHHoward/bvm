schema_version: evidence-first-bjs400-rj2-highside-second-trigger-v2
id: qb-rj2-highside-second-trigger-l1p14-l2p20-ib260-rj32-bjs400-v2-20260910
study_phase: EXPLORATORY
mode: EVIDENCE_FIRST_PHYSICAL
status: PREREGISTERED
role: Experimental Operator + Evidence Packager
workflow_policy: EVIDENCE_FIRST_V1
scientific_analysis_authorization: NOT_GRANTED
scientific_analysis_performed: false

question: >-
  At fixed L1=1.4pH, L2=2.0pH, IBias=260uA, RJ1=32ohm and the accepted
  BJS400 ARRAY history, record the bounded mechanical response as RJ2 is
  increased through new values 12/14/16ohm, with the exact RJ2=10ohm pair
  reused from the canonical high-side experiment.  After each RJ2 pair,
  evaluate the ZERO_STATE_READ_CONTROL, 0001 first-response and second-trigger
  guardrails before authorizing the next pair.
motivation: >-
  This is a staged high-side RJ2 second-trigger exploration.  The prior
  canonical high-side data supplies an exact RJ2=10ohm reference; the new
  values are bounded candidates, not a pre-decided threshold search result.
interpretation_ceiling: >-
  Preserve OBSERVED, DERIVED, BOUNDED_RESULT and UNKNOWN separately.  No phase
  turn, voltage area, terminal area, current sign, or threshold is an SFQ count.
  No mechanism, threshold, optimum, route choice, hardware claim, or follow-up
  solve is authorized by this evidence-only run.

physical_authority:
  experiment: test/exploration/qb-rj2-highside-rearm-boundary-l1p14-l2p20-ib260-rj32-bjs400-v1-20260910
  git_head: 345d54e6ebf9f0e8b39af616d942ff800ea4e0a7
  source_manifest_sha256: 31752f9e74b95d1d787d88c146a1a7d650da5d37ac3a4a3a035494a604ef1b4d
