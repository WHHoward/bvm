  parameter_semantics: >-
    AREA follows JoSIM src/JJ.cpp: Ic and C are multiplied by AREA, while RN
    and R0 are divided by AREA.  The beta estimates are dynamic parallel-R
    estimates only; they are not substituted for the actual transient model.
mechanism:
  first_event: >-
    The canonical read1 SL current/voltage excursion adds to the independent
    15 uA trigger bias.  B_TRIG voltage drives L_Q; mutual coupling transfers
    a pulse through L_SEC into the 35 uA-biased B_OUT loop, which is below its
    50 uA Ic before the read.
  self_quench: >-
    Once B_TRIG develops voltage, R_Q dissipates the primary excursion and
    the output loop plus R_LOAD reflects a transient load through K_TX.  These
    paths are intended to reduce the post-event effective trigger drive and
    pull both junctions toward a bounded retrapping state.
  sign_to_verify: >-
    L_Q is oriented N_TRIG->N_Q and L_SEC N_SEC->OUT_PORT; positive K_TX is
    expected to inject the first output pulse in the output bias direction.
    This is a design inference and must be checked from raw branch currents.
