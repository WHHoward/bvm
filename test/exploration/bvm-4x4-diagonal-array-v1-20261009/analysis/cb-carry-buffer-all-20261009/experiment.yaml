changed:
  - CBU_CHAIN_TOPOLOGY=CB_CARRY_BUFFER_ALL replaces only the six D1-D6 CBU-stage input topologies
frozen:
  - BVM/QB/array-CB/sJTL/T1/DFF/JJ model sources and all component parameters
  - 400u shared WL/BL source setpoints, 100u cell-local SE, and original four stimulus phases
  - all array sJTL counts, D0 entrance JTL, seven T1s, DFF, loads, biases, and clocks
  - GLOBAL_ONESHOT at 200 ps, DT=0.01p, STOP=300p
  - no added sJTL/JTL/MERGE, no join-output CB, no carry/DOUT terminal loads
topology:
  d0: DOUT_D0 -> original D0 entrance JTL -> T1_D0.I
  d1_d6: DOUT_Dk -> V_CBU_A_Dk -> JOIN_Dk; C_D(k-1) -> V_CARRY_IN_Dk -> canonical CB_0928 -> V_CBU_B_Dk -> same JOIN_Dk -> V_T1_LINK_Dk -> T1_Dk.I
  carry_chain: C_D0..C_D5 each feeds exactly the corresponding new CB_CARRY_D(k+1)
  final_carry: C_D6 -> DFF_IN -> DFF.O
  canonical_cb_sha256: 70a6af05acccb7c354799d5b1b7542c86c677970681473f559bbf0f7e4d6d370
  added_carry_cb_count: 6
windows_ps:
  ARRAY_FINAL_READ: [110, 121]
  PRE_CLOCK: [121, 200]
  CLOCK_EDGE: [200, 205]
  POST_CLOCK: [205, 300]
  TOTAL: [0, 300]
  boundary: "half-open [start,end)"
probes:
  profile: t1_chain_focus / CB_CARRY_BUFFER_ALL
  per_stage: [DOUT and array-final-CB P/V, Carry-CB input/output, CB BJ1/BJ2 P/V, both JOIN branch currents and T1-link current, JOIN voltage, T1 I/CLK/S/C, T1 B_J1/B_J2/B_J9/B_J10/B_J11 P/V]
  dff: [DFF_IN, CLK_DFF, DFF_O, key JJ P/V, data/clock branch currents]
  raw_phase_unit: radians
  turns_semantics: delta/(2*pi) navigation only, never event count
  current_semantics: zero-volt sensor direction as netlisted
visual_authority:
