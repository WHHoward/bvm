observations:
  - "Artifact VALID; numerical verdict INCONCLUSIVE at fixed 0.0125 ps max depth."
  - "Coarse pair 0.05->0.025 fails pointwise+RMS bands on all four read observables (e.g. pos V pw 24.45 uV vs 9.04 uV band; pos V peak 0.9007 vs 0.9036 mV)."
  - "Fine pair 0.025->0.0125: pointwise band passes everywhere; RMS band fails narrowly on positive read only (V 2.00 vs 1.81 uV; I 0.167 vs 0.151 uA)."
  - "Latency (5.00/5.02/5.01 ps pos; 10.00 ps neg), FWHM (5.90/5.89/5.89 ps), readiness, controls (12-12 nV residual) all pass; predictions essentially met (pos peak at low edge of +0.904..+0.905 mV band)."
interpretations:
  - "The remaining drift is amplitude/shape (RMS) of the read excursion, not timing; the 0.05 ps grid under-resolves the ~5.9 ps-wide excursion. This is a proposed interpretation for audit, not a Gate."
