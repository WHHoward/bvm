event_oracle:
  identical_to_r5a_amended: direction-neutral complete segment >= 1 turn of
    unwrapped P(B_SET|XTRIG), onset in [97,130) ps, same-JJ V-area residual
    <= 0.05 turn, retrap after, no second complete event in [20,170] ps.
  read0_and_controls: zero complete segments either direction.

r5a_vs_r5b_comparison_required:
  - phase trajectory shape and excursion extent
  - V-area per lobe and net
  - oscillation decay envelope (R5-A sustained; R5-B expected damped)
  - first escape timing (crossing of static boundary vs actual slip time)
  - second-event risk window
  - source back-action (B_TRIG range, SL/N6 peaks, JM signs)

back_action_guards:
