event_semantics:
  raw_phase_units: JoSIM P output in radians
  phase_display_conversion: continuous_unwrap_rad_divided_by_2pi
  event_basis: >-
    Same junction, same continuous monotonic segment, phase delta and
    same-segment integral(V dt)/Phi0, with direction and completeness retained.
  complete_min_abs_turns: 1.0
  clean_upper_abs_turns: 1.15
  clean_separated_requires: >-
    complete phase/area-consistent segment plus bounded/retrapped interval
    before the next same-polarity complete event
  not_event_count_authority: [Vpeak, I_over_Ic, whole_window_phase, whole_window_area]
  distinction_required:
    - FOUR_SEPARATED_EVENTS
    - ONE_CONTINUOUS_MULTI_TURN_RUNNING_SEGMENT
    - MIXED_OR_AMBIGUOUS_PHASE_ACTIVITY
    - LOCAL_EVENT_WITH_DOWNSTREAM_TRANSPORT_LOSS
  source_order: [BJs, BJ1, BJ2, JTL1, JTL2, JTL3, JTL4, JTL5, JTL6]
observables:
  qb:
    - P(BJS|XBQ1)
    - V(BJS|XBQ1)
    - P(BJ1|XBQ1)
    - V(BJ1|XBQ1)
    - P(BJ2|XBQ1)
    - V(BJ2|XBQ1)
    - V(QBIN)
    - V(QBOUT)
  jtl_each_stage:
    - P(B01|XJTL1_N)
    - V(B01|XJTL1_N)
    - P(B02|XJTL1_N)
    - V(B02|XJTL1_N)
  optional:
    - I(BVMOUT)
    - I(LIN|XBQ1)
    - I(I_QB_BIAS)
analysis_plan:
  per_run_outputs:
    - local voltage pulse regions
    - same-interval voltage area divided by Phi0
    - same-interval phase delta divided by 2pi
    - onset, peak, end, polarity, settling, event index
    - complete segment count
    - clean separated event count
    - largest segment turns
    - any segment over 1.15 turns
    - continuous multi-turn running status
  transport: "BJ2 -> JTL1 -> JTL2 -> JTL3 -> JTL4 -> JTL5 -> JTL6"
  required_table_columns:
    - timestep
    - BJ2_READ_net_turns
    - BJ2_quantized_event_count
    - JTL1_B01_net_turns
    - JTL1_B01_transported_event_count
    - JTL6_B01_transported_event_count
    - final_classification
  convergence_rule: >-
    A stable event count requires the independently enumerated clean separated
    event count and identity/onset ordering to remain stable across the finer
    timestep members. Net turns alone never establish convergence.
  causal_attribution_rule: >-
    Timestep-induced branch change is supported only if the new T100 run
    reproduces the historical T100 trajectory/event behavior and the finer
    runs reproduce the Stage-A S1 behavior, with unchanged deck physics and
    no provenance or print-start explanation sufficient to account for it.
    Otherwise attribution remains INCONCLUSIVE or is rejected.
