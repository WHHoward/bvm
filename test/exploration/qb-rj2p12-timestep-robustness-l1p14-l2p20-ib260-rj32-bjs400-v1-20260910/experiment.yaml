  phase_reference: FINAL-origin [101,110)ps baseline
  phase_thresholds: [0.5, 1.5]
  voltage_cluster_rule: "max(5.5*1.4826*baseline MAD, 0.35*positive FINAL peak); 2.5ps peak gap; below-threshold stored valley required to split"
  terminal_rule: "pulse-local intervals share the stored waveform valley; no forced split when valley rule fails"
  labels: [OBSERVED, DERIVED, BOUNDED_RESULT, UNKNOWN]
  no_sfq_count: true

robustness:
