role: Experimental Operator + Evidence Packager

question:
  primary: >-
    At fixed BVM/JSL/QB/JTL settings, compare passive source and isolated
    current-replay responses for final READ masks N1=1000, N2=1100, N3=1110
    and N4=1111.
  bounded_oracle: >-
    The N2-N4 passive captures and their exact-current QB/JTL replays are
    bounded simulation fixtures. N1 is the existing ARRAY_PASSIVE /
    REPLAY_ARRAY result reused by immutable hash-bound reference.
  interpretation_ceiling: >-
    Do not infer a universal read-count law, physical root cause, hardware
    measurement, Gate result, or SFQ event count from these fixtures.

baseline:
  experiment: test/exploration/bvmsim-jm2-passive-capture-replay-v1-20260907
  N1_PASSIVE:
    source_case: ARRAY_PASSIVE
    raw: test/exploration/bvmsim-jm2-passive-capture-replay-v1-20260907/runs/array_passive/raw.csv
    rerun: false
    final_read_mask: '1000'
  N1_REPLAY:
    source_case: REPLAY_ARRAY
    raw: test/exploration/bvmsim-jm2-passive-capture-replay-v1-20260907/runs/replay_array/raw.csv
    rerun: false
    final_read_mask: '1000'

