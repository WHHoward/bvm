working_points:
  L1P12: {L1_pH: 1.2, IBias_uA: 250, RJ1_ohm: 12}
  L1P14: {L1_pH: 1.4, IBias_uA: 250, RJ1_ohm: 12}
  IB260: {L1_pH: 2.0, IBias_uA: 260, RJ1_ohm: 12}
  IB270: {L1_pH: 2.0, IBias_uA: 270, RJ1_ohm: 12}

array_matrix:
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  masks: ["0000", "1000", "0001", "0011"]
  semantics:
    "0000": no BVM active during FINAL READ
    "1000": BVM1 active during FINAL READ
    "0001": BVM4 active during FINAL READ
    "0011": BVM3 and BVM4 active simultaneously during FINAL READ
  mask_scope: FINAL READ only, 110-121ps

single_matrix:
  controls:
    "0": final WL=0, BL=0, SE=0
    "1": final WL=+100uA, BL=0, SE=+100uA
  topology: one BVM -> COMMON_SL -> same 8-JJ JSL -> BJS400 QB -> same 6-stage JTL -> 10ohm termination

stimulus:
  idle_0_50ps: all controls 0
  WRITE0_50_61ps: WL=BL=-100uA; SE=0; 1ps edges and 9ps plateau
  idle_61_70ps: all controls 0
  ZERO_STATE_READ_CONTROL_70_81ps: WL=SE=+100uA; BL=0; 1ps edges and 9ps plateau
  idle_81_90ps: all controls 0
  WRITE1_90_101ps: WL=BL=+100uA; SE=0; 1ps edges and 9ps plateau
  SETTLE_101_110ps: all controls 0
  FINAL_READ_110_121ps: registered ARRAY mask or SINGLE control only
  TAIL_121_200ps: all controls 0
  window_semantics: half-open intervals; control transition points are registered PWL points

source_authority:
  physical_fixture: test/exploration/qb-l1-ibias-rj1-independent-characterization-v1-20260909
  mask_style_reference: test/exploration/bvmsim-4bvm-paperlike-common-sl-accumulation-isolation-v1-20260904
  mask_style_reference_role: bit order and flat whole-run plot style only; not physical or stimulus authority
  bvm: inputs/bvm_jm2_connected.cir
  jjmit: inputs/jjmit.cir
  bq_bjs300_reference: inputs/BQ_parameterized_bjs300_reference.cir
  bq_bjs400: inputs/BQ_parameterized_bjs400.cir
  jtl: inputs/jtl2.cir
  array_template: inputs/array_fixture_template.cir
  single_template: inputs/single_fixture_template.cir
  solver: build/josim-cli
  historical_bridge: references/historical_bjs300 and HISTORICAL_BRIDGE_MANIFEST.json

probe_schema:
  controls_array: I(I_WL1..4), I(I_BL1..4), I(I_SE1..4)
  controls_single: I(I_WL), I(I_BL), I(I_SE)
  bvm_per_instance: P/V/I(B_JM1), P/V/I(B_JM2), P/V/I(B_JS1), P/V/I(B_JS2)
  bvm_branches: I/V(L_M1,L_M2,L_M3,L_PM,R_JM1,L_S1,L_S2,R_S,L_S3,R_SE,L_PSE,L_PSL,R_SL,L_SL)
  shared_boundary: V(COMMON_SL)
  jsl: P/V/I(B_JSL1..8)
  qb: V(QBIN), V(QBOUT), I/V(LIN), P/V/I(BJS), P/V/I(BJ1), I/V(RJ1), I/V(L1), I(IB), V(IB if emitted), I/V(L2), P/V/I(BJ2), I/V(RJ2), I/V(L3)
  jtl_per_stage: P/V/I(B01), P/V/I(B02), V(stage_OUT) for stages 1..6
  terminal: V(JTL6_OUT), I(R_TERM)
  missing_probe_policy: preserve requested probe and mark UNKNOWN; never fabricate

mechanical_qa:
  - exact 24 authorized runs and zero unauthorized extra solves
  - BJS area=4 and exact one-variable working-point/mask/topology differences
  - successful-history stimulus and ARRAY pre-110ps equality
  - raw existence, SHA256, finite values, monotonic actual grid, 0-199.9ps range
  - required probes present or explicitly UNKNOWN
  - raw unchanged during QA/visualization/packaging

visualization:
  profile: COMPACT_FLAT_WHOLE_RUN
  renderer: scripts/josim-plot2.py
  layout: sep_comb
  color: dark
  phase_option: 2pi
  standalone_input: raw.csv directly; no standalone derived CSV
  standalone_plot_count: exactly 6 HTML per run
  standalone_names: [SIGNAL_PATH.html, BVM_STATE.html, BVM_OUTPUT.html, JSL_CHAIN.html, QB_STATE.html, JTL_CHAIN.html]
  plot_window_ps: [0.0, 200.0]
  focused_windows: none
  comparison_plot_count: exactly 20 authorized HTML
  directory_structure: plots/runs/<run_id>/<six files> and plots/comparison/<20 files>
  no_extra_mechanism_plots: true

package:
  include_plots: false
  analysis_files:
    raw_qa.json: qa/raw_qa.json
    deck_diff_qa.json: qa/deck_diff_qa.json
    provenance.json: qa/provenance.json
    execution_summary.json: qa/execution_summary.json
    transformation_registry.json: qa/transformation_registry.json
  additional_paths:
