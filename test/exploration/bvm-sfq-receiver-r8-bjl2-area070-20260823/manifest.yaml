research_question:
  single_question: >-
    Does reducing only BJL2 AREA from 1.89 to 0.70 move the already isolated
    state-selective native-QB response into a substantially more nonlinear or
    quantizing regime without collapsing read0 margin or disturbing the
    canonical BVM source/storage guard?

hypothesis:
  primary: >-
    The native BJL2 output current class is too high for the R7-A routed
    perturbation; lowering BJL2 AREA may increase nonlinear output activity.
  alternatives:
    - >-
      AREA-dependent capacitance/resistance/load-line changes increase only a
      small sub-turn response.
    - >-
      Read0 margin collapses or the output becomes nonselective/free-running.
    - >-
      The BJL2 change produces one complete local event.

