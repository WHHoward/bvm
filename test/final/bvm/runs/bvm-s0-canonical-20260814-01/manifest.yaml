research_question: >-
  Under the frozen BVM-S0 closure and one preregistered read pulse, what
  V(SL1) and I(L_SL|XBVM1) waveforms occur for init_positive and
  init_negative relative to their matched zero-read controls, and what
  direct-JJ platform quantities are observed before and after the pulse?

hypotheses:
  primary: >-
    The read pulse produces a reproducible source-port waveform from each
    initialized procedure that is distinct from its matched zero-read control,
    with direct-JJ pre/post platform quantities stable at every registered
    timestep.
  alternatives:
    - Control and read waveforms are indistinguishable (no read response).
    - Pre/post platforms drift through the 170 ps window.
    - Adjacent-timestep comparisons exceed the registered bands (INCONCLUSIVE).

predeclared_outcomes:
  pass: >-
    QA passes, pre-window operational admissibility holds at all three
    timesteps, and all registered adjacent-refinement comparisons meet the
    bands -> CONVERGED + VALID.
  fail: >-
    Any QA/provenance failure -> INVALID; any admissible/convergence
    shortfall -> INCONCLUSIVE.  No logical/Gate/receiver conclusion is made.
  inconclusive: >-
    Valid raw data but initial-state admissibility or a registered
    convergence comparison not met at the fixed ladder maximum, or valid
    source-side observation without physical success/Gate interpretation.
  invalid: >-
    Wrong binary, missing probes, raw overwrite, solver/CSV failure, changed
    frozen stimulus/closure/window/band, pre-existing run root, out-of-scope
    write, or unregistered parameter/timestep.

