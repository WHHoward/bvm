research_question:
  single_question: >-
    Does L_SEC=1.00 pH with K=0.70710678 at fixed M=0.316227766 pH
    increase native-QB drive over R6-A while preserving canonical source and
    storage behavior sufficiently to justify reflected-load risk?

hypotheses:
  primary: >-
    Lower secondary source/leakage impedance at matched M increases native-QB
    drive and preserves read1/read0 separation without direct-SL-level
    reflected source disturbance.
  alternatives:
    - >-
      Drive gain is negligible because the nonlinear native-QB network remains
      the limiting impedance.
    - >-
      Drive gain is accompanied by reflected-load source/storage disturbance.
    - >-
      Activity becomes nonselective or free-running.

