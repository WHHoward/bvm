  area: "same JJ/endpoints/direction/window; actual-grid trapezoid / Phi0; not an SFQ count"

probes:
  bvm: "all BVM storage/R-loop/output P/V/I and quiet branches for XBVM1..4"
  bridge: "I(I_BRIDGE_REPLAY|XBVMn), V(6|XBVMn), V(10|XBVMn); canonical direction audit from R_S/L_S3"
  boundary: "V(COMMON_SL), P/V/I(B_JSL1..8), V(QBIN), I(LIN|XBQ1), V(LIN|XBQ1)"
  qb: "P/V/I(BJS/BJ1/BJ2), I/V(L1/L2/L3/RJ1/RJ2), V(QBOUT)"
  downstream: "P/V/I(B01/B02) for JTL1..6, stage outputs, I(R_TERM)"
  directions: "bridge 6->10; B_JSL8 JSL_NODE7->QBIN; LIN QBIN->QB internal node"

