acceptance:
  - id: AC1
    condition: "输出保留 phase_delta_rad，并以 phase_delta_turns = phase_delta_rad/(2*pi) 显式派生圈数；字段名和 CLI help 写明单位。"
    evidence:
      - "实现代码审查"
      - "合成输入单元测试日志"
  - id: AC2
    condition: "独立常数断言覆盖 0、+2*pi、-2*pi、+4*pi 和非整数圈；期望值不得从被测实现反向生成。"
    evidence:
      - "test/metrics/test_sfq_metrics_v2.py"
      - "测试日志"
  - id: AC3
    condition: "逐采样阈值统计只能命名为 activity、over-threshold intervals 或 samples；不得输出 fast_events、pulse_count、sfq_count 等事件语义。"
    evidence:
      - "输出 key 与 CLI help 审查"
      - "防回归测试"
  - id: AC4
    condition: "实现明确标注 full-trace endpoint delta 只是 M4 单位基础，不能替代 M5 稳定窗/零输入控制或 M6 电压面积，也不能形成物理 Gate。"
    evidence:
      - "模块/CLI 文档字符串审查"
      - "JSON 元数据审查"
  - id: AC5
    condition: "v1 scripts/sfq_metrics.py、test/final/** 和旧 M4-001/M4-002 任务证据保持不变；新增测试无需运行 JoSIM、联网或安装依赖。"
    evidence:
      - "冻结路径最终 diff"
      - "测试命令、退出码和日志"
  - id: AC6
    condition: "execution receipt 完整映射 AC1–AC6，列出所有实际改动、文件哈希、测试、限制、未知与偏离；不得创建后删除未记录的临时产物。"
    evidence:
      - "当前 attempt 的 receipt.yaml"
      - "josim-handoff verify-task 输出"
invalid_conditions:
  - "任一冻结文件、历史 raw 文件或旧任务证据被修改、覆盖、重命名或删除。"
  - "把 raw P() 数值直接标为 SFQ/flux-quantum count，或省略 rad 到 turns 的 2*pi 换算。"
  - "把过阈值采样区间/样本数命名或解释成脉冲数、结翻转数或下游 SFQ 接收数。"
  - "测试期望值由被测换算函数生成，形成循环验证。"
  - "缺少实际改动/日志/产物哈希，或发生超出授权写路径的写入、重命名、覆盖或删除。"
inconclusive_conditions:
  - "若 JoSIM CSV 列语义无法由绑定源码和文档确定，停止推断并报告所需的最小补充证据。"
stop_conditions:
  - "需要修改 scope.write_paths 之外的任何路径。"
  - "需要联网、安装依赖、运行 JoSIM、提交 Git 或删除/覆盖文件。"
  - "执行环境并非本合同指定的独立 worktree，或当前 HEAD、dirty 状态、锁或绑定文件哈希不符。"
  - "实现需要预先决定 M5 的窗口/聚类规则、M6 的电压面积规则或 M9 的容差。"
  - "发现另一活动任务占用同一 lock 或写路径。"
issuance_blockers:
  - "DRAFT：须从包含本 request 的提交创建独立 worktree，在该 worktree 重采 git_head、git-status 与 scope 哈希、更新签发时间并清空本项后再签名。"
