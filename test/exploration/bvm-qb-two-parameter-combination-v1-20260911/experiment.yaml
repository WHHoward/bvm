id: bvm-qb-two-parameter-combination-v1-20260911
study_phase: EXPLORATORY
mode: QUICK_COMBINATION
status: EXPERIMENT_COMPLETE / AWAITING_SCIENTIFIC_REVIEW
role: Experimental Operator + Evidence Packager

question:
  primary: >-
    Test whether a registered two-parameter combination can preserve the
    current full-closed-loop N2=2 response while suppressing the N3 fourth
    response toward N3=3.
  interpretation_ceiling: >-
    Results are bounded to the named BVM/JSL source, QB/JTL receiver, load,
    stimulus, solver, model closure and 0.1 ps grid. A candidate is not a
    hardware result, universal optimum or system Gate.

topology:
  full_closed_loop: BVM1..4 -> COMMON_SL -> eight-JJ JSL -> QB -> six-stage JTL -> R_TERM
  no_replay: true
  no_passive_capture: true
  no_isolated_qb: true
  no_source_scaling: true
  no_jtl_parameter_change: true

source_authority:
  previous_screening_experiment: test/exploration/bvm-full-closed-loop-qb-parameter-screening-v1-20260911
  current_bvm_include: inputs/bvm_jm2_connected.cir
  current_jj_model: inputs/jjmit.cir
  current_jtl_include: inputs/jtl2.cir
  current_bq_include: inputs/BQ_parameterized_bjs400_rj2.cir
  baseline_reference_0011: references/baseline_rj2p12/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P12_0011/raw.csv
  baseline_reference_0111: references/baseline_rj2p12/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P12_0111/raw.csv
  previous_screening_package: test/exploration/bvm-full-closed-loop-qb-parameter-screening-v1-20260911/handoff/bvm-full-closed-loop-qb-parameter-screening-v1-20260911_raw_handoff_v2.zip

baseline:
  Lin_pH: 1.5
  L1_pH: 1.4
  L2_pH: 2.0
  RJ1_ohm: 32.0
  RJ2_ohm: 12.0
  IBias_uA: 260.0
  BJS_area: 4.0
  BJ1_area: 0.9
  BJ2_area: 2.0
  L3_pH: 1.3

combination_matrix:
  points:
    C01: {L2_pH: 1.6, L3_pH: 1.6}
    C02: {L2_pH: 1.6, L1_pH: 1.2}
    C04: {BJ1_area: 1.10, L3_pH: 1.6}
    C03: {L2_pH: 1.6, RJ1_ohm: 40.0}
    C05: {BJ1_area: 1.10, L1_pH: 1.2}
    C07: {IBias_uA: 240.0, L3_pH: 1.6}
    C06: {BJ1_area: 1.10, RJ1_ohm: 40.0}
    C08: {IBias_uA: 240.0, L1_pH: 1.2}
    C09: {IBias_uA: 240.0, RJ1_ohm: 40.0}
  execution_order: [C01, C02, C04, C03, C05, C07, C06, C08, C09]
  masks_per_point: [0011, 0111]
  logical_point_count: 9
  logical_case_count: 18
  maximum_new_screening_solves: 18
  maximum_total_new_solves_including_validation: 20
  no_third_parameter: true

stimulus:
  amplitude_uA: 100.0
  rise_ps: 1.0
  fall_ps: 1.0
  plateau_ps: 9.0
  history: IDLE 0-50; WRITE0 50-61; IDLE 61-70; ZERO_STATE_READ_CONTROL 70-81; IDLE 81-90; WRITE1 90-101; SETTLE 101-110; FINAL_READ 110-121; TAIL 121-200
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  tran: .tran 0.1p 200p
  final_read_masks: [0011, 0111]

control_history:
  windows_ps:
    zero_state_read_control: [70.0, 81.0]
    post_control_idle: [81.0, 90.0]
    write1: [90.0, 101.0]
    settle: [101.0, 110.0]
  forbidden_complete_chain: V(QBOUT) -> V(JTL1_OUT) -> V(JTL2_OUT) -> V(JTL3_OUT) -> V(JTL4_OUT) -> V(JTL5_OUT) -> V(JTL6_OUT)
  qbout_peak_threshold_V: 0.0002
  jtl_peak_threshold_V: 0.0002
  terminal_current_diagnostic_threshold_A: 0.00002
  rollback_not_a_control_criterion: true

classification:
  phase_baseline_window_ps: [101.0, 110.0]
  phase_navigation_thresholds_turns: [0.5, 1.5, 2.5, 3.5, 4.5]
  terminal_locator_voltage_threshold_V: 0.0002
  terminal_min_peak_gap_ps: 2.5
  S: DIRECT_2_TO_3_COMBINATION_CANDIDATE
  A: NEAR_DIRECT_CANDIDATE
  B: STILL_2_TO_4
  C: STILL_1_TO_3
  D: OTHER_FAILURE

early_stop:
  if_S_found: stop_unstarted_combinations_and_validate_0001_1111
  candidate_validation_masks: [0001, 1111]
  candidate_validation_new_solves_max: 2
  no_automatic_positional_validation: true
  no_automatic_timestep_robustness: true
  no_automatic_third_parameter: true

authorized_runs: []
authorized_runs_policy: all immediate run directories are enumerated in qa/execution_summary.json
physics_solve_count: 18
reused_raw_count: 2
logical_combination_cases_completed: 18
combination_outcome: NO_DIRECT_2_TO_3_TWO_PARAMETER_COMBINATION
maximum_physics_solve_count_including_candidate_validation: 20

visualization:
