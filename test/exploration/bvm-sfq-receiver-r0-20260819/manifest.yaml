study_phase: EXPLORATORY
title: BVM -> SFQ receiver R0 trigger discrimination
created_at: "2026-08-19T04:10:09+08:00"
research_question: >-
  Can one minimum externally loaded, biased JJ trigger clearly switch for
  canonical logical1 +READ while remaining non-switching for canonical logical0
  +READ, with matched READ=0 controls?
hypothesis: >-
  The SL route has enough current/voltage separation for a 50 uA trigger JJ
  with 10 uA positive bias and a 12 ohm input resistor: read0 effective drive
  remains below Ic while read1 effective drive exceeds Ic.
alternative_explanations:
  - The receiver load may collapse the SL waveform and remove the margin.
  - The trigger may switch in READ=0 due to bias-only instability or numerical startup.
  - A trigger phase excursion may be edge activity or multi-turn running rather than a
    single bounded pulse; this Exploration does not claim exactly one SFQ.
route:
  primary: canonical BVM SL output
  secondary: not run unless the primary SL point has no usable discrimination
canonical_boundary: canonical BVM inputs are immutable snapshots of the frozen file;
  no internal topology or parameter was changed.
