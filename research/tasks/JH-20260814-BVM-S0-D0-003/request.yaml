  - {id: AC4, condition: "Use only the five preregistered half-open windows and the fixed pair/persistence rule in design/settling-readiness-discriminator.md. Report raw-radian mean/min/max/p2p and sample count for both direct P columns in every case/window; report all three pairwise L-infinity separations. Report the first qualifying preregistered adjacent pair or explicit absence. No post-hoc window, guard, case, or timestep change is permitted.", evidence: [analysis.md, analysis-json]}
  - {id: AC5, condition: "For JM1 N1->n_jm1o and JM2 n_jm2i->N2, report on fixed [9,31) ps the same-run direct P/V endpoint delta (rad and turns), actual-time trapezoid area (V*s and turns), and signed residual with voltage_to_phase_sign=+1 and reporting_direction=+1. State that no residual tolerance is declared. Preserve V(SL1)/I(L_SL|XBVM1) only as raw fixture probes, not source characterization.", evidence: [analysis.md, analysis-json, manifest.yaml]}
  - {id: AC6, condition: "Receipt records every created input/closure/raw/log/analysis/manifest/command hash and maps AC1-AC5. It preserves D0-001/D0-002 as lineage, uses only VALID/INCONCLUSIVE/INVALID evidence-quality language, makes no S0/source/receiver/Gate/logical/SFQ/fluxoid claim, and final verify-task succeeds.", evidence: [receipt.yaml, verify-task-log]}
