verdict_summary: >-
  Artifact-valid twenty-case matched Exploration.  At every fixed AREA=0.10
  bias point from 6 through 10 uA, read1 B_OUT remained sub-turn
  (0.022189621 turns at 6 uA down to 0.020449819 turns at 10 uA) with a
  same-segment voltage area consistent with that sub-turn phase evolution.
  No read1 complete segment, read0 complete segment, or control complete/free-
  running segment was observed.  B_TRIG guard, state-dependent secondary
  transfer, storage signs, artifact QA, and independent raw cross-checks all
  passed.  No bias window was observed; this diagnostic does not support a
  simple Ic-margin remedy and does not by itself separate insufficient
  effective transfer from loaded damping dynamics.  No topology was changed
  and no Candidate upgrade was made.
