question:
  primary: >-
    Test whether the stored I(B_JSL8)(t) from the current RJ2=12 N2
    closed-loop raw is sufficient, under ideal current forcing, to reproduce
    the corresponding isolated QB/JTL receiver behavior.
  bounded_oracle: >-
    This is a boundary-current waveform-sufficiency replay. The recorded
    waveform was formed in closed loop, so the replay is not an intervention
    that removes the history of source/receiver interaction and is not a
    circuit-equivalent source reconstruction.
  interpretation_ceiling: >-
    Raw evidence and mechanical navigation only unless the user separately
    authorizes SCIENTIFIC_REVIEW_AUTHORIZED. No SFQ count, mechanism, causal,
    Gate, hardware or route claim is made by the operator.

