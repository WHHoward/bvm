  - id: AC2
    condition: "Before the first JoSIM execution, copy the immutable preregistration verbatim into A01 analysis evidence and create exactly six unique run plans: zero_input_control and single_input at 0.1/0.05/0.025 ps. Each generated netlist is a constrained M7 canonical derivative: only input amplitude, .tran timestep, extended direct V/P print list, and comments/run name may differ."
    evidence: ["preregistration copy/hash", "six netlists", "six run manifests"]
  - id: AC3
    condition: "Each of the six fresh runs saves netlist and include/model closure snapshots/hashes, binary path/version/hash, command, stdout, stderr, raw CSV, and manifest. QA requires zero exit status, direct V/P columns for XDUT and XLOAD B1/B2, finite values, strictly increasing actual time, and endpoint coverage through the fixed post window. No raw or failed run is overwritten/deleted."
    evidence: ["six run manifests", "raw CSVs", "logs", "hash inventory"]
  - id: AC4
    condition: "Analyze only the preregistered half-open windows and actual CSV times. Report every registered applicable observable with units, signals, orientation, selected endpoints, control correction, and raw values. activity_peak_time_ps and activity_fwhm_ps must retain their preregistered activity-proxy wording; downstream_count remains NOT_APPLICABLE."
    evidence: ["machine-readable convergence table", "analysis markdown", "analysis command/log"]
  - id: AC5
    condition: "Compare both adjacent pairs (0.1,0.05) and (0.05,0.025) ps against every preregistered task-local band. Classify only CONVERGED, INCONCLUSIVE, or INVALID under preregistration.yaml; reaching 0.025 ps ends the task whether or not it converges. Do not add a fourth level or alter the procedure."
    evidence: ["adjacent-refinement table", "bounded decision record"]
  - id: AC6
    condition: "Run unchanged M4–M7 tests plus any task-local analysis self-check; all required outputs, changed paths, commands, hashes, AC mappings, limitations, observations, interpretations, and unknowns are complete in receipt. final verify-task succeeds. The proposed physical verdict is NOT_APPLICABLE."
    evidence: ["test logs", "receipt.yaml", "verify-task log"]
invalid_conditions:
  - "Any direct P/V mapping, sign, control match, required column, actual-time QA, source/model closure, or provenance requirement is absent or unverifiable."
  - "Any raw/failed run is overwritten, deleted, renamed, or an existing run ID is reused."
  - "Any edit crosses write scope or any M9/candidate-tuning/physical Gate claim is made."
  - "Any window, band, input shape, dt ladder, or run budget differs from preregistration.yaml without a new request."
inconclusive_conditions:
  - "At the fixed maximum depth, any valid applicable observable differs beyond its preregistered adjacent-refinement band."
  - "A required waveform diagnostic is genuinely absent/ambiguous despite otherwise valid data; preserve evidence and classify INCONCLUSIVE rather than extending the plan."
stop_conditions:
