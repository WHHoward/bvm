title: BVM -> SFQ receiver R2-E quasi-static switching-amplitude threshold at FWHM=20ps
created_at: "2026-08-21T21:01:44+08:00"
parent_exploration: test/exploration/bvm-sfq-receiver-r2d-duration-20260821
parent_checkpoint: 32e1143cab52cfdbdcc15d49e2dfead1e7b24032
current_head_before_experiment: 32e1143cab52cfdbdcc15d49e2dfead1e7b24032
research_question: >-
  At fixed FWHM = 20 ps direct-drive pulse (quasi-static regime per R2-D), what
  is the minimum amplitude that produces the first complete 2*pi phase
  transition of B_OUT?
hypothesis: >-
  H_threshold (primary): R2-D showed the w20p0 point reaches 96.2% of Ic with
  quasi-static transfer ~75% of the increment; extrapolation predicts first
  switching near 4-4.5 uA added on top of the 7 uA bias.  The matrix {4.0, 4.5,
  5.0} uA ascending should contain the threshold.
alternative_hypotheses:
  no_threshold: >-
    Even 5.0 uA remains sub-turn (Situation C of the plan): shunt diversion
    grows with amplitude faster than linear, or another mechanism blocks
    switching.
  unstable_activation: >-
    First crossing shows multi-turn/free-running/severe ringing (Situation B):
    activation solved but retrap/one-shot unresolved.
variable:
  name: direct_drive_amplitude_uA
  units: uA
  values: [4.0, 4.5, 5.0]
  baseline_r2d_amplitude: 3.5
  only_changed_variable: true
  maximum_operating_points: 3
  stop_rule: sequential ascending execution; stop immediately at the first
    qualifying complete transition; no higher amplitudes after that.
fixed_constraints:
  fwhm_ps: 20.0
  pulse_shape: symmetric triangle, center 104.51 ps, base 40 ps (84.51/124.51 ps
    zero points), polarity = verified forward-drive direction
  bvm_modified: false
  transformer_modified: false
  k_area_bias_damping_duration_topology_modified: false
  jj_model_modified: false
  timestep_stop_probes_analysis_unchanged: true
  existing_accepted_artifacts_modified: false
output_stage_baseline:
  area: 0.10
  ic_uA: 10.0
  rn_ohm: 160.0
  r0_ohm: 1600.0
  c_fF: 7.0
  bias_uA: 7.0
  r_damp_ohm: 100.0
background_case: logical1 write init, NO READ, bias retained (same as R2-C/D)
points:
  - {id: a40u0, amp_uA: 4.0}
  - {id: a45u0, amp_uA: 4.5}
  - {id: a50u0, amp_uA: 5.0}
solver:
