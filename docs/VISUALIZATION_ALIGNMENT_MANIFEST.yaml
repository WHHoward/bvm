- experiment_id: test/exploration/physical-bvm-jsl12-qb-sfq-closure-v1-20260824
  title_cn: Physical BVM→12×JSL→scaled QB：SFQ closure
  scientific_question: 把 canonical BVM SL 通过 12 个 AREA=3.2 的串联 JSL 直接接到 frozen scaled
    QB，运行 13/14 ps 与 logical1/logical0/两个 READ=0 controls，并与已有 ideal replay 对比。
  formal_result: PHYSICAL_BACKACTION_PREVENTS_CLOSURE：13/14 ps physical read1 的 BJL2
    最大连续段仅约 −0.122 turn，read0/control 为零 complete event；I(L_SL) 未数量级塌缩，但 physical
    load-line 改变了 source voltage/current partition，ideal replay 的 1/0/0 candidate
    未保留。
  what_done: 把 canonical BVM SL 通过 12 个 AREA=3.2 的串联 JSL 直接接到 frozen scaled QB，运行
    13/14 ps 与 logical1/logical0/两个 READ=0 controls，并与已有 ideal replay 对比。
  result_summary: PHYSICAL_BACKACTION_PREVENTS_CLOSURE：13/14 ps physical read1 的 BJL2
    最大连续段仅约 −0.122 turn，read0/control 为零 complete event；I(L_SL) 未数量级塌缩，但 physical
    load-line 改变了 source voltage/current partition，ideal replay 的 1/0/0 candidate
    未保留。
  conclusion_boundary: 不能称 physical BVM→QB selective one-SFQ closure，也没有 T1/JTL evidence；该结果把下一问题限定为
    physical QB source matching/load-line，而不是继续 width sweep。
  scientific_status: PHYSICAL_BACKACTION_PREVENTS_CLOSURE
