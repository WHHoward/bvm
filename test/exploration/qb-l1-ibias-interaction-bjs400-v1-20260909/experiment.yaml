    reference: references/reused/ARRAY_IB260_0001
    corner: B
  - logical_case_id: ARRAY_IB260_0011
    reference: references/reused/ARRAY_IB260_0011
    corner: B
new_physical_solve_count: 6
reused_physical_case_count: 2
exact_physical_case_count: 8
unauthorized_extra_solves: 0
no_extra_masks: true
no_extra_single: true
no_timestep_sweep: true
no_scientific_analysis: true

masks:
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  allowed: ["0001", "0011"]
  "0001": BVM4 active during FINAL READ
  "0011": BVM3 and BVM4 active during FINAL READ
  scope: FINAL READ only, 110-121ps

stimulus:
  idle_0_50ps: all controls 0
  WRITE0_50_61ps: WL=BL=-100uA; SE=0
  idle_61_70ps: all controls 0
  ZERO_STATE_READ_CONTROL_70_81ps: WL=SE=+100uA; BL=0
  idle_81_90ps: all controls 0
  WRITE1_90_101ps: WL=BL=+100uA; SE=0
  SETTLE_101_110ps: all controls 0
  FINAL_READ_110_121ps: registered mask only
  TAIL_121_200ps: all controls 0
  edge_ps: 1
  plateau_ps: 9
  amplitude_uA: 100
  tran: 0.1p 200p
  window_semantics: half-open registered PWL intervals

source_authority:
  bvm: inputs/bvm_jm2_connected.cir
  jjmit: inputs/jjmit.cir
  bq: inputs/BQ_parameterized_bjs400.cir
  jtl: inputs/jtl2.cir
  fixture_template: inputs/array_fixture_template.cir
  solver: build/josim-cli
  reused_manifest: REUSED_REFERENCE_MANIFEST.json
  historical_bjs400_source: test/exploration/qb-bjs400-array-population-single-matched-v1-20260909

probe_schema:
  controls: I(I_WL1..4), I(I_BL1..4), I(I_SE1..4)
  bvm: P/V/I(B_JM1,B_JM2,B_JS1,B_JS2), I/V registered internal branches and L_SL
  interface: V(COMMON_SL), P/V/I(B_JSL1..8), V(QBIN)
  qb: V(QBIN), I/V(LIN), P/V/I(BJS), P/V/I(BJ1), I/V(RJ1), I/V(L1), I(IB), I/V(L2), P/V/I(BJ2), I/V(RJ2), I/V(L3), V(QBOUT)
  jtl: P/V/I(B01), P/V/I(B02), V(stage_OUT) for stages 1..6, V(JTL6_OUT), I(R_TERM)
  optional_unknown: V(IB|XBQ1) if solver does not emit it
  missing_probe_policy: preserve requested probe and mark UNKNOWN; never fabricate

mechanical_qa:
  - exact 2x2 matrix and exactly 6 new physical solves
  - B reuse exact physical comparability and raw/deck SHA
  - BJS area=4, RJ1=12ohm, registered L1/IBias/mask only
  - successful history and mask-only-after-110ps control structure
  - raw existence, SHA256, finite values, monotonic actual grid, 1999 samples, 0-199.9ps
  - required probes present or explicitly UNKNOWN
  - raw unchanged during QA/visualization/packaging

visualization:
  profile: COMPACT_FLAT_INTERACTION
  renderer: scripts/josim-plot2.py
  layout: sep_comb
  color: dark
  phase_option: 2pi
  whole_run_window_ps: [0.0, 200.0]
  focused_windows: none
  standalone_input: raw.csv direct
  standalone_per_new_run: exactly 3 HTML
  standalone_names: [SIGNAL_PATH.html, QB_STATE.html, JTL_CHAIN.html]
  comparison_names: [0001_INTERACTION_COMPARE.html, 0011_INTERACTION_COMPARE.html]
  flat_structure: plots/runs/<run_id>/<three files> and plots/comparison/<two files>
  no_derived_plot_csv: true
  no_mechanism_plots: true

package:
  include_plots: false
  analysis_files:
    raw_qa.json: qa/raw_qa.json
    deck_diff_qa.json: qa/deck_diff_qa.json
    provenance.json: qa/provenance.json
    execution_summary.json: qa/execution_summary.json
    transformation_registry.json: qa/transformation_registry.json
