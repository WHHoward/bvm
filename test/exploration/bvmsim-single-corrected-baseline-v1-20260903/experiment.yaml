    load: six_stage_jtl_plus_10ohm
    input_deck: inputs/S1-J-CORRECTED.cir
    run_dir: runs/S1-J-CORRECTED
    historical_invalid_raw: test/exploration/bvmsim-bvm-qb-jtl-operational-baseline-v1-20260903/runs/single/S1-J/raw/run-01.csv

