research_question: >-
  Can a genuinely differential secondary-to-ground B_OUT topology activate
  the minimum biased output JJ for canonical read1 while read0 and both
  READ=0 controls have no complete local output transition, with the accepted
  R0b/R1a B_TRIG guard preserved?
hypothesis: >-
  With L_SEC=N_SEC->ground and B_OUT=N_SEC->ground, the transformer current
  enters the same signal node as the independent 7 uA bias.  For the declared
  current directions, KCL gives i_BOUT=I_BIAS-i_LSEC-i_RSEC-i_RDAMP.  The
  negative read1 secondary-current lobe is therefore additive at B_OUT,
  while the read0 lobe remains below the 10 uA output Ic.
alternative_explanations:
  - The chosen mutual polarity may make the read1 additive lobe have the
    opposite sign at B_OUT.
  - The 12 ohm retained passive termination may shunt the transient before
    the output JJ reaches a complete transition.
  - AREA=0.10, 7 uA, and 100 ohm damping may remain subcritical after loading.
  - The direct secondary shunt may load B_TRIG enough to destroy R0b trigger
    discrimination.
  - The output JJ may trigger in read0 or a READ=0 control because of initial
    bias transients or a polarity error.
  - A local B_OUT phase transition would still not establish downstream SFQ
    delivery because no JTL is present.
