acceptance:
  - id: AC1
    condition: >-
      METRIC_SPEC_V2 is canonical at the contracted path, states metric_spec_version 2.0.0,
      binds its own content hash procedure, cites accepted M4–M8 evidence, and explicitly limits
      its claim to measurement/reporting semantics.
    evidence: [METRIC_SPEC_V2.md, test_metric_spec_v2.py]
  - id: AC2
    condition: >-
      The specification precisely defines raw-radian preservation, turns conversion, separate
      platform and endpoint deltas, same-JJ P/V mapping and distinct signs, half-open windows,
      matched controls, activity clusters, actual-time voltage area, QA/INVALID/INCONCLUSIVE,
      convergence preregistration, and a versioned output schema.
    evidence: [METRIC_SPEC_V2.md, test_metric_spec_v2.py]
  - id: AC3
    condition: >-
      The spec does not freeze a universal activity threshold or global integer/residual/platform/
      BVM-drift/amplitude/jitter acceptance tolerance.  It records M8 bands only as fixture-local
      calibration data and requires missing classification tolerance to yield INCONCLUSIVE.
    evidence: [METRIC_SPEC_V2.md, test_metric_spec_v2.py]
  - id: AC4
    condition: >-
      The output schema prohibits NaN/Inf and event/SFQ/pulse/fluxoid count fields, requires
      provenance, windows, mappings, signal/control/corrected namespaces, raw rad and turns,
      activity diagnostics, P/V residuals, convergence, and UNKNOWN/NOT_APPLICABLE reasons.
    evidence: [METRIC_SPEC_V2.md, test_metric_spec_v2.py]
  - id: AC5
    condition: >-
      The document and tests explicitly exclude INTERFACE_GATE_V1, candidate success criteria,
      read1/read0, repeatability, state preservation, route selection, and paper/hardware claims.
    evidence: [METRIC_SPEC_V2.md, test_metric_spec_v2.py]
  - id: AC6
    condition: >-
      Claude records an immutable FROZEN attempt with complete preflight, changes, command logs,
      test evidence, limitations, and AC mapping; the permitted Python tests and final handoff
      verify-task succeed.  The delivery snapshot is Codex-owned.
    evidence: [receipt.yaml, test-log, verify-task-log]
invalid_conditions:
  - Any modification to M4–M8 implementation/evidence, historical raw/netlists, task authority, or the frozen scope.
  - Any M9 text/test that defines an interface/candidate success threshold or labels activity as event/SFQ/pulse/fluxoid counting.
  - A spec that silently promotes a fixture-local M8 band or current 0.3 rad regression setting into a universal physical acceptance threshold.
inconclusive_conditions:
  - Accepted evidence cannot support a required semantic, mapping, or tolerance; preserve the gap as UNKNOWN/UNFROZEN rather than inventing it.
  - A required test or provenance check cannot be completed without out-of-scope change.
stop_conditions:
  - Baseline, scope hash, required task/evidence status, lock, or preflight mismatch.
  - Need to change a frozen path, run JoSIM, create/alter an interface Gate, alter historical data, or define candidate success.
  - Need to overwrite/delete/rename an existing artifact, expand write scope, use network/install dependencies, or amend/rebase a snapshot.
