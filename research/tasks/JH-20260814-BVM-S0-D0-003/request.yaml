  objective: "Run one preregistered settling/readiness discriminator that determines whether a fixed write-only BVM initialization has a stable, distinguishable operational initial-state bound in the fixed 12-ohm fixture."
  research_question: "For the three fixed write-only cases, which (if any) preregistered adjacent settling-window pair first satisfies the fixed stability and distinguishability rule and remains so through the final witness window?"
  non_goals:
    - "Do not start formal BVM-S0, add a read or SE stimulus, or characterize a BVM source waveform."
    - "Do not attach BQ, DCSFQ_BVM, JTL, or any receiver; do not define INTERFACE_GATE_V1, candidate success, route choice, logical 0/1, SFQ, or fluxoid conclusions."
    - "Do not sweep load, bias, Ic, L, R, initialization pulse amplitude/width, timestep, or solver settings; use exactly the three cases and one 12-ohm fixture declared in the frozen design."
    - "Do not overwrite, delete, reinterpret, or numerically merge D0-001/D0-002 raw evidence, analyses, receipts, requests, or audits."
  claim_ceiling: exploratory_operational_settling_readiness_only_no_bvm_s0_source_characterization_or_physical_gate
