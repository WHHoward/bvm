  - id: S0-R-CORRECTED
    logical_state: 0
    load: direct_10ohm
    input_deck: inputs/S0-R-CORRECTED.cir
    run_dir: runs/S0-R-CORRECTED
    historical_invalid_raw: test/exploration/bvmsim-bvm-qb-jtl-operational-baseline-v1-20260903/runs/single/S0-R/raw/run-01.csv
  - id: S1-R-CORRECTED
