outcome_rule:
  status: FROZEN_BEFORE_CANDIDATE_RUN
  input_replay_fidelity: grid exact and max_abs_error <= 1.0e-6 uA
  pre_state: every registered current and phase signal satisfies its threshold
  qualified: all nondegenerate primary C_x <= 0.10, strict class matches P0, and strict local values close
  partial: input/pre pass, strict class matches P0, at least one C_x > 0.10, at most one ratio is >0.10 and <=0.20
  insufficient: input/pre pass but qualified and partial rules fail
  invalid: input grid/amplitude fidelity or PRE equivalence fails, or artifact is invalid
  labels:
    qualified: CURRENT_REPLAY_FIXTURE_QUALIFIED
    partial: PARTIAL_CURRENT_REPLAY_CLOSURE
    insufficient: CURRENT_ONLY_REPLAY_INSUFFICIENT
    invalid: REPLAY_INVALID
  quick_labels:
    CURRENT_REPLAY_FIXTURE_QUALIFIED: QUICK_PROMISING
    PARTIAL_CURRENT_REPLAY_CLOSURE: QUICK_AMBIGUOUS
    CURRENT_ONLY_REPLAY_INSUFFICIENT: QUICK_OPPOSITE
    REPLAY_INVALID: QUICK_INVALID
  interpretation: >-
    QUICK_PROMISING only means the current replay is a useful causal fixture;
    it does not solve the physical BVM→QB route and does not prove a mechanism.

