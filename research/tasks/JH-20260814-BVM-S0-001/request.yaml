task:
  kind: EXPERIMENT
  objective: "Establish one reproducible, convergence-checked BVM source-side baseline under the fixed 12-ohm fixture, reporting state-conditioned source-port waveforms and direct-JJ pre/post observables without any interface or logic claim."
  research_question: "Under the frozen BVM-S0 closure and one preregistered read pulse, what V(SL1) and I(L_SL|XBVM1) waveforms occur for init_positive and init_negative relative to their matched zero-read controls, and what direct-JJ platform quantities are observed before and after the pulse?"
  non_goals:
    - "Do not attach BQ, DCSFQ_BVM, JTL, T1, or any receiver; do not define INTERFACE_GATE_V1, event count, candidate success, route choice, or system logic."
    - "Do not call init_positive/init_negative logical read1/read0, published states, fluxoids, SFQs, or non-destructive reads."
    - "Do not sweep load, bias, Ic, L, R, read amplitude/width, initialization, or solver settings; execute only the four frozen cases at the three registered timesteps."
    - "Do not overwrite or reinterpret D0 lineage or any historical raw artifact."
  claim_ceiling: calibration_source_side_waveform_and_direct_jj_pre_post_observables_only_no_receiver_gate_or_logical_state_claim
