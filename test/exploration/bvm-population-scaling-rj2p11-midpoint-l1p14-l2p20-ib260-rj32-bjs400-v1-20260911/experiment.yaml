question: >-
  At the frozen BVM -> COMMON_SL/JSL -> QB -> six-stage JTL working point,
  determine from raw waveform evidence whether RJ2=11ohm separates the
  weight-2 second-response boundary from the weight-3 post-READ fourth-response
  behavior, using the nested masks 0001 -> 0011 -> 0111 -> 1111.
motivation: >-
  RJ2=10ohm did not preserve the weight-2 second response, while RJ2=12ohm
  showed bounded multi-response activity including post-READ fourth-response
  candidates for weight 3. This experiment tests only the preregistered
  midpoint RJ2=11ohm and does not assume the desired chain.
interpretation_ceiling: >-
  Raw waveform evidence is the scientific authority for later review.
  Mechanical counts, phase navigation, voltage areas, terminal areas and
  ordered response candidates are supporting evidence only and are never SFQ
  counts. No mechanism, universal population law, perfect counter claim or
  automatic follow-up is authorized.

