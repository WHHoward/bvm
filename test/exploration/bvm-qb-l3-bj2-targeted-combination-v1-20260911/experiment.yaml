id: bvm-qb-l3-bj2-targeted-combination-v1-20260911
study_phase: EXPLORATORY
mode: QUICK_TARGETED_COMBINATION
status: PREREGISTERED_PENDING_PREFLIGHT
role: Experimental Operator + Evidence Packager

question:
  primary: >-
    Test whether L3=2.0 pH preserves the N2 response while BJ2 area=2.2
    suppresses the N3 fourth handoff at one fixed full closed-loop point.
  interpretation_ceiling: >-
    Results are bounded to the named BVM/JSL source, QB/JTL receiver, load,
    stored history, solver and 0.1 ps grid; no exact optimum, hardware claim,
    route verdict or universal mechanism is inferred.

topology:
  full_closed_loop: BVM1..4 -> COMMON_SL -> eight-JJ JSL -> QB -> six-stage JTL -> R_TERM
  no_replay: true
  no_passive_capture: true
  no_isolated_qb: true
  no_source_waveform_modification: true
  no_source_scaling: true
  no_jtl_parameter_change: true

source_authority:
  previous_l3_experiment: test/exploration/bvm-qb-l3-highside-selective-window-v1-20260911
  previous_bj2_ofat: test/exploration/bvm-full-closed-loop-qb-parameter-screening-v1-20260911
  current_bvm_include: inputs/bvm_jm2_connected.cir
  current_jj_model: inputs/jjmit.cir
  current_jtl_include: inputs/jtl2.cir
  current_bq_include: inputs/BQ_parameterized_bjs400_rj2.cir
  canonical_reference: references/canonical_l3p13
  l3_only_reference: references/l3p20
  bj2_only_reference: references/bj2p22_l3p13

baseline:
  Lin_pH: 1.5
  L1_pH: 1.4
  L2_pH: 2.0
  RJ1_ohm: 32.0
  RJ2_ohm: 12.0
  IBias_uA: 260.0
  BJS_area: 4.0
  BJ1_area: 0.9
  BJ2_area: 2.0
  L3_pH: 1.3

target:
  point_id: TARGET_L3_2_BJ2_2p2
  L3_pH: 2.0
  BJ2_area: 2.2
  changed_parameters_only: [L3_pH, BJ2_area]

stimulus:
  amplitude_uA: 100.0
  rise_ps: 1.0
  fall_ps: 1.0
  plateau_ps: 9.0
  history: IDLE 0-50; WRITE0 50-61; IDLE 61-70; ZERO_STATE_READ_CONTROL 70-81; IDLE 81-90; WRITE1 90-101; SETTLE 101-110; FINAL_READ 110-121; TAIL 121-200
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  tran: .tran 0.1p 200p
  screening_masks: ["0011", "0111"]

control_history:
  windows_ps:
    zero_state_read_control: [70.0, 81.0]
    post_control_idle: [81.0, 90.0]
    write1: [90.0, 101.0]
    settle: [101.0, 110.0]
  criterion: only unintended complete downstream QBOUT -> JTL1 -> ... -> JTL6 propagation before FINAL READ is contamination
  rollback_excluded_from_control: true
  qbout_peak_threshold_V: 0.0002
  jtl_peak_threshold_V: 0.0002

response_authority:
  ordered_chain: BJ1 -> BJ2 -> QBOUT -> JTL1 -> JTL2 -> JTL3 -> JTL4 -> JTL5 -> JTL6 -> terminal
  phase_baseline_window_ps: [101.0, 110.0]
  phase_navigation_thresholds_turns: [0.5, 1.5, 2.5, 3.5, 4.5]
  phase_navigation_only: true
  terminal_area_not_a_count: true

registered_runs:
  screening:
    - {run_id: TARGET_L3_2_BJ2_2p2_0011, mask: "0011"}
    - {run_id: TARGET_L3_2_BJ2_2p2_0111, mask: "0111"}
  conditional_validation:
    condition: clean ordered 2/3 screening pair only
    runs:
      - {run_id: TARGET_L3_2_BJ2_2p2_0001, mask: "0001"}
      - {run_id: TARGET_L3_2_BJ2_2p2_1111, mask: "1111"}
  maximum_screening_solve_count: 2
  maximum_total_solve_count_if_validation: 4

classification:
  S: DIRECT_2_TO_3_L3_BJ2_CANDIDATE
  A: N2_RESCUED_BUT_N3_FOURTH_REMAINS
  B: N3_SUPPRESSED_BUT_N2_NOT_RESCUED
  C: L3_BJ2_COMBINATION_UNFAVORABLE
  D: N3_FOURTH_HANDOFF_BOUNDARY_CASE
  raw_phase_and_area_not_sfq_count: true

visualization:
  manifest_path: visualization/manifest.json
  qa_path: qa/visualization_qa.json
  navigation_path: visualization/run_summaries
  renderer: scripts/josim-plot2.py
  layout: sep_comb
  color: dark
  phase_option: 2pi
  whole_run_window_ps: [0.0, 200.0]
  focused_window_ps: [108.0, 150.0]
  comparison_required: true
  plots_in_raw_handoff_zip: true

package:
  include_plots: false
  additional_paths:
    - HANDOFF_README.md
    - analysis
    - screening
    - qa
    - references
    - mechanical_summary.json
    - run.sh
    - visualization/plots
    - visualization/run_summaries
  analysis_files:
    raw_qa.json: qa/raw_qa.json
    deck_diff_qa.json: qa/deck_diff_qa.json
    provenance.json: qa/provenance.json
    execution_summary.json: qa/execution_summary.json
    transformation_registry.json: qa/transformation_registry.json

authorized_runs: []
physics_solve_count: 0
reference_raw_count: 6
maximum_physics_solve_count_including_conditional_validation: 4

stop:
  final_state: EXPERIMENT_COMPLETE / AWAITING_SCIENTIFIC_REVIEW
  automatic_followup: false
  no_unregistered_parameter: true
