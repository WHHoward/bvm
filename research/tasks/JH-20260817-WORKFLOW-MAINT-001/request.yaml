acceptance:
  - {id: AC1, condition: "Active workflow/executor/skill guidance defaults new CRITICAL/FROZEN L2 scientific questions to one preregistered batch containing inputs, raw, logs, task-owned frozen analysis-spec, analyzer, independent verifier, structured analysis, deterministic report, report-consistency result, recursive evidence bundle and receipt; successor use is limited to authority/scope defects.", evidence: [workflow-docs, tests]}
  - {id: AC2, condition: "New optional v1 analysis-spec supports exact timestamp rule, windows, metric/formula/threshold/sign declarations, actual-time integration, same-JJ phase-area definition, and affine endpoint rule; verifier reads raw plus spec, never imports/calls executor analyzer, and compares independently recomputed results to structured analysis.", evidence: [quantitative-analysis-spec.schema.json, quantitative_analysis_verifier.py, test_quantitative_analysis_verifier.py]}
  - {id: AC3, condition: "Verifier regression fixtures reject wrong Phi0, phase-area sign, integration, forbidden interpolation/resampling, S2-style affine interpolation, and registered-threshold mismatch; all checks use minimal synthetic data and do not edit historical evidence.", evidence: [test_quantitative_analysis_verifier.py, test-log]}
  - {id: AC4, condition: "Renderer produces report deterministically from structured analysis and report-consistency verification rejects a headline mismatch; no template permits manually duplicated authority numbers.", evidence: [render_structured_report.py, test_quantitative_analysis_verifier.py, test-log]}
  - {id: AC5, condition: "Optional issuer-snapshot v1 mode preserves legacy strict-HEAD behavior and validates that an ACK-observed commit tree contains byte-identical sealed request/signature/scope bindings while scope hashes still match; regressions cover issuer-parent-versus-snapshot, wrong snapshot, and scope drift.", evidence: [handoff.py, test_handoff.py, test-log]}
  - {id: AC6, condition: "For new audit records, exact contract claim_ceiling binding remains mandatory and optional scientific_claim_ceiling records the narrower science-specific audit ceiling; fixture rejects missing/mismatched contract ceiling and preserves legacy audit validation.", evidence: [audit-verdict.schema.json, handoff.py, test_handoff.py, test-log]}
  - {id: AC7, condition: "Optional evidence_bundle validates a recursive manifest over required raw/inputs/logs/manifest/spec/analyzer/verifier/structured result/renderer/report/inventory/receipt bindings; regression rejects missing raw, log, or script, while legacy receipts without it continue to verify.", evidence: [execution-receipt.schema.json, handoff.py, build_evidence_bundle.py, test_evidence_bundle.py, test-log]}
  - {id: AC8, condition: "Legacy handoff fixtures and all new regression suites pass; no JoSIM command is invoked and no frozen S0/S1/S2 path changes.", evidence: [test_handoff.py, test_quantitative_analysis_verifier.py, test_evidence_bundle.py, command-logs]}
invalid_conditions:
  - "Any S0/S1/S2 sealed raw, historical protocol file, scientific disposition, or E01 is changed."
  - "A new mechanism weakens pre-registered controls/thresholds, lets verifier import the executor analyzer, accepts formula output merely because schema validation passes, or breaks a legacy fixture."
inconclusive_conditions:
  - "None: this is a software/documentation maintenance task; an unmet required regression is REWORK_REQUIRED rather than a scientific INCONCLUSIVE result."
stop_conditions:
  - "Any change requires JoSIM, a scientific experiment, a protocol major-version change, a historical evidence edit, a new general DSL, or a path outside scope.write_paths."
  - "A required compatibility or negative regression cannot be made to pass without relaxing the stated acceptance conditions."
  - "Bootstrap issuer-owned untracked task packet cannot be isolated from this task's write scope; record BLOCKED instead of changing baseline/history."
