scientific_question:
  single_question: >-
    With R5-A input coupling, L_QB, J_SET, and bias operating point frozen, does
    adding a minimal BJL1/RJ1-class load-line branch convert the read1 bounded
    biphasic plasma oscillation into exactly one complete phase slip, while
    read0/controls remain zero?

qb_fact_base:
  bjl1_connection_in_paper_qb: >-
    BJL1 sits from the loop midpoint node (node 2, between BJs cathode and the
    L1/L2 loop) to ground, in parallel with RJ1.  It is a shunt junction across
    the quantizing loop: DC bias path and load-line definition.
  rj1_role: >-
    RJ1 (parallel with BJL1) damps the loop and defines the load line so that
    when BJs enters its voltage state the loop current has an ohmic path -
    making the state transition irreversible instead of swinging back.
  ic_ordering_lesson: >-
    v4 root cause: BJL1 Ic must be ABOVE BJs Ic so the shunt junction never
    steals the signal current before BJs switches.  Paper ordering:
    JS(133) < JL1(112) is actually BELOW - but paper JS is on the input arm;
    our v4 fix applies to the shared-loop geometry where both see the same
    loop current.  For R5-B: J_SET(Ic=5 uA) must switch FIRST, so the shunt
    junction Ic must be > J_SET Ic.
  how_load_line_changes_escape: >-
    In R5-A the oscillation was symmetric because the loop had no dissipation
    path: energy sloshed between L_QB and J_SET capacitance.  A shunt branch
    across the loop adds an asymmetric damping channel that activates only when
    |V_loop| grows (junction entering voltage state) - converting the crossing
    of the critical boundary into runaway (slip) rather than turnaround.

topology_delta_from_r5a:
  ascii: |
    N_A -- L_QB(100pH) -- N_B
     |                     |
     +-- B_SET JJ ---------+   (area=0.05, Ic=5uA, unchanged)
     |                     |
     +-- I_SET_BIAS -------+   (+4.2 uA floating, unchanged)
     |                     |
     +-- BJL1 (N_A->gnd)   +-- RJ1 (N_A->gnd)   [NEW minimal load-line branch]
     +-- R_GAUGE 1Gohm ----+   (unchanged reference)
  new_elements:
    - name: BJL1_SHUNT
      nodes: N_A -> ground
      area: 0.10
      ic_uA: 10.0
      ic_ordering_rationale: >-
        Must be strictly above J_SET Ic (5 uA) so signal current prefers
        switching J_SET; placed at exactly 2x J_SET Ic as the minimal
        separation that guarantees ordering without introducing a new scale.
        Not copied from paper/v4 ratios (different current class entirely).
    - name: RJ1_SHUNT
      nodes: N_A -> ground
      ohm: 100.0
      rationale: >-
        Matches the R_DAMP=100 ohm class already proven benign in this node
        class (R2 series); provides the irreversible damping channel sized to
        the same impedance environment.  At the ~100 uV oscillation level it
        draws ~1 uA - comparable to the drive, so it participates in dynamics
        (which is the point) without dominating them.
  unchanged: [L_TX, K polarity/magnitude, L_QB, J_SET area, bias 4.2 uA,
    R_GAUGE 1G, stimulus matrix, timestep/stop]

