id: bvm-full-closed-loop-qb-parameter-screening-v1-20260911
study_phase: EXPLORATORY
mode: QUICK_SCREENING
status: PREREGISTERED_PENDING_PREFLIGHT
role: Experimental Operator + Evidence Packager

question:
  primary: >-
    Find a bounded one-factor QB working point in the current real
    BVM->COMMON_SL/JSL->QB->six-stage-JTL closed loop that preserves N2=2
    while selectively suppressing the N3 fourth response toward N3=3.
  interpretation_ceiling: >-
    Screening evidence is bounded to the declared current BVM/JSL model,
    receiver, load, history, solver and 0.1 ps grid. A candidate is not a
    Gate, hardware result, universal optimum or paper claim.

topology:
  full_closed_loop: BVM1..BVM4 -> COMMON_SL -> eight-JJ JSL -> QB -> JTL1..JTL6 -> R_TERM
  no_replay: true
  no_passive_capture: true
  no_jtl_parameter_change: true

source_authority:
  current_population_experiment: test/exploration/bvm-population-scaling-rj2p12-l1p14-l2p20-ib260-rj32-bjs400-v1-20260910
  current_bvm_include: inputs/bvm_jm2_connected.cir
  current_jj_model: inputs/jjmit.cir
  current_jtl_include: inputs/jtl2.cir
  current_bq_include: inputs/BQ_parameterized_bjs400_rj2.cir
  solver: build/josim-cli
  baseline_raw_0011: references/baseline_rj2p12/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P12_0011/raw.csv
  baseline_raw_0111: references/baseline_rj2p12/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P12_0111/raw.csv

baseline:
  Lin_pH: 1.5
  L1_pH: 1.4
  L2_pH: 2.0
  RJ1_ohm: 32.0
  RJ2_ohm: 12.0
  IBias_uA: 260.0
  BJS_area: 4.0
  BJ1_area: 0.9
  BJ2_area: 2.0
  L3_pH: 1.3
  BJS_Ic_uA: 400.0
  JSL_area: 5.0

screening_matrix:
  parameter_points:
    L1_pH: [1.2, 1.6, 1.8, 2.0]
    L2_pH: [1.6, 1.8, 2.2, 2.4]
    RJ1_ohm: [24, 28, 36, 40]
    RJ2_ohm: [10, 14, 16]
    IBias_uA: [240, 250, 270, 280]
    Lin_pH: [1.0, 1.25, 1.75, 2.0]
    BJ1_area: [0.75, 0.80, 1.00, 1.10]
    BJ2_area: [1.6, 1.8, 2.2, 2.4]
    BJS_area: [3.0, 3.5, 4.5, 5.0]
    L3_pH: [1.0, 1.6]
  nonbaseline_point_count: 37
  masks_per_point: ['0011', '0111']
  maximum_logical_screening_solves: 74
  priority_order: [BJ2_area, Lin_pH, L1_pH, L2_pH, RJ1_ohm, IBias_uA, BJ1_area, BJS_area, RJ2_ohm, L3_pH]
  one_factor_only: true

reuse_policy:
  exact_reuse_allowed: true
  reuse_cases:
    - RJ2=10 / mask=0011
    - RJ2=10 / mask=0111
    - RJ2=11 / mask=0011 (context only)
    - RJ2=11 / mask=0111 (context only)
    - RJ2=12 baseline / mask=0011
    - RJ2=12 baseline / mask=0111
  physical_solve_this_experiment: false
  require_deck_topology_parameter_protocol_hash_checks: true

stimulus:
  amplitude_uA: 100.0
  rise_fall_ps: 1.0
  plateau_ps: 9.0
  history: IDLE 0-50; WRITE0 50-61; IDLE 61-70; ZERO_STATE_READ_CONTROL 70-81; IDLE 81-90; WRITE1 90-101; SETTLE 101-110; FINAL_READ 110-121; TAIL 121-200
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  tran: .tran 0.1p 200p
  final_read_masks: ['0011', '0111']

classification:
  control_window_ps: [70, 110]
  phase_baseline_ps: [101, 110]
  phase_navigation_thresholds_turns: [0.5, 1.5, 2.5, 3.5, 4.5]
  terminal_locator_voltage_threshold_V: 0.0002
  terminal_min_peak_gap_ps: 2.5
  S: DIRECT_2_TO_3_CANDIDATE
  A: PROMISING_SELECTIVE_SUPPRESSION
  B: NEUTRAL_2_TO_4
  C: GLOBAL_WEAKENING
  D: WORSE_OR_UNSTABLE
  candidate_validation: [0001, 0011, 0111, 1111]
  candidate_validation_new_solves_max: 2

early_stop:
  if_S_found: stop_broad_screening_and_validate_full_population
  if_full_1_2_3_4: FULL_POPULATION_1_2_3_4_CANDIDATE
  if_no_direct_point: NO_DIRECT_2_TO_3_POINT
  no_automatic_combination: true
  no_automatic_positional_validation: true
  no_automatic_timestep_robustness: true

authorized_runs: []
physics_solve_count: 0
maximum_physics_solve_count_including_candidate_validation: 76

visualization:
  manifest_path: visualization/manifest.json
  qa_path: qa/visualization_qa.json
  navigation_path: visualization/run_summaries
  renderer: scripts/josim-plot2.py
  layout: sep_comb
  color: dark
  phase_option: 2pi
  whole_run_window_ps: [0, 200]
  focused_candidate_window_ps: [108, 150]
  comparison_required: true
  plots_not_in_raw_handoff_zip: true

package:
  include_plots: false
  additional_paths:
    - HANDOFF_README.md
    - analysis
    - screening
    - qa
    - data
    - references
    - mechanical_summary.json
    - run.sh
  analysis_files:
    raw_qa.json: qa/raw_qa.json
    deck_diff_qa.json: qa/deck_diff_qa.json
    provenance.json: qa/provenance.json
    execution_summary.json: qa/execution_summary.json
    transformation_registry.json: qa/transformation_registry.json

stop:
  final_state: EXPERIMENT_COMPLETE / AWAITING_SCIENTIFIC_REVIEW
  automatic_followup: false
  no_unregistered_parameter: true
