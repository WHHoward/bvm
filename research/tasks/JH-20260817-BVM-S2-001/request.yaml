task:
  kind: EXPERIMENT
  objective: "Create exactly one immutable 16-run BVM S2 package and report only bounded, fixed-closure external-load source and internal-trajectory observations at the registered 0.0125 ps working timestep."
  research_question: "With every BVM condition fixed except external R_LD={1,12,25,50} ohm, how do matched-control-corrected V(SL1), I(L_SL|XBVM1), and direct JM1/JM2/JS1/JS2 trajectories vary for operational init_positive/init_negative?"
  non_goals:
    - "Do not rerun, alter, reinterpret, or upgrade S0 or S1 evidence; S1 numerical INCONCLUSIVE remains unchanged."
    - "Do not make a numerical-convergence or resolution-independent claim; S2 is a single-grid bounded characterization."
    - "Do not attach or evaluate BQ, DCSFQ_BVM, JTL, T1, a receiver, INTERFACE_GATE_V1, a candidate, route, logical read0/read1, state preservation, SFQ/event, fluxoid, hardware, published reproduction, or universal source impedance."
    - "Do not add loads, timesteps, cases, probes, windows, bands, sweeps, parameter tuning, interpolation, resampling, or time alignment after inspecting data."
  claim_ceiling: "bounded per-load source and load-associated internal-trajectory observations at the registered 0.0125 ps working timestep, plus named terminal affine-compatibility diagnostics only"
