    abs(delta_phase)>=2*pi and start_time<=130 ps; report the voltage area over
    exactly that segment using the same B_TRIG voltage and actual CSV time.
  non_trigger: no complete segment in TRIGGER_ANALYSIS; controls additionally
    have no complete segment in CONTROL_FULL and no observed free-running activity
  forbidden_shortcuts: [I_total_above_Ic, voltage_peak_alone, derivative_sample_count, SFQ_count]
  SFQ_boundary: complete local phase transition is not called SFQ delivery
