  receiver_topology: >-
    SL -> R_IN -> L_TX -> B_TRIG; L_TX couples to the retained R1a
    secondary loop N_SEC -> L_SEC -> OUT_PORT -> R_SEC_LOAD -> ground;
    B_OUT is N_OUT -> N_SEC in parallel with a 100 ohm damping resistor,
    driven by a 7 uA bias source.  This is one root-cause topology correction
    to make the secondary drive differential at B_OUT.
  canonical_topology_modified: false
  excluded_this_round: [self_quench, output_JTL, JTL, T1, R1c, blind_sweep]
