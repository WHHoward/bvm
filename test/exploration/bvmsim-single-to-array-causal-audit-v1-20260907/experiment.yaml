experiment_id: bvmsim-single-to-array-causal-audit-v1-20260907
study_phase: EXPLORATION
mode: QUICK
status: PREREGISTERED
base_head: 470ad38cdaea0e55ed2a77d5e72c3ec7d001192e

question:
  primary: >-
    定位 historical JM2-connected single BVM -> QB 正常轨迹在进入
    4x1 shared-SL array 后从哪一层、哪一个最小改变开始偏离，并区分
    sensing boundary、history/protocol、quiet-cell loading 和 second-active-cell
    shared-SL coupling。
  required_answers:
    - Golden single S1 与 4x1 one-hot active BVM 的最早分歧层
    - 分歧是在 READ 前已存在还是由 READ 触发
    - LSL/RSL disturbance 是否穿透到 LS2/JS2、LM3、LS1/JS1、JM2/JM1
    - quiet BVM 与 active victim 的 aggressor-victim response
    - passive boundary 与 QB-loaded boundary 的 coupling 差异
    - G0 -> G4 中第一次明显破坏 Golden Reference 的步骤

source_authority:
  bvm_class: HISTORICAL_BVMSIM_JM2_CONNECTED_VARIANT
  bvm_variant: test/exploration/bvmsim-jm2-connected-single-ab-v1-20260903/variants/bvm_jm2_connected.cir
  canonical_bvm: circuits/bvm/bvm_cell.cir
  canonical_bvm_used: false
  canonical_boundary_statement: >-
    circuits/bvm/bvm_cell.cir 只作为排除项保留；本任务所有 single、bridge
    和 array evidence 均使用 historical JM2-connected variant，不得写成
    canonical BVM 结果。
  qb: BVMSim/BQ.cir
  jtl: BVMSim/library_josim/jtl2.cir
  shared_jjmit: circuits/models/jjmit.cir
  solver: build/josim-cli

frozen:
  bvm_variant_and_internal_values: true
  jm2_connection: L_M2 2 3 24.5P
  internal_rsl_ohm: 12.0
  jsl_count: 12
  jsl_model: jjmit
  jsl_area: 5.0
  jsl_order: B_JSL01 -> B_JSL02 -> ... -> B_JSL12
  qb: BVMSim/BQ.cir exact historical original QB
  qb_nominal: RJ1=12ohm; RJ2=4ohm; IB=250uA
  jtl: BVMSim/library_josim/jtl2.cir exact historical six-stage chain
  jtl_bias_uA: 280.0
  termination_ohm: 10.0
  timestep_ps: 0.1
  stop_time_ps: 200.0
  no_parameter_sweep: true
  no_canonical_bvm: true
  no_optimization: true

existing_raw_first:
  golden_single: test/exploration/bvmsim-jm2-connected-single-rloop-observability-v1-20260904/runs/S1-J-RLOOP/raw.csv
  receiver_array: test/exploration/bvmsim-4bvm-common-sl-12jsl-qb-integration-v1-20260904
  passive_array: test/exploration/bvmsim-4bvm-paperlike-common-sl-accumulation-isolation-v1-20260904
  golden_condition: S1-J-RLOOP
  one_hot_masks: [0001, 0010, 0100, 1000]
  rationale: >-
    现有 raw 先用于描述 Golden-vs-array、aggressor-victim、passive-vs-QB；
    single 和 array protocol/history 及 sensing load 不同，不能把这组差异
    直接写成 COMMON_SL 的唯一因果证据。

bridge:
  execution_rule: >-
    仅在 existing-raw 分析确认 confounder 无法拆分后执行必要的 G1/G2；
    G3/G4 使用已存在且逐 deck/hash 核验的 4x1 raw，不重复运行相同物理条件。
    到 G4 后停止，不自动建立 G5。
  G0:
    source: golden_single
    bvm_count: 1
    sensing_boundary: historical 11 terminal JJs area=3.2 + BVMout area=3.2
    protocol: single S1 WRITE WL+BL at 50--61 ps; READ WL+SE at 70--81 ps
    changed_from_previous_step: none
    rerun: false
  G1:
    bvm_count: 1
    bvm_endpoint: COMMON_SL
    sensing_boundary: one shared 12x area=5.0 JSL stack COMMON_SL -> QBIN
    receiver: frozen BQ -> six frozen JTL stages -> 10ohm
    protocol: G0 single S1 protocol unchanged
    changed_from_previous_step: single sensing boundary -> 12-JSL array boundary
    unique_question: sensing boundary alone changes the single-BVM trajectory?
    executed_attempt: bridge/runs/G1-retry-01
  G2:
    bvm_count: 1
    bvm_endpoint: COMMON_SL
    sensing_boundary: same G1
    receiver: same G1
    protocol: array history: WRITE0 51--60 ps, no-history interval 70--90 ps,
      all-four-WRITE surrogate on the sole BVM 91--100 ps, final READ 111--120 ps
    changed_from_previous_step: array history/protocol only
    unique_question: array history/protocol alone changes the G1 trajectory?
    executed_attempt: bridge/runs/G2-retry-01
  G3:
    source: existing receiver raw mask 1000
    bvm_count: 4
    active_read: BVM1 only
    quiet_cells: BVM2/BVM3/BVM4 electrically connected to COMMON_SL
    changed_from_previous_step: add three electrically connected quiet BVMs
  G4:
    source: existing receiver raw mask 1100
    bvm_count: 4
    active_read: BVM1 and BVM2
    changed_from_previous_step: activate second READ aggressor
    stop_after: true

windows_ps:
  PRE: [45.0, 50.0]
  WRITE0: [50.0, 70.0]
  NO_HISTORY_READ: [70.0, 90.0]
  WRITE1_ALL: [90.0, 101.0]
  SETTLE: [101.0, 110.0]
  READ: [110.0, 170.0]
  TAIL: [170.0, 200.0]
  semantics: half-open; all integrations use actual stored time values

probe_schema: BVM_SINGLE_ARRAY_BRANCH_V1
probe_rules:
  phase: JoSIM P is radians; displayed turns are continuous_unwrap(rad)/(2*pi)
  current: positive from first netlist node to second
  voltage: V(first node)-V(second node)
  event: phase displacement, voltage area, I>Ic and crossings are not SFQ counts
  comparison: exact overlapping stored grid only; no interpolation
  bvm_per_cell: JM1/JM2/JS1/JS2 P/V/I; LM1/LM2/LM3/LPM/RJM1/LS1/LS2/RS/LS3/RSE/LPSE/LPSL/RSL/LSL I/V
  boundaries: COMMON_SL, QBIN, QBOUT, QB internal, JTL B01/B02

divergence:
  order: [COMMON_SL, LSL, RSL, LS2_JS2, LM3, LS1_JS1, JM2, JM1]
  threshold: max(numerical_floor, PRE max_abs_difference * 5)
  consecutive_samples: 3
  sensitivity: [threshold_factor_3, threshold_factor_10, consecutive_2, consecutive_5]
  interpretation: earliest robust divergence localizes a layer; it is not by itself root cause

visual_authority:
  renderer: scripts/josim-plot2.py
  layout: sep_comb
  color: dark
  phase_option: 2pi
  phase_display: turns = continuous_unwrap(raw radians)/(2*pi)
  acceptance: comparison HTML required for every key conclusion
  required_comparison_pages:
    - SINGLE_VS_ARRAY_OUTPUT.html
    - SINGLE_VS_ARRAY_RLOOP_LOWER.html
    - SINGLE_VS_ARRAY_RLOOP_UPPER.html
    - SINGLE_VS_ARRAY_MEMORY.html
    - READ_BEFORE_STATE.html
    - DIVERGENCE_TIMELINE.html
    - ACTIVE_VICTIM_CROSSTALK.html
    - QUIET_VICTIM_CROSSTALK.html
    - PASSIVE_VS_QB_CROSSTALK.html
    - SINGLE_TO_ARRAY_BRIDGE_OVERVIEW.html

interpretation_ceiling:
  - bounded simulation evidence only
  - no paper mechanism identity
  - no hardware or process-margin claim
  - no canonical-BVM compatibility claim
  - no universal isolation claim
  - no SFQ count from phase or voltage area

gate:
  state: AWAITING_USER_REVIEW
  user_reviewed: false
  next_step_authorized: false
  automatic_next_experiment: false
  next_action: STOP
