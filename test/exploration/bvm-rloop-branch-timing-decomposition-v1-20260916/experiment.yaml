question:
  primary: "Does the prior 0.3-ps total bridge-current effect decompose into R_S-only timing, L_S3-only timing, or coordinated branch timing/current sharing?"
  scope: "Two per-instance branch-current replay families, exact gate first, one 0.3-ps delay only."
  interpretation_ceiling: "Mechanical raw evidence and registered arithmetic; scientific categories remain review-gated."

source_fixture:
  forward_topology: "canonical BVM -> COMMON_SL -> JSL1..8 -> canonical QB -> JTL1..6 -> 10 ohm terminal"
  canonical_bridge: ["R_S 6 10 3.0", "L_S3 6 10 0.5P"]
  bridge_positive_direction: "node6 -> node10"
  total_current_definition: "I(R_S)+I(L_S3)"
  RS_family: "remove R_S; physical L_S3; replay per-instance I(R_S)"
  LS3_family: "physical R_S; remove L_S3; replay per-instance I(L_S3)"
  canonical_QB_JTL_terminal_unchanged: true
  previous_total_reference: test/exploration/bvm-rloop-bridge-timing-replay-v1-20260916

