task:
  kind: EXPERIMENT
  objective: "Create exactly one immutable four-run fixed-closure experiment that isolates the registered S1-versus-S2 initialization rising-edge timing intervention and reports JM1/JM2 pre-read settling/readiness without a read pulse."
  research_question: "At fixed 12 ohm, 0.0125 ps, closure, and polarity, does the registered S1-versus-S2 initialization rising-edge timing difference reproducibly change JM1/JM2 [80,90) ps readiness or the registered earlier settling amplitudes?"
  non_goals:
    - "Do not rerun, alter, reinterpret, or upgrade S0, S1, S2, MAINT-001 through MAINT-007, or their historical evidence."
    - "Do not add a timing/load/timestep/parameter sweep, read pulse, read-time load back-action study, BQ/DCSFQ/JTL/receiver, logical read, state-preservation, SFQ, fluxoid, Gate, route, hardware, or mechanism claim."
    - "Do not describe Timing B as a whole waveform translation or as preserving S2's plateau duration; it is the registered historical S1 rising-edge waveform with the common 20-21 ps return."
  claim_ceiling: "bounded fixed-closure, fixed-grid evidence for or against a reproducible registered initialization rising-edge intervention effect on JM1/JM2 pre-read settling/readiness only; no detailed mechanism or broader scientific claim"
