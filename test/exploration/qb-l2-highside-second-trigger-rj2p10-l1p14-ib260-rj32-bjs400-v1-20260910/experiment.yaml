early_stop:
  enabled: true
  condition: stop after a completed L2 pair if a second BJ1/BJ2/QBOUT/ordered-JTL1-to-JTL6/terminal multi-evidence candidate or a registered first-response/control failure is observed
  action: preserve all already produced evidence and stop before the next L2 pair; do not add an intermediate point or continue optimization
  L1_recrossing_alone: does_not_stop

mask_semantics:
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  "0001": BVM4 active during FINAL READ only
  "0011": BVM3 and BVM4 active simultaneously during FINAL READ only

windows:
  control_origin_ps: [70.0, 110.0]
  control_baseline_ps: [61.0, 70.0]
  final_origin_ps: [110.0, 200.0]
  final_baseline_ps: [101.0, 110.0]
  final_read_ps: [110.0, 121.0]
  post_first_bj2_anchor: first FINAL-origin BJ2 +0.9 diagnostic turn
  differential_windows:
    - [110.0, first_BJ1_plus_0p5]
    - [first_BJ1_plus_0p5, first_BJ2_plus_0p9]
    - [first_BJ2_plus_0p9, 121.0]
    - [121.0, 140.0]
    - [first_BJ2_plus_0p9, 140.0]
    - [first_BJ2_plus_0p9, 200.0]
    - [110.0, 121.0]
    - [110.0, 140.0]
    - [110.0, 200.0]
  semantics: half-open windows over actual stored timestamps; dynamic endpoints are stored navigation markers

mechanical_metrics:
  phase: raw P radians; independently continuous unwrap then divide by 2*pi for diagnostic turns only
  thresholds: +0.5, +0.9 and +1.5 relative turns; threshold samples are navigation diagnostics only
  l1_rearm: all stored-sample negative-to-positive transitions and positive dwell after first BJ2 anchor
  first_vs_second: first positive L1 excursion versus strongest later positive excursion; direct BJ1 current/phase and source/receiver support
  bj1_load_line: nominal Ic and max|I(BJ1)|/Ic are DERIVED_LOAD_LINE_DIAGNOSTIC only
  differential_voltage: direct V(BJ1), V(BJ2) and V(BJ1)-V(BJ2) areas on actual stored grid plus cumulative 110-to-t landmarks
  timing: every first/second marker and strongest excursion classified BEFORE_READ_END, AT_READ_END or AFTER_READ_END relative to 121ps
  response_candidate: BJ1 -> BJ2 -> QBOUT -> ordered JTL1..JTL6 -> terminal, mechanical multi-evidence candidate only
  second_response: require all second-chain components; L1>0 alone is insufficient
  integration: trapezoid using actual stored time values; no interpolation or resampling

guardrails:
  zero_state_read_control: all L2/mask cases separately inspect BJ1, BJ2, QBOUT, ordered JTL1..JTL6 and terminal
  control_failure_rule: a complete control-window multi-evidence progression is UNSUITABLE_WORKING_POINT
  first_response_0001: separately retain its first multi-evidence candidate; missing candidate is first-response failure boundary
  first_response_0011: separately retain its first progression before any second candidate
  no_event_or_sfq_counter: true
  outcome_labels: [OBSERVED, DERIVED, BOUNDED_RESULT, UNKNOWN]

probe_schema:
  controls: I(I_WL1..4), I(I_BL1..4), I(I_SE1..4)
  bvm: P/V/I(B_JM1,B_JM2,B_JS1,B_JS2), I/V registered branches and L_SL for XBVM1..4
  interface: V(COMMON_SL), P/V/I(B_JSL1..8), I(B_JSL8), V(QBIN)
  qb: V(QBIN), I/V(LIN), P/V/I(BJS), P/V/I(BJ1), I/V(RJ1), I/V(L1), I/V(IB), I/V(L2), P/V/I(BJ2), I/V(RJ2), I/V(L3), V(QBOUT)
  jtl: P/V/I(B01), P/V/I(B02), V(stage_OUT) for XJTL1_1..6, V(JTL6_OUT), I(R_TERM)
  optional_unknown: V(IB|XBQ1) if the solver does not emit it
  missing_probe_policy: preserve requested probe and mark UNKNOWN; never fabricate

