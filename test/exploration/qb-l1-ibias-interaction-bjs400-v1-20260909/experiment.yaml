    - references/reused
    - REUSED_REFERENCE_MANIFEST.json

prohibited_followups:
  - any mask other than 0001 or 0011
  - any extra L1, IBias or RJ1 point
  - any 0000, 1000, SINGLE or combined parameter beyond A-D
  - any timestep sweep, retry, tune, ranking, threshold, event counter or mechanism analysis
  - any scientific interpretation or next experiment

