correction:
  root_cause: >-
    In the initial direct-node point, the parallel zero-voltage L_SEC branch
    carried about 6.599 uA of the 7 uA bias while B_OUT carried only about
    0.401 uA, so the declared output bias did not reach B_OUT.
  topology: >-
    Keep B_OUT N_SEC->ground, but use L_SEC N_SEC->N_SEC_RTN followed by
    R_SEC_LOAD N_SEC_RTN->ground.  The secondary transient still enters N_SEC
    and the same KCL modulates B_OUT; the series resistor removes the direct
    zero-voltage DC return.
  fixture: inputs/diff_output_a010_b07_rd100_series_return.cir
  initial_analysis: analysis/initial-direct-analysis.json
