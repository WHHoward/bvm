task:
  kind: EXPERIMENT
  objective: "Create a new immutable fixed-fixture BVM source package and determine only whether named source observables are numerically converged under the registered S1 timestep procedure."
  research_question: "Under the fixed BVM closure, 12-ohm load, operational init_positive/init_negative procedures, single read PWL, and matched zero-read controls, do V(SL1) and I(L_SL|XBVM1) satisfy the preregistered S1 numerical timestep-convergence procedure?"
  non_goals:
    - "Do not alter, rerun, overwrite, reinterpret, or upgrade BVM-S0 raw, criteria, or C02 disposition."
    - "Do not attach/test BQ, DCSFQ_BVM, JTL, T1, receiver behavior, INTERFACE_GATE_V1, candidate selection, route choice, load/bias/device/read sweeps, or parameter tuning."
    - "Do not make logical read0/read1, memory/state-preservation, SFQ, event, fluxoid, universal source-specification, hardware, or published-reproduction claims."
    - "Do not add a fourth timestep or move windows/bands/stimulus after inspecting results."
  claim_ceiling: bounded_fixed_fixture_source_observations_and_numerical_convergence_under_registered_s1_procedure_only
