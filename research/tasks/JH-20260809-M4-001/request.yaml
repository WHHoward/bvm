acceptance:
  - id: AC1
    condition: "输出同时保留 phase_delta_rad，并以 phase_delta_turns = phase_delta_rad/(2*pi) 显式派生圈数；字段名和帮助文本写明单位。"
    evidence:
      - "实现代码审查"
      - "合成输入单元测试日志"
  - id: AC2
    condition: "独立常数断言覆盖 0、+2*pi、-2*pi、+4*pi 和非整数圈，不从被测实现反向生成期望值。"
    evidence:
      - "test/metrics/test_sfq_metrics_v2.py"
      - "测试日志"
  - id: AC3
    condition: "任何逐采样阈值统计都只命名为 activity/over-threshold intervals 或 samples；不得输出 fast_events、pulse_count、sfq_count 等事件语义。"
    evidence:
      - "输出 key 与 CLI help 审查"
      - "防回归测试"
  - id: AC4
    condition: "实现明确标注 full-trace endpoint delta 只是 M4 单位基础，不能替代 M5 稳定窗/零输入控制或 M6 电压面积，也不能形成物理 Gate。"
    evidence:
      - "模块/CLI 文档字符串审查"
      - "JSON 元数据审查"
  - id: AC5
    condition: "v1 scripts/sfq_metrics.py 与 test/final/** 的内容保持不变，所有新增测试可在不运行 JoSIM、不联网和不安装依赖时通过。"
    evidence:
      - "基线哈希与最终 diff"
      - "测试命令、退出码和日志"
  - id: AC6
    condition: "execution receipt 完整映射 AC1–AC6，列出所有实际改动、文件哈希、测试、限制、未知与偏离。"
    evidence:
      - "当前 attempt 的 receipt.yaml"
      - "josim-handoff verify-task 输出"
invalid_conditions:
  - "任一冻结文件或历史 raw 文件被修改、覆盖、重命名或删除。"
  - "把 raw P() 数值直接标为 SFQ/flux-quantum count，或省略 rad 到 turns 的 2*pi 换算。"
  - "把过阈值采样区间/样本数命名或解释成脉冲数、结翻转数或下游 SFQ 接收数。"
  - "测试期望值由被测换算函数本身生成，形成循环验证。"
  - "缺少实际改动/日志/产物的哈希或超出授权写路径。"
inconclusive_conditions:
  - "若 JoSIM CSV 列语义无法由绑定源码和文档确定，停止推断并报告需要补充的最小证据。"
