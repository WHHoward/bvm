    RJ1: [NOMINAL, RJ1_UP_05, RJ1_UP_10]
  mechanism_plots: [BJ1_phase_plane_separate_by_family, ARRAY_source_decomposition_110_116ps]
  transformations: none except registered exact window slices and independent phase unwrap/rad_to_turn display
  no_sfq_label: true

qa:
  raw: [pre_hash, post_hash, sample_count, first_timestamp, last_timestamp, monotonicity, stored_grid_stats, finite_values, required_probe_presence, duplicate_columns, units, sign_convention]
  deck_diff: variants_vs_nominal_only_one_registered_parameter_line
  raw_qa_failure_state: ARTIFACT_INVALID
  no_convergence: UNKNOWN
  independent_crosscheck_required: true

prohibited_followups:
  - combined RJ1+L1 point
  - any unregistered L1/RJ1 value or additional mask
  - N2/N3/N4, SINGLE, ideal replay, idle/0-active
  - timestep/solver convergence or sensitivity
  - timing, JSL count/area, BVM/QB/JTL/load/topology changes
  - BJ1/BJ2/BJs/IB/L2/RJ2/L3/LIN redesign or tuning
  - automatic next experiment or parameter recommendation

interpretation:
  allowed_labels: [OBSERVED, DERIVED, BOUNDED_RESULT, UNKNOWN]
  no_claims: [root_cause, proves_mechanism, optimal, general_solution, hardware_safe, SFQ_count]
  final_state: AWAITING_USER_REVIEW
