id: bvm-qb-threshold-ordering-boundary-search-v1-20260911
study_phase: EXPLORATORY
mode: QUICK_BOUNDARY_SEARCH
status: EXPERIMENT_COMPLETE / AWAITING_SCIENTIFIC_REVIEW
role: Experimental Operator + Evidence Packager

question:
  primary: >-
    At fixed L3=1.6 pH, determine whether the N2 1-to-2 response threshold
    precedes or follows the N3 3-to-4 threshold at the registered L2 and
    IBias midpoints.
  interpretation_ceiling: >-
    Results are bounded to the named BVM/JSL source, QB/JTL receiver, load,
    stored history, solver and 0.1 ps grid. No exact continuous threshold,
    hardware claim or route verdict is inferred.

topology:
  full_closed_loop: BVM1..4 -> COMMON_SL -> eight-JJ JSL -> QB -> six-stage JTL -> R_TERM
  no_replay: true
  no_passive_capture: true
  no_isolated_qb: true
  no_source_scaling: true
  no_jtl_parameter_change: true

source_authority:
  previous_screening: test/exploration/bvm-full-closed-loop-qb-parameter-screening-v1-20260911
  previous_combination: test/exploration/bvm-qb-two-parameter-combination-v1-20260911
  current_bvm_include: inputs/bvm_jm2_connected.cir
  current_jj_model: inputs/jjmit.cir
  current_jtl_include: inputs/jtl2.cir
  current_bq_include: inputs/BQ_parameterized_bjs400_rj2.cir
  canonical_baseline_0011: references/canonical_baseline/0011/raw.csv
  canonical_baseline_0111: references/canonical_baseline/0111/raw.csv

baseline:
  Lin_pH: 1.5
  L1_pH: 1.4
  L2_pH: 2.0
  RJ1_ohm: 32.0
  RJ2_ohm: 12.0
  IBias_uA: 260.0
  BJS_area: 4.0
  BJ1_area: 0.9
  BJ2_area: 2.0
  L3_pH: 1.3

boundary_search:
  fixed_L3_pH: 1.6
  stage_a: {point_id: STAGE_A_L2_MIDPOINT, L2_pH: 1.8, L3_pH: 1.6}
  stage_b: {point_id: STAGE_B_IBIAS_MIDPOINT, IBias_uA: 250.0, L3_pH: 1.6}
  endpoint_context:
    L2: {low: 1.6, midpoint: 1.8, high: 2.0}
    IBias_uA: {low: 240.0, midpoint: 250.0, high: 260.0}
  masks_per_midpoint: [0011, 0111]
  logical_midpoint_count: 2
  logical_case_count: 4
  maximum_new_physical_solve_count: 4

stimulus:
  amplitude_uA: 100.0
  rise_ps: 1.0
  fall_ps: 1.0
  plateau_ps: 9.0
  history: IDLE 0-50; WRITE0 50-61; IDLE 61-70; ZERO_STATE_READ_CONTROL 70-81; IDLE 81-90; WRITE1 90-101; SETTLE 101-110; FINAL_READ 110-121; TAIL 121-200
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  tran: .tran 0.1p 200p
  final_read_masks: [0011, 0111]

control_history:
  windows_ps:
    zero_state_read_control: [70.0, 81.0]
    idle: [81.0, 90.0]
    write1: [90.0, 101.0]
    settle: [101.0, 110.0]
  criterion: unintended complete downstream QBOUT -> JTL1 -> ... -> JTL6 propagation before FINAL READ
  rollback_excluded_from_control: true
  qbout_peak_threshold_V: 0.0002
  jtl_peak_threshold_V: 0.0002

classification:
  phase_baseline_window_ps: [101.0, 110.0]
  phase_navigation_thresholds_turns: [0.5, 1.5, 2.5, 3.5, 4.5]
  direct: DIRECT_2_TO_3_THRESHOLD_WINDOW_FOUND
  low_side: STILL_1_TO_3
  high_side: 2_TO_4_MIDPOINT
  unfavorable: UNFAVORABLE_THRESHOLD_ORDERING
  ambiguous: BOUNDARY_MULTIPLICITY_AMBIGUOUS
  phase_navigation_only: true
  no_exact_continuous_threshold: true

forbidden_followups:
  additional_midpoints: [L2=1.7, L2=1.9, IBias=245, IBias=255]
  n1_n4_before_later_authorization: true
  third_parameter: true
  timestep_refinement: true
  replay: true
  read_extension: true

authorized_runs: []
physics_solve_count: 4
actual_new_physical_solve_count: 4
reused_endpoint_reference_count: 10
maximum_physics_solve_count_including_validation: 4
boundary_outcome: NO_DIRECT_2_TO_3_TWO_PARAMETER_COMBINATION

visualization:
  manifest_path: visualization/manifest.json
  qa_path: qa/visualization_qa.json
  navigation_path: visualization/run_summaries
  renderer: scripts/josim-plot2.py
  layout: sep_comb
  color: dark
  phase_option: 2pi
  whole_run_window_ps: [0.0, 200.0]
  focused_window_ps: [108.0, 150.0]
  comparison_required: true
  plots_not_in_raw_handoff_zip: true

package:
  include_plots: false
  additional_paths:
    - HANDOFF_README.md
    - analysis
    - boundary
    - qa
    - references
    - mechanical_summary.json
    - run.sh
  analysis_files:
    raw_qa.json: qa/raw_qa.json
    deck_diff_qa.json: qa/deck_diff_qa.json
    provenance.json: qa/provenance.json
    execution_summary.json: qa/execution_summary.json
    transformation_registry.json: qa/transformation_registry.json

stop:
  final_state: EXPERIMENT_COMPLETE / AWAITING_SCIENTIFIC_REVIEW
  automatic_followup: false
  no_unregistered_parameter: true
