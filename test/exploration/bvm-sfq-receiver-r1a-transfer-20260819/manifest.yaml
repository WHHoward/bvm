criterion:
  trigger_read1: >-
    At least one monotonic continuous B_TRIG segment in TRIGGER_ANALYSIS with
    abs(delta_phase)>=2*pi and start_time<=130 ps; report raw phase endpoints
    and the same-segment B_TRIG voltage area.
  trigger_read0_and_controls: >-
    No complete B_TRIG segment in TRIGGER_ANALYSIS for read0 and no complete
    segment in CONTROL_FULL for either READ=0 control; no free-running control.
  secondary_amplitude: >-
    For V(N_SEC) and I(R_SEC_LOAD), define A as the maximum absolute
    activity-window deviation from that case's PRE median.  Read1 must have
    A_V>=10 uV and A_I>=1 uA, each A_read1>=2*A_read0, and each
    A_read1>=5*max(A_logical1_control,A_logical0_control).  These thresholds
    are state-dependent signal-extraction thresholds, not JJ switching or SFQ
    thresholds.
  secondary_controls: >-
    Both controls must remain below one-fifth of the read1 secondary amplitude
    for both selected secondary signals and show no spontaneous trajectory.
  pickup_noninvasive_comparison: >-
    Compare new and R0b B_TRIG raw/unwrapped trajectories, same-JJ voltage
    areas, SL/N6, input current, and JM1/JM2.  Preservation of a complete
    read1 trigger and read0/control negative behavior is mandatory; closeness
    to the R0b approximately 4.997-turn multi-turn trajectory is a preferred
    characterization, not a new SFQ-count claim.
  forbidden_shortcuts: [I_above_Ic, voltage_peak_alone, phase_range_alone, secondary_peak_without_pre_control, SFQ_count]
  SFQ_boundary: >-
    A passive secondary transient and a local B_TRIG transition are not called
    SFQ delivery and do not establish downstream JTL reception.
  verdict: >-
    PASS only if read1 B_TRIG complete, read0/control B_TRIG non-complete,
    secondary V/I state-dependent thresholds pass, and BVM/back-action probes
    show no obvious storage-sign destruction. Otherwise FAIL if artifacts are
    valid and a necessary condition is absent; INVALID for data/solver failure.
