interpretations:
  - "V(Bn|XDCSFQ) 为同 JJ 直接结电压：与相位通道同符号同量级，残差 ~1e-5 圈量级；残差系统性来源推断为输出 FIR 滤波与 Gear 二阶导数公式的窗口边界项（推断，未单变量对照）。"
  - "0u 运行仍有 ~0.003–0.008 圈净变化（偏置启动后慢漂移），由匹配零输入控制相减吸收。"
