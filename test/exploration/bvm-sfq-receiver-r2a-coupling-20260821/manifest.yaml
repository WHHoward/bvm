verdict_summary: >-
  Artifact-valid twenty-case matched Exploration.  Increasing K from 0.60 to
  0.95 increased read1 secondary voltage activity from 56.5689 to 88.7317 uV
  and increased read1 B_OUT activity from 0.016588561 to 0.026122419 turn.
  The same-JJ voltage areas agree with those sub-turn phase segments, but no
  point reaches one complete turn.  Read0 and READ=0 controls remain
  non-complete and non-free-running; B_TRIG, source discrimination, and
  storage-sign guards pass.  The result supports K as a real input-transfer
  margin variable but does not show that K alone closes activation; a loaded
  receiver dynamic limitation or a threshold beyond the bounded range remains
  plausible.  No topology, BVM, JJ, bias, damping, or measurement change was
  made, and no Candidate upgrade was performed.
