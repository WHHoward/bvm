research_question: >-
  At the frozen B_OUT operating point (AREA=0.10, Ic=10 uA, bias=7 uA,
  R_OUT_DAMP=100 ohm, jjmit model), what is the minimum amplitude of an ideal
  PWL current pulse injected directly into N_SEC, with a shape matched to the
  measured real read1 forward-drive transient, that produces one complete 2*pi
  phase transition of B_OUT?  This calibrates the required minimum effective
  dynamic drive so any future transformer/secondary topology can be compared
  against it.  It is not receiver optimization.
pulse_shape_source:
  method: measured from R2-B raw k095-r100 read1 run-01.csv (not assumed)
  effective_drive_direction: >-
    i_BOUT increase in its positive element direction (N_SEC -> ground),
    produced by secondary loop current flowing INTO N_SEC; KCL closure verified
    at every snapshot (i_BOUT = I_BIAS - i_LSEC - i_RDAMP).
  real_read1_transient:
    forward_lope_peak_delta_i_bout_uA: +1.458
    forward_lope_peak_time_ps: 104.51
    forward_lope_fwhm_ps: 0.27
    forward_lope_fwhm_span_ps: [104.38, 104.65]
    counter_lobe_min_delta_i_bout_uA: -2.176
    counter_lope_time_ps: 107.19
    biphasic_note: >-
      the real chain drive is biphasic (+1.46 then -2.18 uA); the calibration
      pulse is unipolar and matches only the forward lobe shape, which is the
      minimal effective drive direction.  This is recorded as a deliberate
      simplification, not as an equivalence claim.
  pulse_definition:
    waveform: symmetric triangle PWL on source I_DIRECT 0 N_SEC
    base_zero_points_ps: [103.97, 105.05]
    peak_time_ps: 104.51
    fwhm_ps: 0.27
    polarity: positive amplitude on 0->N_SEC source = same physical direction
      as the real read1 forward-drive lobe
amplitude_matrix:
  values_uA: [2.0, 3.0, 4.0, 5.0]
  order: ascending, stop at first complete transition
  rationale: >-
    Static criticality from bias alone requires +3.0 uA (Ic - bias).  2.0 uA is
    clearly below even the static requirement; 3.0 uA equals the static
    minimum; 4.0 and 5.0 exceed it for dynamic/inertial assistance.  The narrow
    0.27 ps FWHM delivers little charge (Q = A*base/2 = 2.7-6.75 fC across the
    matrix vs C*Phi0 = 14.5 fC per full turn through the junction capacitance
    alone), so thresholds above 5 uA are plausible; if no point switches, the
    bounded answer is NO_THRESHOLD_IN_BOUNDED_MATRIX and duration/shape becomes
    the next axis by explicit plan, not by auto-extension.
