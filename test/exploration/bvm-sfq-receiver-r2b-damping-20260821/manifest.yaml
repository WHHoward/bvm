research_question: >-
  Is B_OUT local damping (R_OUT_DAMP, the N_SEC-to-ground shunt in parallel with
  the output JJ) the dominant reason the state-dependent secondary transient
  fails to evolve into a complete 2*pi phase transition?  Concretely: with K_TX
  frozen at 0.95 and all R2-A baseline parameters fixed, does weakening only
  R_OUT_DAMP produce a large (approaching or reaching one-turn) increase in
  read1 B_OUT phase excursion, while read0 and zero-READ controls stay sub-turn?
hypothesis: >-
  H2 (preregistered primary): at the frozen operating point the read1 drive is
  marginal and the parallel shunt both steals transient bias current
  (i_RDAMP = V(N_SEC)/R_OUT_DAMP) and overdamps the junction
  (beta_c(RN||R_OUT_DAMP) = 0.81 at 100 ohm < 1).  Weakening R_OUT_DAMP raises
  Reff toward RN, raises beta_c across the underdamped transition, reduces
  shunt current theft, and lets the input transient evolve into a complete
  phase slip.  Prediction: read1 largest monotonic B_OUT segment grows strongly
  and monotonically with R_OUT_DAMP (0.026 turn -> >=0.1 -> ~0.3 -> approaching
  or reaching 1.0 turn), while read0/controls remain sub-turn.
alternative_hypotheses:
  H1_transfer_margin_exhausted: >-
    The secondary-to-output injection mechanism itself is too weak; damping
    changes leave read1 B_OUT near 0.02-0.03 turn (Situation B).  This would
    redirect attention to the flux/current injection topology rather than any
    further parameter sweep.
  overweakening_instability: >-
    At larger R_OUT_DAMP the junction becomes underdamped enough to ring,
    retrap slowly, free-run, or switch on read0/control (Situation C), meaning
    activation and self-quenching define an operating window rather than a
    monotonic improvement.
  loading_backaction: >-
    Changing R_OUT_DAMP alters the secondary load line enough to change the
    upstream transfer or BVM readout itself; guards must be checked before any
    output-stage interpretation.
variable:
  name: r_out_damp_ohm
  units: ohm
  values: [100.0, 150.0, 220.0, 330.0]
  baseline: 100.0
  only_changed_variable: true
  maximum_operating_points: 4
  rationale: >-
    Candidate ladder chosen from Reff = RN||R_OUT_DAMP and beta_c =
    2*pi*Ic*Reff^2*C/Phi0 with Ic=10 uA, C=7 fF, RN=160 ohm:
    100 -> Reff=61.538, beta_c=0.8055;
    150 -> Reff=77.419, beta_c=1.2749;
    220 -> Reff=92.632, beta_c=1.8251;
    330 -> Reff=107.755, beta_c=2.4697.
    The ladder crosses beta_c = 1 between 100 and 150 ohm, is roughly
    geometric, and keeps Reff < RN so the junction stays explicitly shunted
    (no topology change, bounded departure from the accepted baseline).
