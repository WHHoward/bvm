  - {id: AC3, condition: "All twelve raw runs preserve actual time, CSV/stdout/stderr, input/model closure and hashes. Required source, input, and direct JM1/JM2 P/V columns are finite and complete; solver/CSV/provenance failure is INVALID.", evidence: [raw-csv, stdout-stderr, manifest.yaml]}
  - {id: AC4, condition: "Report pre/activity/post direct-JJ observables, same-JJ actual-time phase-area values, matched-control source-port waveform observables, and explicit NOT_APPLICABLE reasons without event/Gate/logical language."
