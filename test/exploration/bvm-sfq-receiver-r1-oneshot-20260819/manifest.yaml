research_question: >-
  Can the R0b canonical-SL receiver be extended with the minimum local
  feedback/quench and output-JJ elements so that logical1 produces exactly
  one complete local output-Junction phase event, while logical0 and both
  matched READ=0 controls produce zero complete output events?
hypothesis: >-
  A 1 pH lossy primary branch, magnetically coupled at k=0.80 to a 2 pH
  output loop, will transfer one read1 pulse to a 35 uA-biased AREA=0.50
  output JJ.  The 15 ohm primary shunt and 20 ohm output-JJ shunt will
  dissipate the post-trigger energy, lower the effective B_TRIG drive, and
  allow both junctions to retrap without a second output transition.
alternatives:
  - The output pulse may be too weak because the output bias is too far below Ic or the coupling polarity is unfavorable.
  - The output JJ may run more than one turn because the 5-turn R0b trigger excursion is not sufficiently isolated from the output loop.
  - The quench branch may be too weak to retrap B_TRIG, or too strong and load the SL signal before output transfer.
  - The output damping may prevent a complete output transition or may be insufficient for reset.
  - A complete output phase segment may be a startup/bias artifact rather than a canonical read1 response.
  - Phase and voltage-area agreement may fail if a wrapped phase sample, endpoint, direction, or time unit is mishandled.
  - The receiver may alter BVM read1/read0 or storage behavior even when its local output looks one-shot.
