# Multi-attempt receipt aggregation repair: task-wide deliverable and
# acceptance coverage across the union of canonical per-attempt receipts,
# preserving per-receipt hash/scope/artifact checks and single-attempt
# behaviour.  001/002 historical records below are hash-bound lineage only;
# none of them was modified by 003.
#
# HISTORICAL_PROTOCOL_MULTI_ATTEMPT_DEFECT (002 A01/A02):
