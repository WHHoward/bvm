  # The remaining RJ2=12ohm pair was not run because the registered early-stop
  # condition was observed at RJ2=10ohm/0011. Its decks remain preserved above.

early_stop:
  enabled: true
  condition: strict stored-sample I(L1) negative-to-positive transition after first FINAL-origin BJ2 +0.9 navigation anchor in the completed 0011 member of a pair
  action: stop before the next RJ2 pair; preserve all already produced evidence; do not add an intermediate point or continue optimization
  interpretation: mechanical navigation stop only; scientific review remains pending

mask_semantics:
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  "0001": BVM4 active during FINAL READ only
  "0011": BVM3 and BVM4 active simultaneously during FINAL READ only

windows:
  control_origin_ps: [70.0, 110.0]
  control_baseline_ps: [61.0, 70.0]
  final_origin_ps: [110.0, 200.0]
  final_baseline_ps: [101.0, 110.0]
  post_first_bj2_anchor: first FINAL-origin BJ2 +0.9 diagnostic turn
  required_differential_windows_ps:
    - [first_BJ2_anchor, 121.0]
    - [121.0, 140.0]
    - [first_BJ2_anchor, 140.0]
    - [first_BJ2_anchor, 200.0]
    - [110.0, 121.0]
    - [110.0, 140.0]
    - [110.0, 200.0]
  semantics: half-open windows over actual stored timestamps; dynamic endpoints are stored navigation markers

mechanical_metrics:
  phase: raw P radians; independently continuous unwrap then divide by 2*pi for diagnostic turns only
  thresholds: +0.5, +0.9 and +1.5 relative turns; threshold samples are navigation diagnostics only
  l1_recrossing: only an actual stored negative-to-positive adjacent sample transition is OBSERVED_L1_RECROSSING
  l1_positive_dwell: stored-sample duration from first positive sample until first non-positive sample, or window end
  differential_voltage: separately retain direct V(BJ1) area, V(BJ2) area and V(BJ1)-V(BJ2) area on actual stored grid
  source_side: I(B_JSL8), I(LIN|XBQ1), V(QBIN), V(COMMON_SL) in control, final and post-anchor windows
  receiver_side: I(L2), V(L2), I(RJ2), V(RJ2), I(L3), V(BJ2), QBOUT and terminal diagnostics
  response_candidate: BJ1 -> BJ2 -> QBOUT -> ordered JTL1..JTL6 -> terminal, labeled mechanical multi-evidence candidate only
  second_response: independently record post-anchor BJ1/BJ2/QBOUT/JTL/terminal candidates; never infer multiplicity from phase alone
  integration: trapezoid using actual stored time values; no interpolation or resampling

guardrails:
  zero_state_read_control: all RJ2/mask cases separately inspect BJ1, BJ2, QBOUT, ordered JTL1..JTL6 and terminal
  control_failure_rule: a complete control-window multi-evidence progression is UNSUITABLE_WORKING_POINT
  first_response_0001: separately retain its multi-evidence response candidate; 0001->0 is not a successful candidate
  first_response_0011: separately retain its first progression before any post-anchor candidate
  no_event_or_sfq_counter: true
  outcome_labels: [OBSERVED, DERIVED, BOUNDED_RESULT, UNKNOWN]

probe_schema:
  controls: I(I_WL1..4), I(I_BL1..4), I(I_SE1..4)
  bvm: P/V/I(B_JM1,B_JM2,B_JS1,B_JS2), I/V registered branches and L_SL for XBVM1..4
  interface: V(COMMON_SL), P/V/I(B_JSL1..8), I(B_JSL8), V(QBIN)
  qb: V(QBIN), I/V(LIN), P/V/I(BJS), P/V/I(BJ1), I/V(RJ1), I/V(L1), I/V(IB), I/V(L2), P/V/I(BJ2), I/V(RJ2), I/V(L3), V(QBOUT)
  jtl: P/V/I(B01), P/V/I(B02), V(stage_OUT) for XJTL1_1..6, V(JTL6_OUT), I(R_TERM)
  optional_unknown: V(IB|XBQ1) if the solver does not emit it
  missing_probe_policy: preserve requested probe and mark UNKNOWN; never fabricate

