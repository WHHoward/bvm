question: >-
  At frozen L1=1.4pH, L2=2.0pH, IBias=260uA, RJ1=32ohm and canonical
  BVM -> COMMON_SL/JSL -> QB -> six-stage JTL protocol, determine from raw
  waveform evidence whether the single new case RJ2=10ohm, mask=0111 has
  three or four complete downstream response candidates.
motivation: >-
  Existing bounded evidence has RJ2=10ohm/mask=0011 with one response and
  RJ2=11/12 weight-3 references with post-READ multi-response activity. This
  one-point diagnostic distinguishes a possible 3-response regime from a
  persistent fourth response without adding a sweep.
interpretation_ceiling: >-
  Raw waveform evidence is the scientific authority for later review. The
  mechanical oracle only organizes navigation and supporting evidence. Phase
  turns, terminal areas, pulse areas, current crossings and response
  candidates are not SFQ counts. No automatic follow-up, mechanism claim,
  scalar-threshold conclusion or perfect-counter claim is authorized.

