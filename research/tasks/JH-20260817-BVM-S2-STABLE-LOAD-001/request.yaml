  - {id: AC2, condition: "Each load/polarity stratum independently applies JM1/JM2 PRE [80,90) p2p <=0.020 rad to both read and control before formal source characterization; non-ready data are not characterized.", evidence: [analysis.json, independent-verifier]}
  - {id: AC3, condition: "Control-corrected terminal descriptors and residual max/RMS/time-normalized-L1 use the frozen source-window formulas and deterministic peak/lobe/FWHM selection; FWHM missing either legal same-trace bracket is NOT_APPLICABLE.", evidence: [analysis.json, independent-verifier, report.md]}
  - {id: AC4, condition: "Endpoint-VI uses frozen signed S2 convention at exact Decimal 97/99/101/103/105 ps tokens: eligibility abs(deltaI)>=0.5uA and abs(deltaV)>=5uV else ILL_CONDITIONED; eligible compatibility emax<=max(5uV,0.01*abs(V50star-V1star)); per-token computation precedes summaries.", evidence: [analysis.json, independent-verifier, report.md]}
  - {id: AC5, condition: "Deterministic report.md and descriptive non-authoritative report.html render required selector/traces/readiness/source/endpoint/disposition content and byte-consistency checks.", evidence: [report.md, report.html, report-consistency.json]}
  - {id: AC6, condition: "Frozen expected matrix, inventory, and declared-entry pre-receipt bundle cover required delivered evidence; each entry has safe path/hash/bytes and final receipt is excluded.", evidence: [expected-matrix.yaml, inventory.yaml, evidence-bundle.yaml]}
  - {id: AC7, condition: "All derived artifacts are attempt-local and append-only; a later attempt never overwrites receipt-bound prior bytes, and no pre-audit status-authority write occurs.", evidence: [receipt, inventory]}
