  cases:
    - init_positive_read
    - init_positive_control
    - init_negative_read
    - init_negative_control
  requested_timesteps_s: [5.0e-14, 2.5e-14, 1.25e-14]
  stop_time_s: 1.7e-10
  repetitions: 1
  output_load: R_LD SL1 0 12

metric_contract:
  spec_path: docs/research/METRIC_SPEC_V2.md
  spec_sha256: f88a36f4d310b2572efdc7408d734640f25dd5aea2246b74fbb8b7bb7f0be470
  status: frozen
  task_local_bands: research/tasks/JH-20260817-BVM-S1-001/design/s1-canonical-source-convergence.md

signals:
  junctions:
    - {id: JM1, column: P(B_JM1|XBVM1), direction: "N1 -> n_jm1o", vts: "+1", rd: "+1"}
    - {id: JM2, column: P(B_JM2|XBVM1), direction: "n_jm2i -> N2", vts: "+1", rd: "+1"}
  downstream_stages: []
  state_signals: []
  source_signals:
    - {column: V(SL1), direction: "SL1 -> 0"}
    - {column: I(L_SL|XBVM1), direction: "N8 -> SL1"}
    - {column: I(I_WL1)}
    - {column: I(I_SE1)}

windows:
  pre: [80, 90)
  activity: [94, 108)
  source: [94, 130)
  post: [140, 150)

procedure:
  ladder_ps: [0.05, 0.025, 0.0125]
  timestamp_rule: exact-decimal string tokens, zero tolerance, no
    interpolation/resampling/time alignment
  readiness: "pre-window JM1/JM2 p2p <= 0.020 rad; pos/neg mean-vector L-inf
              separation >= 0.100 rad (comparability only)"
  control_hierarchy: "rctrl <= 0.01 PASS; 0.01-0.05 NOT_MET_NA; >= 0.05
                      NOT_MET_APPLICABLE; Afloor 5 uV / 0.5 uA"
  bands: "peak/pointwise <= max(Afloor, 1%*Aref); RMS <= max(0.2%*Aref,
          0.2*Afloor); latency/applicable-FWHM diff <= 0.25 ps; control max
          <= 1% of paired-read scale; control RMS/L1 <= 0.2%"
  stop_rule: no fourth timestep; no window/band/stimulus change after results

result:
  artifact_valid: true
  numerical_verdict: INCONCLUSIVE
  verdict_reason: >-
    Coarse pair 0.05->0.025 fails pointwise+RMS amplitude/shape bands on all
    four read observables (0.05 ps under-resolves the read excursion); fine
    pair 0.025->0.0125 passes pointwise but fails RMS narrowly on the
    positive read (2.00 vs 1.81 uV; 0.17 vs 0.15 uA).  Readiness, controls,
    latency, FWHM, and exact-decimal timestamp matching all pass.
  analysis_path: analysis.json
