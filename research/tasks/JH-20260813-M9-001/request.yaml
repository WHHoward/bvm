task:
  kind: DOCUMENTATION
  objective: >-
    Freeze the canonical docs/research/METRIC_SPEC_V2.md measurement contract
    from accepted M4–M8 calibration evidence, plus deterministic checks that
    prevent scope/semantic regression.  The specification defines how to
    measure and report; it does not define interface or candidate success.
  research_question: >-
    Can the repository state one reproducible, evidence-bounded measurement
    semantic for phase, controls, activity, same-JJ voltage area, tolerance,
    convergence, and output reporting without turning calibration facts into a
    BQ/DCSFQ/BVM or INTERFACE_GATE success criterion?
  non_goals:
    - No INTERFACE_GATE_V1, candidate success threshold, BQ/DCSFQ/BVM tuning, route decision, or paper claim.
    - No JoSIM execution, netlist/raw-data edit, baseline regeneration (M10), or new baseline/Gate conclusion (M11).
    - Do not alter scripts/sfq_metrics_v2.py or reinterpret accepted M4–M8 evidence beyond its stated claim ceiling.
  claim_ceiling: measurement_semantics_and_reporting_contract_only_no_physical_gate
