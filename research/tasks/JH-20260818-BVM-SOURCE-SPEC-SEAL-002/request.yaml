acceptance:
  - {id: AC1, condition: "The normative source for descriptor and window semantics is exactly the ACCEPTED STABLE-LOAD-001 preregistration/hash; all successor copies are validated copies and do not create a second norm.", evidence: [source-spec, waveform-family, verification]}
  - {id: AC2, condition: "All 16 raw CSVs preserve original time, V(SL1), and I(L_SL|XBVM1) literal tokens, complete columns/order, file SHA-256, byte size, sample count, and raw-to-sealed token mapping; each read/control pair independently binds both token sequences and verifies alignment before correction.", evidence: [waveform-family, verification]}
  - {id: AC3, condition: "The frozen Decimal contract records and uses the complete constructed Context, traps, and flags; descriptor calculation strictly reuses accepted earliest-tie, primary-activity, legal-FWHM, and opposite-lobe semantics without interpolation or fitting.", evidence: [source-spec, waveform-family, verification]}
  - {id: AC4, condition: "The package preserves all-READY prerequisite status and per-polarity endpoint-VI NOT_SUPPORTED_AT_REGISTERED_TOKENS, with both polarity families and matched read/control correction, without upgrading the claim ceiling.", evidence: [source-spec, verification]}
  - {id: AC5, condition: "Terminal orientation, L_SL current reference direction, and all 16 source-netlist SHA-256 values are explicitly sealed and independently checked.", evidence: [terminal-orientation, source-spec, verification]}
  - {id: AC6, condition: "Producer payload, bundle, and inventory are minimal and explicit: bundle and inventory required sets are exactly equal and contain only the three payload artifacts; builder, receipt, and independent verification package remain outside that producer bundle.", evidence: [inventory, evidence-bundle, receipt, verification]}
  - {id: AC7, condition: "The provenance chain is a direct fast-forward chain B0 -> I -> C_art -> C_receipt -> C_verify -> C_audit with one parent at every step and no unrelated commit inserted; verifier runs at HEAD=C_receipt, C_verify.parent=C_receipt is checked by final audit, and final audit runs at HEAD=C_verify.", evidence: [ack, receipt, verification, final-audit]}
  - {id: AC8, condition: "Independent verification re-reads raw evidence and recomputes the sealed representation without importing builder calculations or trusting producer PASS; verification.yaml is timestamped and binds observed HEAD, C_art, C_receipt, verifier SHA, package hashes, and exact checked scope. It does not claim to inspect future C_verify.", evidence: [verification]}
  - {id: AC9, condition: "ACK, receipt, verification.yaml, and final audit verdict use live on-site timestamps recorded at artifact creation; verify.log may record runtime but its filesystem creation time is not an acceptance event.", evidence: [ack, receipt, verification, final-audit]}
  - {id: AC10, condition: "If final audit ACCEPTED, establish BVM_SOURCE_SPEC_V1 as authoritative and stop this task only; this after-acceptance stop does not prohibit a separately authorized future receiver task.", evidence: [final-audit]}
