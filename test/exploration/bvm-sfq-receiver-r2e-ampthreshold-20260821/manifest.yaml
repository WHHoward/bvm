  PULSE_ACTIVITY: [94.0, 130.0]
  OUTPUT_ANALYSIS: [94.0, 170.0]
  POST: [130.0, 170.0]
  STORAGE_POST: [140.0, 150.0]
event_criterion:
  definition: >-
    Continuous monotonic segment of adjacent-sample-unwrapped P(B_OUT|XTRIG)
    with abs(delta(phi))/(2*pi) >= 1.0 turn, segment start no later than 130 ps,
    same-segment direct V(B_OUT|XTRIG) trapezoid integral / Phi0 within 0.05
    turn of phase delta.  I_peak > Ic and voltage spikes are never sufficient.
interpretation_plan:
  situation_A_clean: THRESHOLD_FOUND; record bounded threshold under current
    shape/topology/bias; not exactly-one SFQ delivery; no JTL/T1 claim.
  situation_B_unstable: ACTIVATION_WITH_UNSTABLE_RUNNING; do not tune it away.
  situation_C_none: NO_THRESHOLD_IN_BOUNDED_MATRIX; stop; no auto extension.
derived_quantities_on_threshold:
  - threshold amplitude
  - peak junction current at threshold
  - pulse charge Q = integral of I_DIRECT dt (uA*ps = 1e-3 fC)
  - bounded comparison to real transformer chain (+1.46 uA junction spike,
    ~0.026 turn response from R2-B)
