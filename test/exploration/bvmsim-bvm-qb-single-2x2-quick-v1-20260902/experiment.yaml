    - P(B_JM1|XBVM1)
    - V(B_JM1|XBVM1)
    - I(B_JM1|XBVM1)
    - P(B_LD4_01)
    - V(B_LD4_01)
    - I(B_LD4_01)
    - P(B_LD4_11)
    - V(B_LD4_11)
