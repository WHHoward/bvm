  no_event_alignment: true
  no_parameter_sweep: true
  exactly_two_physical_runs: true

stimulus:
  amplitude_uA: 100.0
  rise_time_ps: 1.0
  fall_time_ps: 1.0
  plateau_ps: 9.0
  timing_ps:
    initial_settle: [0, 50]
    write0: [50, 61]
    post_write0_settle: [61, 70]
    zero_state_read_control: [70, 81]
    post_zero_read_settle: [81, 90]
    write1: [90, 101]
    pre_final_read: [101, 110]
    selective_one_state_read: [110, 121]
    tail: [121, 200]
  windows_half_open_ps:
    INITIAL_PRE_WRITE0: [0, 50]
    WRITE0: [50, 61]
    PRE_ZERO_READ: [61, 70]
    ZERO_STATE_READ_CONTROL: [70, 81]
    POST_ZERO_READ: [81, 90]
    WRITE1: [90, 101]
    PRE_FINAL_READ: [101, 110]
    FINAL_READ: [110, 121]
    TAIL: [121, 200]
  single:
    target_history: WRITE0 -> ZERO_STATE_READ_CONTROL -> WRITE1 -> FINAL_READ
    final_read: 'WL=+100uA, BL=0, SE=+100uA'
  array:
    target_history: all four synchronize WRITE0 -> ZERO_STATE_READ_CONTROL -> WRITE1; final read selective
    stored_protocol: '1111'
    final_read_mask: '1000'
    target_read: 'BVM1: WL1=+100uA, BL1=0, SE1=+100uA'
    quiet_cells: 'BVM2/BVM3/BVM4: WL=BL=SE=0'

probe_schema:
  bvm_each: P/V/I for JM1, JM2, JS1, JS2; I/V for LM1, LM2, LM3, LPM, RJM1, LS1, LS2, RS, LS3, RSE, LPSE, LPSL, RSL, LSL
  source_currents: I(WL), I(BL), I(SE)
  boundary: SINGLE V(SL); ARRAY V(COMMON_SL)
  jsl: P/V/I for JSL1 through JSL8
  qb: V(QBIN), V(QBOUT); I/V for LIN, L1, L2, L3, RJ1, RJ2, IB; P/V/I for BJS, BJ1, BJ2
  jtl: P/V/I for B01 and B02 at all six stages; output node V for all stages; I(R_TERM)
  phase_rule: P output is raw radians; comparisons use continuous_unwrap(rad); display uses rad/(2*pi) turns
  event_rule: phase displacement, voltage area, I>Ic and crossings are activity diagnostics, not SFQ counts

analysis:
  comparison_convention: ARRAY_TARGET_MINUS_SINGLE
  time_grid_gate: exact stored timestamps, same length and token values; otherwise EXACT_GRID_FAIL
  control_gate: raw I(I_WL1), I(I_BL1), I(I_SE1) pointwise exact zero difference
  registered_metrics:
    waveform: [max_abs_delta, RMS_delta, p95_abs_delta, mean_delta, p2p, signed_integral_delta, endpoint_delta]
    jj: [continuous_phase_delta, phase_p2p, voltage_area, phase_area_residual]
  phase_area_note: same JJ, same orientation, same window; descriptive consistency only
  pre_final_state_signals: [JM1, JM2, LM1, LM2, LM3, LPM]
  pre_final_quiet_state_signals: [JM1, JM2, LM1, LM2, LM3, LPM]

visualization:
  renderer: scripts/josim-plot2.py
  options: 'sep_comb dark -j 2pi'
  phase_display: continuous_unwrap(raw radians)/(2*pi), label phase turns
  forbidden_label: SFQ count
  raw_immutable: true
  main_jtl_focus: [JTL1, JTL6, R_TERM]
  main_jsl_focus: [JSL1, JSL8]

stop:
  after: preregistration -> preflight -> exactly two runs -> raw QA -> control/grid QA -> metrics -> standalone and RAW+DELTA plots -> visualization QA -> RESULT_BRIEF
  automatic_followup: false
  user_review_required: true
