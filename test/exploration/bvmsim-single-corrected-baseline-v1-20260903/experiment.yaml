schema_version: compact-quick-v2-corrected-single-baseline
id: BVMSIM_SINGLE_CORRECTED_ORIGINAL_QB_BASELINE_V1
mode: QUICK
study_phase: CALIBRATION
status: PREREGISTERED
date_directory: bvmsim-single-corrected-baseline-v1-20260903
base_head: 62cc2130bf0a0157ffe6f2d5a8de7ebf075d0c00

question:
  - Does one historical BVMSim BVM produce a usable sensing response under the correct WL+SE READ protocol?
  - Do logical S0 and S1 remain distinguishable when the same READ is applied?
  - Does original BVMSim QB behave consistently with a direct 10-ohm load and a six-stage historical JTL load?

scope:
  included: [S0-R-CORRECTED, S1-R-CORRECTED, S0-J-CORRECTED, S1-J-CORRECTED]
  excluded: [four_bvm_16_state, state_position_closure, IB_margin, RJ1_margin, input_alpha_margin, canonical_bvm, timestep_sweep, T1, QB_parameter_change]

source_class: HISTORICAL_BVMSIM
authority_boundary: "BVMSim/bvm_cell.cir is historical source evidence, not canonical BVM authority"

frozen:
  bvm: BVMSim/bvm_cell.cir
  qb: BVMSim/BQ.cir
  qb_nominal: "RJ1=12 ohm, RJ2=4 ohm, internal IB=250 uA"
  jj_model: circuits/models/jjmit.cir
  jtl: BVMSim/library_josim/jtl2.cir
  bvm_instances: 1
  terminal_sensing_line: "B_LD4_01..B_LD4_11 plus BVMout, all area=3.2; 12 JJ total"
  jtl_stages: 6
  jtl_bias: "280 uA per historical JTL cell"
  termination: 10 ohm
  timestep: 0.1 ps
  stop_time: 200 ps
  write_window: "[50,62) ps; WL and BL have equal polarity and amplitude"
  read_window: "[70,82) ps; WL=+100 uA, SE=+100 uA, BL=0"
  solver: build/josim-cli

changed:
  - "task-local single-BVM fixture uses corrected WL+SE READ rather than historical invalid SE-only READ"
  - "task-local deck provides top-level jjmit closure so BVM and terminal JJ do not use default fallback"
  - "downstream load is direct 10 ohm for R or six historical JTL cells plus 10 ohm for J"

