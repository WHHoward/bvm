research_question: >-
  Can a series pickup and isolated passive secondary extract a clear,
  state-dependent transient from the canonical SL -> B_TRIG trigger path
  without destroying the R0b logical1 complete trigger and read0/control
  discrimination?
hypothesis: >-
  Inserting only L_TX=0.20 pH in series between R_IN and B_TRIG will add a
  sub-ohm impedance near the AREA=0.50 JJ characteristic frequency while
  preserving the R0b multi-turn trigger.  A k=0.80 coupling to L_SEC=2 pH
  and a defined 12 ohm passive secondary load will convert the state-dependent
  trigger current transient into measurable secondary voltage and load current
  without a parallel N_TRIG loading branch.
alternative_explanations:
  - The secondary reflected impedance may still perturb the series trigger enough to remove the complete read1 transition.
  - The coupling polarity or secondary load may produce cancellation or a signal below the probe floor.
  - A secondary transient may be a startup/common-mode artifact rather than a read1 state-dependent response.
  - The read0 transient may be large enough to erase secondary discrimination even when B_TRIG itself remains non-triggering.
  - Secondary voltage and current may have a sign/endpoint mapping error if the floating/grounded secondary is misinterpreted.
  - BVM SL/N6 or JM1/JM2 storage behavior may change even if B_TRIG remains complete.
route:
  primary: canonical BVM SL output
  input_resistance_ohm: 12.0
  receiver_topology: >-
    SL -> R_IN -> L_TX -> B_TRIG -> ground, with L_TX magnetically coupled
    to a grounded passive L_SEC || R_SEC_LOAD secondary.
  secondary_route: L_SEC=2.0 pH to ground in parallel with R_SEC_LOAD=12.0 ohm
  excluded_this_round: [N_TRIG_parallel_feedback, output_JJ, self_quench, JTL, T1, R1b]
  canonical_topology_modified: false
  bq_references_only: true
