research_question: >-
  Can the accepted R1a passive secondary drive a minimum biased output JJ so
  logical1 has at least one complete 2*pi B_OUT transition while logical0 and
  both READ=0 controls have none, with the R1a B_TRIG criterion preserved?
hypothesis: >-
  At AREA=0.10, B_OUT Ic is 10 uA.  A 7 uA subcritical bias leaves a nominal
  read0 margin of 1.86 uA below Ic when the R1a 1.14 uA secondary current is
  added, while the nominal read1 drive is 12.56 uA and exceeds Ic by 2.56 uA.
  A 100 ohm parallel damping resistor lowers the output dynamic beta estimate
  from the intrinsic 5.445 to about 0.805 and should reduce uncontrolled
  running without adding a self-quench loop.
diagnostic_initial_point:
  point: l010-b07-rd100
  status: completed_initial_common_mode_failure
  finding: >-
    The first point produced a valid four-case run but no B_OUT differential
    drive: P(B_OUT) stayed at 0.7753975 rad, V(B_OUT) was about 6.71e-19 V,
    I(B_OUT) stayed at the 7 uA bias, and V(N_OUT) followed V(N_SEC).
  failure_mode: common_mode_no_differential_drive
  raw_preserved:
    - raw/l010-b07-rd100/read1/run-01.csv
    - raw/l010-b07-rd100/read0/run-01.csv
    - raw/l010-b07-rd100/logical1-read0-control/run-01.csv
    - raw/l010-b07-rd100/logical0-read0-control/run-01.csv
  analysis: analysis/initial-point-analysis.json
alternative_explanations:
  - The output branch may load N_SEC enough that the nominal 5.56/1.14 uA
    separation is not preserved.
  - The output bias or damping may suppress the read1 transition before 2*pi.
  - The read0 transient may combine with the 7 uA bias and cross the 10 uA
    threshold after loading.
  - The positive mutual-coupling polarity or B_OUT terminal direction may
    oppose the output bias rather than assist it.
  - B_OUT may free-run at a subcritical bias because the effective damping
    estimate is not sufficient for the transient circuit.
  - A local B_OUT phase transition may be numerically real but not downstream
    SFQ delivery.
