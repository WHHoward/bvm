acceptance:
  - {id: AC1, condition: "No JoSIM command is run and no S1-002/run-root file is changed; every change is under this successor attempts path.", evidence: [receipt.yaml, command-log]}
  - {id: AC2, condition: "Evidence seal lists every final referenced S1-002 input/raw CSV/stdout/stderr/log, manifest, closure hash, A01 report/receipt/review, A02 corrected generator/verifier/json/markdown/review with original repo path, SHA-256, artifact class, and lineage role; seal_check rehashes every listed file from zero.", evidence: [evidence-seal.yaml, seal-check.log]}
  - {id: AC3, condition: "Seal explicitly distinguishes A01 raw/execution artifacts as immutable experimental facts; A01 receipt as a historical record not final authority for A02 provenance because it was post-delivery modified; and A02 as a corrected/recomputed analysis of existing immutable raw, never a new simulation execution.", evidence: [evidence-seal.yaml]}
  - {id: AC4, condition: "Seal explicitly maps reporting/provenance authority: A01 analysis/report remains historical; A02 corrected analysis supersedes it only for corrected reporting/measurement authority; raw, inputs, stdout/stderr, manifest and closure hash remain A01 experimental authority. No historical artifact is deleted or relabeled as absent.", evidence: [evidence-seal.yaml, seal-check.log]}
  - {id: AC5, condition: "Receipt has its own A01 timestamp, commands and logs; it hashes/maps D1-D3 and AC1-AC4. verify-task succeeds without modifying S1-002 protocol documents.", evidence: [receipt.yaml, verify-task-log]}
invalid_conditions:
