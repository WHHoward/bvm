question:
  - Does RJ1=12/11.5/11 ohm give a timestep-robust four-BVM collective response?
  - Does lowering RJ1 remove or reduce the late BJ2 excursion without changing the mechanism by assumption?
  - Does each RJ1 variant preserve the existing single-BVM S1 approximately-one-Phi0 QB-to-JTL response and S0 selectivity?
  - Is any apparent four-to-five-turn change a timestep-induced branch change, or merely a net trajectory difference without separated event support?

