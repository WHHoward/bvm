    - inputs/bvm_cell.cir

simulation:
  input_kind: single_pwl
  cases:
    - init_positive
    - init_negative
    - no_init_control
  requested_timesteps_s: [1e-13]
  stop_time_s: 8.0e-11
  repetitions: 1
  output_load: "R_LD SL1 0 12 (12 ohm, only load)"

metric_contract:
  spec_path: docs/research/METRIC_SPEC_V2.md
  spec_sha256: f88a36f4d310b2572efdc7408d734640f25dd5aea2246b74fbb8b7bb7f0be470
  status: frozen

signals:
  junctions:
    - {name: JM1, probe: "P(B_JM1|XBVM1)", voltage: "V(B_JM1|XBVM1)",
       orientation: "N1 -> n_jm1o", window: "init_activity [9,31) ps"}
    - {name: JM2, probe: "P(B_JM2|XBVM1)", voltage: "V(B_JM2|XBVM1)",
       orientation: "n_jm2i -> N2", window: "init_activity [9,31) ps"}
  downstream_stages: []
  state_signals:
    - {name: SL1, voltage: "V(SL1)", orientation: "SL1 -> 0"}
    - {name: L_SL, current: "I(L_SL|XBVM1)", orientation: "N8 -> SL"}

windows:
  pre: [4e-12, 9e-12)
  activity: [9e-12, 31e-12)
  post: [31e-12, 80e-12)
  read_state: null  # D0 has no read stimulus

controls:
  zero_input: no_init_control
  read0: null
  positive: init_positive
  reverse_polarity: init_negative

artifacts:
