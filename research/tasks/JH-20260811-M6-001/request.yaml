  objective: "建立 M6 同一 JJ 相位—电压面积交叉校验：扩展 v2 计量实现，生成带直接 JJ V/P 探针的匹配 DCSFQ 0/300 uA 原始运行，并以实际 CSV 时间轴梯形积分报告逐结残差。"
  research_question: "在同一运行、同一结、同一方向和同一端点窗口中，测得的 delta_phi/(2*pi) 与 integral(V_JJ dt)/Phi0 能否被可复核的测量管线一致地报告？"
  non_goals:
    - "不修改、重跑、覆盖或删除任何历史 test/final CSV、网表或旧 JSON。"
    - "不把局部 JJ 相位绕转、面积积分或活动簇称为下游 SFQ 接收、闭环 fluxoid 或系统 Gate。"
    - "不冻结 METRIC_SPEC_V2、物理容差、窗口、阈值或论文主张；M9 才能作最终冻结。"
    - "不执行 M7 回归全套、M8 时间步收敛、M10 JSON 重生或路线比较。"
    - "不修改 scripts/sfq_metrics.py、docs/HANDOVER.md、memory/project-todo.md、schema、M4/M5 证据或历史 raw。"
  claim_ceiling: "same_junction_measurement_pipeline_only_no_physical_gate"
