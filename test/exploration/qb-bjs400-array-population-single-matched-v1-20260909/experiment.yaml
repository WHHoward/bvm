question: >-
  Record evidence for BJS area=4 (Ic=400uA) under four registered functional
  QB working points, four authorized ARRAY final-read masks, and matched
  SINGLE-BVM controls. This experiment does not rank conditions or interpret
  physical mechanisms.
interpretation_ceiling: >-
  Evidence-only observations for the fixed 20260909 ARRAY->QB->6JTL fixture,
  exact history, exact solver and exact stored grid. No mechanism, SFQ count,
  success claim, equivalence claim, convergence claim, hardware claim or
  follow-up design is authorized.

changed:
  - BJS area changes from 3 to 4 in the experiment-local BQ copy for every new run
  - registered working points are L1P12, L1P14, IB260 and IB270
  - ARRAY final-read mask is one of exactly 0000, 1000, 0001, 0011
  - SINGLE topology is one historical JM2-connected BVM feeding the same 8-JJ JSL, BJS400 QB and 6-stage JTL

frozen:
  physical_authority: test/exploration/qb-l1-ibias-rj1-independent-characterization-v1-20260909
  bvm_variant: historical JM2-connected BVM; canonical BVM is not used
  bvm_history: WRITE0 -> ZERO_STATE_READ_CONTROL -> WRITE1 -> SETTLE -> mask-selective FINAL READ -> TAIL
  controls: WL/BL/SE amplitude 100uA; 1ps rise/fall; 9ps plateau
  timing: .tran 0.1p 200p; stored rows from 0 to 199.9ps
  pre_read: all ARRAY masks are identical through 110ps; mask changes only 110-121ps
  jsl: eight jjmit area=5.0 elements from COMMON_SL to QBIN
  qb: Lin=1.5pH; BJS area=4; BJ1 area=0.9; L1 registered; L2=2pH; BJ2 area=2; RJ2=4ohm; L3=1.3pH
  jtl: six jtl2 stages; bias and termination frozen
  termination: R_TERM JTL6_OUT 0 10ohm
  model: local jjmit, BVM, BQ and jtl2 closure recorded by SOURCE_MANIFEST
  solver: build/josim-cli with recorded version and binary hash
  probes: full requested ARRAY/SINGLE probe schema; emitted-but-missing values remain UNKNOWN
  raw: immutable solver output; no standalone derived CSV

