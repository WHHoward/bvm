event_criterion:
  definition: >-
    A local complete event requires a continuous monotonic segment of the
    adjacent-sample-unwrapped P(B_OUT|XTRIG) with abs(delta(phi))/(2*pi) >= 1.0
    turn, segment start no later than 130 ps, and same-segment direct
    V(B_OUT|XTRIG) trapezoid integral / Phi0 within 0.05 turn of the phase
    delta.  I_peak > Ic, voltage peaks, ringing, or whole-window phase range are
    activity diagnostics only and never event oracles.
  read0_and_controls: must not contain qualifying complete segments for a clean
    activation claim.
guards:
  secondary_separation: read1/read0 secondary amplitude ratio expected to remain
    near the R2-A value (~5.7) up to bounded loading changes from R_OUT_DAMP.
  storage_signs: JM1/JM2 post medians must keep logical-state signs
    (read1 positive, read0 negative) in every run.
  trigger_guard: B_TRIG read1 complete-trigger behavior must be preserved
    (R0b criterion); bounded back-action changes are recorded, not treated as failure by themselves.
interpretation_plan:
  situation_A_damping_dominant: >-
    read1 largest monotonic B_OUT segment grows strongly with R_OUT_DAMP
    (0.026 -> >=0.1 -> ~0.3 -> approaching/reaching 1 turn) while read0 and
    controls stay sub-turn.  Strongly supports H2 as the dominant bottleneck.
    If a first qualifying read1-complete / read0-incomplete / control-incomplete
    point appears, record it and stop sweeping.
  situation_B_not_damping: >-
    Secondary signals remain state-separated but read1 B_OUT stays near
    0.02-0.03 turn across all damping points.  Stop damping sweeps immediately;
    do not auto-continue into AREA/bias/C/K sweeps.  Re-examine the
    secondary-to-B_OUT injection mechanism and receiver topology instead.
  situation_C_overweak: >-
    Multi-turn, free-running, strong ringing, or read0/control switching
    appears at larger R_OUT_DAMP.  Record as evidence that activation and
    self-quenching/retrap define an operating window; do not label success.
