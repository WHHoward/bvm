research_question: >-
  Can the same minimum biased-JJ SL receiver produce at least one complete
  2*pi phase transition for canonical logical1 +READ while logical0 +READ and
  both matched READ=0 controls produce no complete transition?
hypothesis: >-
  Raising only the existing SL receiver bias from 10 uA to 15 uA and then
  20 uA may turn the finite logical1 excursion into a complete monotonic phase
  segment without making logical0 or READ=0 free-run.
alternative_explanations:
  - A higher bias may trigger logical0 as well and remove discrimination.
  - AREA scaling changes Ic, C, RN, and R0 together; an Ic-only explanation may be wrong.
  - A delayed multi-lobe response may remain below 2*pi even when the current exceeds Ic.
  - A complete segment after the read window may be bias-driven free running rather than read-triggered.
  - The phase and voltage columns may disagree if endpoints, direction, or time units are mismatched.
route:
  primary: canonical BVM SL output
  secondary: N6 local tap not run unless the SL sequence has no usable closure point
  input_resistance_ohm: 12.0
  receiver_topology: SL -> R_IN -> one B_TRIG JJ to ground with independent positive bias
  excluded_this_round: [self_quench_loop, output_junction, JTL]
canonical_boundary: >-
  canonical BVM topology and parameters are immutable; each case includes a
  fixture copy whose SHA-256 is checked against circuits/bvm/bvm_cell.cir.
