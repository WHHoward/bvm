task:
  kind: DOCUMENTATION
  objective: "Freeze one canonical, structured M11B/W5B object matrix for the current evidence and provenance state of BVM storage/source-output, QB/BQ, DCSFQ, DCSFQ_BVM, and canonical JTL without raising scientific status or running circuits."
  research_question: "Can the current evidence, observables, provenance, reproduction/characterization state, UNKNOWNs, and next discriminator for the exact seven-object set be completely and honestly frozen as one provenance registry?"
  non_goals: ["No JoSIM run, netlist/model/test/raw edit, circuit tuning, source/receiver characterization run, candidate route decision, INTERFACE_GATE_V1, T1, W5A literature-boundary claim, W5C author contact, physical verdict, or paper novelty claim.", "No automatic upgrade of reproduction/characterization status; new circuit runs are only recorded as future discriminators.", "No parallel second provenance register: the delivered matrix is the sole M11B/W5B fact layer, while the legacy index may only become a pointer after audit acceptance."]
  claim_ceiling: reconstruction_provenance_and_current_characterization_knowledge_state_freeze_only_not_physical_completeness_published_reproduction_candidate_validation_or_literature_boundary
