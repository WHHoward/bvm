  - "Execution needs any write outside the two write paths, network, installation, worktree creation, commit, deletion, overwrite, rename, a fourth refinement, changed window/band/input, M9 work, or candidate tuning."
  - "A run directory/run ID already exists, a required QA condition fails, or final verify-task cannot succeed: preserve evidence and deliver BLOCKED/DEVIATED/INVALID as applicable."
