  source_package_bytes: 7425003
  role: exact RJ2=10ohm reusable pair, fixed high-side ARRAY history, probes, solver and grid
  reuse_rule: exact immutable reuse only after source/archive/hash/deck/protocol verification

changed:
  - "RJ2: expose the existing QB RJ2 element through the audited parameterized include and use 12/14/16ohm"
  - "execution: split new values into sequential two-mask stages with a mechanical CONTINUE gate"
  - no other circuit, stimulus, topology, solver, timestep, load, bias or mask change

frozen:
  L1: 1.4pH
  L2: 2.0pH
  IBias: 260uA
  RJ1: 32ohm
  BJS: area=4; Ic=400uA
  BJ1: current canonical value
  BJ2: area=2
  L3: 1.3pH
  terminal_load: current canonical 10ohm terminal
  topology: four BVMs -> COMMON_SL -> eight-JJ JSL -> QB -> six-stage JTL -> terminal
  history: WRITE0 -> ZERO_STATE_READ_CONTROL -> WRITE1 -> SETTLE -> mask-selective FINAL READ -> TAIL
  controls: WL/BL/SE amplitude 100uA; 1ps rise/fall; 9ps plateau
  timing: .tran 0.1p 200p; stored 0 to 199.9ps at nominal 0.1ps spacing
  solver: build/josim-cli; identity and hash in SOURCE_MANIFEST.json
  raw: immutable solver output; no interpolation, resampling, smoothing, scaling, time shifting or sign correction

rj2_matrix:
  values_ohm: [10, 12, 14, 16]
  new_values_ohm: [12, 14, 16]
  masks: ["0001", "0011"]
  logical_case_count: 8
  historical_reuse_count: 2
  new_physical_solve_max: 6
  execution_stages:
    - stage: 1
      rj2_ohm: 12
      pair: [ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P12_0001, ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P12_0011]
    - stage: 2
      rj2_ohm: 14
      pair: [ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P14_0001, ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P14_0011]
    - stage: 3
      rj2_ohm: 16
      pair: [ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P16_0001, ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P16_0011]
  stop_rule: STOP on control/first-response failure, or on a second multi-evidence candidate only when control and first response are clean; otherwise CONTINUE
  no_automatic_sweep: true
  unauthorized_extra_solves: 0

registered_runs:
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P12_0001
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P12_0011
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P14_0001
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P14_0011
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P16_0001
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P16_0011
authorized_runs:
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P12_0001
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P12_0011
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P14_0001
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P14_0011
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P16_0001
  - runs/ARRAY_L1P14_L2P20_IB260_RJ32_RJ2P16_0011

mask_semantics:
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  "0001": BVM4 active during FINAL READ only
  "0011": BVM3 and BVM4 active simultaneously during FINAL READ only

windows:
  control_origin_ps: [70.0, 110.0]
  control_baseline_ps: [61.0, 70.0]
  final_origin_ps: [110.0, 200.0]
  final_baseline_ps: [101.0, 110.0]
  post_first_bj2_anchor: first FINAL-origin BJ2 +0.9 diagnostic turn
  semantics: half-open windows over actual stored timestamps; dynamic endpoints are stored navigation markers

mechanical_metrics:
  phase: raw P radians; independently unwrapped then divided by 2*pi for diagnostic turns only
  thresholds: +0.5, +0.9 and +1.5 relative turns; thresholds are navigation diagnostics only
  l1_recrossing: only an actual stored negative-to-positive adjacent sample transition is OBSERVED_L1_RECROSSING
  positive_excursions: first positive L1 segment and strongest later positive L1 segment after the BJ2 navigation anchor
  response_candidate: BJ1 -> BJ2 -> QBOUT -> ordered JTL1..JTL6 -> terminal, mechanical multi-evidence candidate only
  integration: trapezoid using actual stored time values; no interpolation or resampling

guardrails:
  zero_state_read_control: every executed RJ2/mask case separately inspects BJ1, BJ2, QBOUT, ordered JTL1..JTL6 and terminal
  first_response_0001: retain separately; failure stops before the next RJ2 pair
  first_response_0011: retain separately; failure stops before the next RJ2 pair
  second_response: evaluate only after control and first response are clean
  decision_artifact: qa/stages/stageN_decision.json
  no_event_or_sfq_counter: true
  outcome_labels: [OBSERVED, DERIVED, BOUNDED_RESULT, UNKNOWN]

