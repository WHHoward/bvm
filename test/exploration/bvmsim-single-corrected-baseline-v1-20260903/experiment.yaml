    historical_invalid_raw: test/exploration/bvmsim-bvm-qb-jtl-operational-baseline-v1-20260903/runs/single/S1-R/raw/run-01.csv
  - id: S0-J-CORRECTED
    logical_state: 0
    load: six_stage_jtl_plus_10ohm
    input_deck: inputs/S0-J-CORRECTED.cir
    run_dir: runs/S0-J-CORRECTED
    historical_invalid_raw: test/exploration/bvmsim-bvm-qb-jtl-operational-baseline-v1-20260903/runs/single/S0-J/raw/run-01.csv
  - id: S1-J-CORRECTED
