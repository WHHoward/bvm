created_at: 2026-08-23
mode: exploratory
research_question: >-
  Can an R0b active detector and R1a isolated pickup drive a frozen DCSFQ_BVM
  input into one selective bounded B3 local event?
hypotheses:
  primary: >-
    B_DET plus isolated secondary preserves selectivity and supplies sufficient
    transient drive for the frozen DCSFQ_BVM regenerator.
  alternatives:
    - >-
      The detector remains state-selective but the secondary-to-DCSFQ current
      scale is too small.
    - >-
      R_SEC_LOAD plus DCSFQ input causes reflected loading before regeneration.
predeclared_outcomes:
  pass: >-
    Four matched runs show one phase/area-consistent B3 event for read1, zero
    for read0/controls, bounded post state, and source guards preserved.
  fail: >-
    A valid run shows no B3 event, multipulse, nonselectivity, or back-action.
  inconclusive: >-
    Precheck or event phase/area/endpoint evidence cannot close the declared
    measurement.
  invalid: >-
    Missing or corrupt raw artifact, solver failure, invalid time axis, or
    missing required probes.
