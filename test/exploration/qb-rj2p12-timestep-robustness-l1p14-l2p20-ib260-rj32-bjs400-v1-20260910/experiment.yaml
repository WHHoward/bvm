question: >-
  At the candidate RJ2=12ohm working point, does the repaired second-response
  oracle preserve the qualitative control-clean, 0001-one-response and
  0011-two-response classification when the canonical 0.1ps timestep is
  locally spot-checked at 0.05ps and 0.025ps?
motivation: >-
  This is a bounded numerical robustness check for one already registered
  candidate point.  It does not redefine the project timestep, select an
  optimum, or authorize a new parameter search.
interpretation_ceiling: >-
  A stable result is TIMESTEP_ROBUST_CANDIDATE_WITHIN_TESTED_DT only.  It is not
  full convergence, mathematical convergence, hardware validation, or final
  SFQ proof.  Preserve OBSERVED, DERIVED, BOUNDED_RESULT and UNKNOWN.

