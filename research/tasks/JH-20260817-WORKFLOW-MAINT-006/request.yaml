acceptance:
  - {id: AC1, condition: "External snapshot mode has no final snapshot SHA in request.yaml. An issuer-created, separately SHA-256-sealed attestation binds S and request/signature/scope hashes; ACK binds both request and attestation hashes and observes S.", evidence: [issuer-snapshot.yaml, issuer-snapshot.sha256, ack.yaml]}
  - {id: AC2, condition: "Verifier reads request.yaml, request.sha256, and baseline/scope-files.sha256 from S and requires byte-identical equality to current sealed files, with no normalization, deletion, or semantic comparison; legacy no-snapshot strict-HEAD behavior remains unchanged.", evidence: [handoff.py, test_handoff.py]}
  - {id: AC3, condition: "Snapshot negative tests reject changed request bytes, tampered attestation/seal, wrong S, and scope-manifest drift.", evidence: [test_handoff.py]}
  - {id: AC4, condition: "Endpoint-VI parses raw and registered timestamps using Decimal or an equivalent exact-decimal representation; per exact token independently computes Rhat(t), Vth(t), e_L(t), then applies frozen max/RMS/count descriptors. No pre-fit token averaging or float equality is used.", evidence: [quantitative_analysis_verifier.py, quantitative-analysis-spec.schema.json, test_quantitative_analysis_verifier.py]}
  - {id: AC5, condition: "An adversarial cancellation fixture where opposite token residuals average away rejects average-before-fit output and accepts the per-token descriptor output; decimal-token mismatch rejects.", evidence: [test_quantitative_analysis_verifier.py]}
  - {id: AC6, condition: "PRE-receipt bundles support multiple files/directories per role. handoff.py independently validates every safe regular-file entry's hash and bytes, duplicate-path policy, recursive-root exact path set, and prohibits final receipt inclusion; direct negative tests cover hash/byte/missing-recursive/duplicate/receipt failures.", evidence: [handoff.py, build_evidence_bundle.py, test_handoff.py, test_evidence_bundle.py]}
  - {id: AC7, condition: "Endpoint-VI signed-slope documentation states V = Vth + Rhat*I and matches the implementation.", evidence: [quantitative_analysis_verifier.py]}
  - {id: AC8, condition: "A true positive synthetic chain completes sealed request -> S -> external attestation -> ACK at S -> multi-file raw/spec -> per-token endpoint-VI -> structured result -> deterministic report -> recursive pre-receipt bundle -> receipt -> verify-task VERIFIED, without JoSIM or frozen-path changes.", evidence: [test_handoff.py, receipt.yaml]}
invalid_conditions:
  - "Any JoSIM or historic/scientific path modification; any v2 change; any non-byte snapshot comparison; float/tolerance/interpolation timestamp matching; final receipt in bundle; missing per-entry bundle verification; or unsealed attestation."
inconclusive_conditions: []
stop_conditions:
