metrics:
  phase: "P raw radians; independent unwrap/(2*pi) navigation only; not SFQ count"
  phase_area: "same JJ/endpoints/direction/window; actual-grid trapezoid/Phi0; not SFQ count"
  N2: "ordered BJ1->BJ2->JTL1..6, first/second timing, L1/L2 re-arm, source recovery"
  N3: "active JS1/JS2 p2p, endpoint/landmarks, phase-area, JSL8 source, QB/JTL chronology"
  branch_constitution: "imposed branch, physical branch, resultant I_TOTAL, Vbridge"
  energy: "P_absorb=Vbridge*I_source; signed and absolute energy in [110,121) and [110,130)"
  effect_fraction: "F_B=(C-P_B)/(C-T), descriptive with no threshold interpretation"
  total_reference: "canonical, previous total EXACT, previous total DELAY0P3, branch EXACT/DELAY"

probes:
  branch_RS: "I(I_RS_REPLAY|XBVMn), I(L_S3|XBVMn), V(L_S3|XBVMn), V(6|XBVMn), V(10|XBVMn)"
  branch_LS3: "I(R_S|XBVMn), V(R_S|XBVMn), I(I_LS3_REPLAY|XBVMn), V(6|XBVMn), V(10|XBVMn)"
  bvm: "all BVM storage/R-loop/output P/V/I and quiet branches XBVM1..4"
  boundary: "V(COMMON_SL), P/V/I(B_JSL1..8), V(QBIN), I(LIN|XBQ1), V(LIN|XBQ1)"
  qb: "P/V/I(BJS/BJ1/BJ2), I/V(L1/L2/L3/RJ1/RJ2), V(QBOUT)"
  downstream: "P/V/I(B01/B02) for every JTL1..6, stage outputs, I(R_TERM)"

prohibited:
  - "0.6 ps or other delay"
  - "transformer, mutual coupling, LC/all-pass network"
  - "sentinel follow-up"
  - "QB parameter sweep"
  - "LS3 parameter sweep"
  - "timestep sweep"
  - "raw mutation or processed raw substitution"

