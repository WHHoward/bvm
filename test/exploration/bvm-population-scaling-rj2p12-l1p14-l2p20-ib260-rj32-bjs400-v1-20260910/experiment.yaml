scientific_analysis_authorization: NOT_GRANTED
scientific_analysis_performed: false

question: >-
  At the frozen RJ2=12ohm candidate working point, test whether selected BVM
  population masks produce increasing complete separated downstream response
  candidates, and whether same-weight masks depend on BVM position.
motivation: >-
  The preceding candidate evidence used only masks 0001 and 0011. This bounded
  selected-mask experiment tests additional positions and populations without
  changing QB parameters or timestep. Hamming weight is a comparison variable,
  never an oracle input or a preset result.
interpretation_ceiling: >-
  Preserve OBSERVED, DERIVED, BOUNDED_RESULT and UNKNOWN. Response candidates,
  phase landmarks, voltage areas and terminal pulses are not SFQ counts. No
  universal all-mask claim, mechanism, optimization or follow-up is authorized.

physical_authority:
  experiment: test/exploration/qb-rj2p12-timestep-robustness-l1p14-l2p20-ib260-rj32-bjs400-v1-20260910
  git_head: ddcdfe0309be4b492698a01e15a9ef7d9bb99f1e
  source_manifest_sha256: e0def923f36c6e8c7b7e60e03f76a1864d7fc304970cd3ebcab4775e5a40d08e
  source_package_sha256: a6e2e0b6d9bfa9dab002aa38979e8b12029ad3c16cb2dc203e5069b9f8e1e287
  source_package_bytes: 16990172
  corrected_oracle_sha256: 4d39bc457e0ea010ac9f312dbc1c40b6e65dea123865608f4ad066a05773e860
  reuse_rule: exact immutable RJ2=12, 0.1ps, mask, history and raw reuse only

changed:
  - "FINAL READ BVM mask: new masks 0110, 1100, 1110, 0111 and 1111"
  - no QB parameter, timestep, topology, load, stimulus timing or amplitude change

frozen:
  L1: 1.4pH
  L2: 2.0pH
  IBias: 260uA
  RJ1: 32ohm
  RJ2: 12ohm
  BJS: area=4; Ic=400uA
  BJ1: unchanged
  BJ2: area=2
  L3: 1.3pH
  terminal_load: unchanged canonical 10ohm terminal
  topology: four BVMs -> COMMON_SL -> eight-JJ JSL -> QB -> six-stage JTL -> terminal
  history: WRITE0 -> ZERO_STATE_READ_CONTROL -> WRITE1 -> SETTLE -> mask-selective FINAL READ -> TAIL
  controls: WL/BL/SE amplitude 100uA; 1ps rise/fall; 9ps plateau
  timing: .tran 0.1p 200p; stored 0 to 199.9ps at nominal 0.1ps spacing
  solver: build/josim-cli; identity and hash in SOURCE_MANIFEST.json
  raw: immutable solver output; no interpolation, resampling, smoothing, scaling, time shifting or sign correction

mask_matrix:
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  selected_masks: ["0001", "0011", "0110", "1100", "1110", "0111", "1111"]
  reused_masks: ["0001", "0011"]
  new_masks: ["0110", "1100", "1110", "0111", "1111"]
  hamming_weight_is_oracle_input: false
  active_bvms:
    "0001": [BVM4]
    "0011": [BVM3, BVM4]
    "0110": [BVM2, BVM3]
    "1100": [BVM1, BVM2]
    "1110": [BVM1, BVM2, BVM3]
    "0111": [BVM2, BVM3, BVM4]
    "1111": [BVM1, BVM2, BVM3, BVM4]
  logical_case_count: 7
  reused_case_count: 2
  new_physical_solve_count: 5
  unauthorized_extra_solves: 0
  no_other_masks: true

oracle:
  code: analysis/population_oracle.py
  supports_response_indices: [0, 1, 2, 3, 4]
  phase_reference: FINAL-origin baseline [101,110)ps
  phase_thresholds_turns: [0.5, 1.5, 2.5, 3.5]
  voltage_cluster_rule: "stored-sample adaptive threshold with valley-gated separation; no forced split"
  progression: "BJ1_k < BJ2_k < JTL1_k < ... < JTL6_k, with QBOUT and terminal support"
  terminal: "pulse-local signed V(JTL6_OUT) area, shared valley boundaries, plus FINAL total area"
  regression: analysis/ORACLE_REGRESSION.md
  no_sfq_count: true

control_guardrail:
  window_ps: [70.0, 110.0]
  baseline_ps: [61.0, 70.0]
  rule: complete control-origin multi-stage progression is CONTROL_GUARDRAIL_FAILURE
  action: record mask failure without changing parameters; continue selected masks unless solver/pathological failure

population_analysis:
  source_window_ps: [110.0, 114.5]
  source_signals: ["I(B_JSL8)", "I(LIN|XBQ1)", "V(QBIN)", "V(COMMON_SL)", "I(L_SL|XBVM1)", "I(L_SL|XBVM2)", "I(L_SL|XBVM3)", "I(L_SL|XBVM4)"]
  classifications: [SELECTED_MASK_POPULATION_SCALING_CANDIDATE, POSITION_DEPENDENCE_OBSERVED_AT_WEIGHT_2, POSITION_DEPENDENCE_OBSERVED_AT_WEIGHT_3, DOWNSTREAM_RESPONSE_SATURATION_OBSERVED, BOUNDED_RESULT]
