criterion:
  phase_source: raw P(B_TRIG|XTRIG) and raw P(B_OUT|XTRIG), radians
  continuity: >-
    Unwrap adjacent raw samples continuously with +/-2*pi correction only;
    retain raw columns unchanged.  A monotonic segment is split only when
    the unwrapped adjacent phase-delta sign changes; its endpoints are shared
    by the segment voltage-area integral.
  complete_local_transition: >-
    A monotonic segment with abs(delta_phase)>=2*pi is one or more complete
    local phase transitions.  The complete-unit count for a segment is
    floor(abs(delta_phase)/(2*pi)); a 5-turn monotonic segment therefore
    cannot be counted as one output event.
  output_one_shot: >-
    In OUTPUT_ANALYSIS exactly one complete transition unit must exist, its
    parent monotonic segment must start in READ_OUTPUT_WINDOW, its same-segment
    voltage area must agree with its phase delta within 0.05 turns, and no
    second complete unit may occur in the remaining segment or post window.
  output_reset: >-
    POST must contain no complete output segment, finite raw P/V/current
    samples, and no sustained/free-running output trajectory; post phase,
    voltage, branch current, and output-port current are reported directly.
  non_event: >-
    read0 and both READ=0 controls must have zero complete output transition
    units over CONTROL_FULL and no observed free-running output trajectory.
  trigger_reporting: >-
    B_TRIG phase segments and same-JJ voltage areas are reported to classify
    trigger-no-fire, trigger-multi-run, weak-feedback, or quench behavior;
    B_TRIG is not required to be exactly one event in R1.
  BVM: >-
    Read1/read0 SL and N6 separation and JM1/JM2 storage signs are reported;
    a bounded back-action observation is not a system Gate.
  forbidden_shortcuts: [I_above_Ic, voltage_peak_alone, phase_range_alone, SFQ_count_from_local_phase]
  SFQ_boundary: >-
    One local output-JJ phase transition is not called downstream SFQ delivery.
  verdict: >-
    PASS only if read1 output_one_shot, read0/control non_event, output_reset,
    and BVM bounded-discrimination conditions all hold.  Otherwise PARTIAL
    or FAIL with the classified failure mode; no Candidate upgrade.
