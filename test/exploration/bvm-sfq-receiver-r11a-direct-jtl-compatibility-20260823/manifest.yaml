experiment_id: R11-A-direct-jtl-compatibility-20260823
title: canonical BVM to repository standard JTL direct compatibility screening
date: 2026-08-23
mode: EXPLORATORY
head: 6c2530555e239552d611bf9519126e5e596b3cd6
working_tree_before_run: clean
coordination: lightweight-exploration
workflow_mailbox: not_used

research_question: >-
  Can the canonical BVM SL logical-1 READ transient, without QB, be accepted
  by the repository standard two-cell JTL and form propagated local JTL events,
  while logical-0 and both READ=0 controls remain zero-event?

topology:
  source: canonical circuits/bvm/bvm_cell.cir
  receiver: circuits/standard/JTL.cir
  cells: 2
  instances:
    - XJTL1 SL1 JTL_MID THmitll_JTL
    - XJTL2 JTL_MID JTL_OUT THmitll_JTL
  output_load: R_TERM JTL_OUT 0 1
  bvm_internal_sl_path_preserved: true
  bvm_internal_sl_path: N6-L_PSL(0.5p)-R_SL(12ohm)-N8-L_SL(0.4p)-SL
  extra_transformer_or_conditioner: false

frozen:
  jtl_parameters: repository standard, unchanged
  jtl_source_positive_control: test/standard/test_jtl.cir stimulus, 1.5mV 11-13ps
  timestep_ps: 0.0125
  stop_time_ps: 170
  cases:
    - read1
    - read0
    - logical1-read0-control
    - logical0-read0-control
  windows_ps:
    positive_control:
      pre: [8, 10]
      activity: [10, 35]
      post: [35, 60]
    bvm:
      pre: [85, 94]
      activity: [94, 130]
      post: [130, 165]
  phase_units: raw P in radians; turns are phase_delta_rad/(2*pi)
  voltage_area: same_junction_same_segment_integral_Vdt_over_Phi0

