acceptance:
  - {id: AC1, condition: "Create exactly one previously absent run root bvm-s0-d0-20260814-01 containing copied BVM/model closure and one instrumented input netlist. It uses XBVM1 WL1 BL1 SE1 SL1 BVM, only R_LD SL1 0 12, direct V/P probes for both JM1/JM2, V(SL1), I(L_SL|XBVM1), and the three immutable PWL cases in the design document. No BQ, DCSFQ, JTL, JJ-stack load, or read/SE pulse is present.", evidence: [manifest.yaml, input-netlist, closure-hashes]}
  - {id: AC2, condition: "Run exactly init_positive, init_negative, and no_init_control at 0.1 ps over 0-80 ps. Each run preserves stdout/stderr, raw CSV, actual time axis, input/model/binary hashes, and a run manifest entry. A pre-existing output directory, nonzero solver exit, missing column, NaN/Inf, non-increasing time, or truncated window is INVALID.", evidence: [raw-csv, stdout-stderr, manifest.yaml]}
  - {id: AC3, condition: "For each case, report source-port I(t)/V(t) descriptively and calculate both direct-JJ P/V phase-area quantities on [9,31) ps with actual-time trapezoidal integration, using JM1 N1->n_jm1o and JM2 n_jm2i->N2 positive orientations. Report residuals without declaring a residual tolerance or an event/fluxoid/downstream conclusion.", evidence: [analysis.md, analysis-json-or-csv]}
  - {id: AC4, condition: "Using only the registered half-open windows, report the JM1/JM2 raw-radian signature means and peak-to-peak ranges for state_early [35,45) ps and state_late [65,75) ps, and evaluate the exact D0 observability guards in the design document. The sole allowed source-evidence quality conclusion is VALID, INCONCLUSIVE, or INVALID; VALID means artifact/procedure completeness, not a logical-state or source-characterization PASS.", evidence: [analysis.md, analysis-json-or-csv]}
  - {id: AC5, condition: "Receipt records every created netlist, closure copy, raw/log/analysis/manifest and command hash, maps AC1-AC4, records no unregistered parameter change or JoSIM run beyond the three cases, and final verify-task succeeds.", evidence: [receipt.yaml, verify-task-log]}
invalid_conditions:
  - "Any source/read SE pulse, load matrix, parameter/timestep sweep, BQ/DCSFQ/JTL attachment, mutable include lookup, raw overwrite/deletion, missing direct probe, solver/CSV failure, or use of non-actual-time integration."
  - "Calling an operational signature a logical state, SFQ event, fluxoid, read result, source characterization, candidate verdict, receiver result, or interface Gate."
  - "Any write outside the two authorized write paths, or any modification to a frozen source, task, authority, or historical artifact."
inconclusive_conditions:
  - "The three artifacts are valid but the two initialized signature vectors fail the registered stability/separation guards, direct P/V output/mapping is unavailable, or a required stable window cannot be observed."
  - "D0 can establish only operationally distinct signatures; published/logical read0/read1 semantic identity remains UNKNOWN pending separate provenance or characterization evidence."
stop_conditions:
  - "HEAD, known issuer-owned dirty package, scope hash, tool hash, authority, metric specification, or lock preflight differs from the issued contract."
  - "The run root already exists, a fourth case or any unregistered timestep/parameter/load is needed, or D0 would need to add a read pulse or change a window/guard after observing data."
  - "A required action needs network, installation, worktree creation, commit, deletion, overwrite, rename, or a write outside scope."
  - "Final verify-task fails; preserve all created attempt evidence and return BLOCKED or DEVIATED without beginning BVM-S0."
