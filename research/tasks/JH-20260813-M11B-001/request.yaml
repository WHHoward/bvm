acceptance:
  - {id: AC1, condition: "The structured baseline contains at least BVM, published modified-QB, original/reference BQ, canonical JTL receiver, canonical DCSFQ reference fixture, BVM source characterization, and receiver characterization objects; each has source_reference, parameter_provenance, reproduction_status, characterization_status, unknown_inferred_items, evidence, claim_limitation, and upgrade_discriminator fields.", evidence: [scientific-reconstruction-baseline-v1.yaml, validator-test-log]}
  - {id: AC2, condition: "Every UNKNOWN or INFERRED item names the exact field, reference value/status, project value when present, provenance tag, reviewed source set/date/search boundary, impact, and required discriminator. No UNKNOWN is represented by a guessed/default numerical value, and [INFERRED]/[DESIGNED]/[TUNED] is never labeled [PUBLISHED].", evidence: [scientific-reconstruction-baseline-v1.yaml, validator-test-log]}
  - {id: AC3, condition: "Reproduction status is per-object and cumulative: R0/R1/R2/R3 or PARTIAL_R1/NOT_ATTEMPTED has an achieved/not-achieved rationale. Any nonpublished-parameter behavioral similarity is labeled behavioral_analogue_with_nonpublished_parameters, not published R2. Characterization status is independent and one of NOT_ATTEMPTED/LEGACY_ONLY/CALIBRATION_FIXTURE_ONLY/CHARACTERIZED with evidence and limitation.", evidence: [scientific-reconstruction-baseline-v1.yaml]}
  - {id: AC4, condition: "A deterministic attempt-local validator rejects absent required structured fields, invalid provenance tags, a bare UNKNOWN, an unjustified reproduction upgrade, characterization inferred from reproduction, candidate/Gate success text, or a claim that PASS means physical knowledge completeness/published reproduction/candidate validation; it passes the delivered baseline.", evidence: [validate_scientific_reconstruction_baseline.py, validator-test-log]}
  - {id: AC5, condition: "The baseline explicitly declares PASS means reconstruction/provenance knowledge state is completely and honestly frozen as of its cutoff; UNKNOWN, INFERRED, R0, PARTIAL_R1 and uncharacterized states are legal. It makes no physical-completeness, published-reproduction, candidate, interface, system, T1, or paper novelty conclusion.", evidence: [scientific-reconstruction-baseline-v1.yaml]}
  - {id: AC6, condition: "Receipt records no JoSIM run, no automatic status upgrade, no frozen-path edit, and a final successful handoff verification.", evidence: [receipt.yaml, verify-task-log]}
invalid_conditions: ["Any new circuit run, parameter tuning, status upgrade not supported by a listed accepted/current artifact, or edit outside attempts/**.", "Any bare/free-text-only object record, guessed UNKNOWN/default reference value, provenance laundering, or reproduction/characterization claim beyond recorded evidence.", "Any physical Gate, candidate success, route, T1, interface, hardware, or paper novelty conclusion."]
inconclusive_conditions: ["A required object cannot be identified or its source/reference boundary cannot be recorded from the allowed local corpus; preserve the gap and report BLOCKED.", "A desired status requires an unregistered new circuit run or external source: report the exact discriminator and do not start it under this task."]
stop_conditions: ["Any scope, HEAD, dirty snapshot, HANDOVER, metric-spec, or frozen-input mismatch.", "Need network, external contact, JoSIM, an edit outside attempts/**, or a new reconstruction/characterization run.", "Any acceptance condition requires raising a reproduction or characterization status rather than honestly freezing the current state."]
