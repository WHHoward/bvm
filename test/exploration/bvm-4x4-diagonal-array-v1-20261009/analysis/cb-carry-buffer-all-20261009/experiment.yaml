question: >-
  Under fixed A025/A026 array, T1, load, and synchronous-clock conditions,
  what raw boundary and same-JJ arithmetic is observed when all six D1-D6
  previous-Carry branches pass through one canonical CB_0928 before direct
  JOIN with their existing array DOUT outputs?
