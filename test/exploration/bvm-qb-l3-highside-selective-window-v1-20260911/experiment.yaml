id: bvm-qb-l3-highside-selective-window-v1-20260911
study_phase: EXPLORATORY
mode: QUICK_HIGH_SIDE_SEARCH
status: PREREGISTERED_PENDING_PREFLIGHT
role: Experimental Operator + Evidence Packager

question:
  primary: >-
    At fixed canonical parameters except L3, determine whether increasing L3
    from the immutable 1.6 pH reference to 1.8 or 2.0 pH preserves N2=2 while
    weakening N3 response 4.
  interpretation_ceiling: >-
    Results are bounded to the named BVM/JSL source, QB/JTL receiver, load,
    stored history, solver and 0.1 ps grid; no exact optimum, hardware claim
    or route verdict is inferred.

topology:
  full_closed_loop: BVM1..4 -> COMMON_SL -> eight-JJ JSL -> QB -> six-stage JTL -> R_TERM
  no_replay: true
  no_passive_capture: true
  no_isolated_qb: true
  no_source_waveform_modification: true
  no_source_scaling: true
  no_jtl_parameter_change: true

source_authority:
  previous_screening: test/exploration/bvm-full-closed-loop-qb-parameter-screening-v1-20260911
  current_bvm_include: inputs/bvm_jm2_connected.cir
  current_jj_model: inputs/jjmit.cir
  current_jtl_include: inputs/jtl2.cir
  current_bq_include: inputs/BQ_parameterized_bjs400_rj2.cir
  reference_l3_1p6_0011: references/l3_1p6/0011/raw.csv
  reference_l3_1p6_0111: references/l3_1p6/0111/raw.csv

baseline_except_l3:
  Lin_pH: 1.5
  L1_pH: 1.4
  L2_pH: 2.0
  RJ1_ohm: 32.0
  RJ2_ohm: 12.0
  IBias_uA: 260.0
  BJS_area: 4.0
  BJ1_area: 0.9
  BJ2_area: 2.0

registered_points:
  H1: {point_id: H1_L3_1p8, L3_pH: 1.8, masks: [0011, 0111]}
  H2: {point_id: H2_L3_2, L3_pH: 2.0, masks: [0011, 0111], condition: only_if_H1_not_clean_2_to_3}
  reference: {L3_pH: 1.6, masks: [0011, 0111], immutable: true}
  maximum_screening_solve_count: 4
  maximum_total_if_later_validation_authorized: 6
  no_extra_l3_values: true

stimulus:
  amplitude_uA: 100.0
  rise_ps: 1.0
  fall_ps: 1.0
  plateau_ps: 9.0
  history: IDLE 0-50; WRITE0 50-61; IDLE 61-70; ZERO_STATE_READ_CONTROL 70-81; IDLE 81-90; WRITE1 90-101; SETTLE 101-110; FINAL_READ 110-121; TAIL 121-200
  bit_order: b3b2b1b0 = BVM1/BVM2/BVM3/BVM4
  tran: .tran 0.1p 200p
  final_read_masks: [0011, 0111]

control_history:
  windows_ps:
    zero_state_read_control: [70.0, 81.0]
    post_control_idle: [81.0, 90.0]
    write1: [90.0, 101.0]
    settle: [101.0, 110.0]
  criterion: only unintended complete downstream QBOUT -> JTL1 -> ... -> JTL6 propagation before FINAL READ is contamination
  rollback_excluded_from_control: true
  qbout_peak_threshold_V: 0.0002
  jtl_peak_threshold_V: 0.0002

classification:
  phase_baseline_window_ps: [101.0, 110.0]
  phase_navigation_thresholds_turns: [0.5, 1.5, 2.5, 3.5, 4.5]
  S: DIRECT_2_TO_3_L3_CANDIDATE
  A: N2_PRESERVED_N3_FOURTH_WEAKENED
  B: STILL_2_TO_4
  C: L3_HIGHSIDE_N2_FAILURE
  D: HISTORY_OR_DYNAMIC_INSTABILITY
  phase_navigation_only: true
  terminal_area_not_a_count: true

validation:
  masks: [0001, 0011, 0111, 1111]
  status: RESERVED_NOT_AUTHORIZED
  requires_later_scientific_authorization: true
  no_automatic_positional_or_timestep_validation: true

authorized_runs: []
physics_solve_count: 0
reference_l3_1p6_raw_count: 2
maximum_physics_solve_count_including_validation: 6

visualization:
  manifest_path: visualization/manifest.json
  qa_path: qa/visualization_qa.json
  navigation_path: visualization/run_summaries
  renderer: scripts/josim-plot2.py
  layout: sep_comb
  color: dark
  phase_option: 2pi
  whole_run_window_ps: [0.0, 200.0]
  focused_window_ps: [108.0, 150.0]
  comparison_required: true
  plots_not_in_raw_handoff_zip: true

package:
  include_plots: false
  additional_paths:
    - HANDOFF_README.md
    - analysis
    - screening
    - qa
    - references
    - mechanical_summary.json
    - run.sh
  analysis_files:
    raw_qa.json: qa/raw_qa.json
    deck_diff_qa.json: qa/deck_diff_qa.json
    provenance.json: qa/provenance.json
    execution_summary.json: qa/execution_summary.json
    transformation_registry.json: qa/transformation_registry.json

stop:
  final_state: EXPERIMENT_COMPLETE / AWAITING_SCIENTIFIC_REVIEW
  automatic_followup: false
  no_unregistered_parameter: true
