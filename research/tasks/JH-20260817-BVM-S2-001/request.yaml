acceptance:
  - {id: AC1, condition: "Preflight records only build/josim-cli v2.7.2837d13 with SHA-256 48655cb31d6297ba571a300c3c7e0b5665d11c8cc1f02b5b4f6e9b0db50440b2, copied BVM/jjmit closure hashes, and a unique nonexisting run root. Any other binary, PATH resolution, closure or run-root state blocks execution.", evidence: [preflight-log, manifest.yaml, inputs]}
  - {id: AC2, condition: "Create exactly sixteen immutable runs: R_LD=1/12/25/50 ohm times init_positive/init_negative times read/matched-control, all at 0.0125 ps and 170 ps. Only R_LD changes across loads; matched controls retain every source/knot except 96-105 ps WL/SE amplitudes become zero. Preserve all raw CSV, inputs, stdout/stderr, manifests and hashes.", evidence: [manifest.yaml, inputs, raw, logs]}
  - {id: AC3, condition: "Every run has all registered finite columns, zero solver exit/no unhandled solver error, strictly increasing nonduplicate actual time, and coverage of all registered half-open windows. Header strings, endpoints, vts and rd exactly equal preregistration.yaml for source, JM1/JM2/JS1/JS2 and inputs (I_WL1 0->WL1, I_BL1 0->BL1, I_SE1 0->SE1).", evidence: [raw-csv, manifest.yaml, qa-report]}
  - {id: AC4, condition: "Apply per-load/init PRE JM1/JM2 p2p <=0.020 rad and same-load positive/negative JM1/JM2 mean-vector L-infinity separation >=0.100 rad, reporting these only as readiness/comparability and never as a memory, logical, fluxoid or state-preservation Gate.", evidence: [analysis.json, analysis.md]}
  - {id: AC5, condition: "Use literal CSV decimal timestamps with zero tolerance for every paired-control and cross-load comparison; prohibit interpolation/resampling/correlation/peak alignment. Compute Aread/Actrl only as the own-PRE-baseline-subtracted source-window maxima stated in preregistration.yaml, then apply the frozen rctrl hierarchy, control residual metrics, exact-zero tie rules, lobe/FWHM rules and explicit NOT_APPLICABLE reasons exactly as preregistration.yaml.", evidence: [analysis.json, analysis.md]}
  - {id: AC6, condition: "analysis.json validates against design/analysis-schema.json and is METRIC_SPEC_V2 section 11.1 complete: metric spec path/version/hash; provenance; selected actual windows; mappings; signal/control/control-corrected namespaces; raw rad plus turns; activity only; same-JJ cross_check; convergence={classification: NOT_APPLICABLE, ladder: [], bands: [], per_adjacent_pair: [], stop_rule_compliance: NOT_APPLICABLE, reason}; explicit unknown/NA; and no NaN/Inf or event/SFQ/pulse/fluxoid-count fields.", evidence: [analysis.json, schema-validation-log]}
  - {id: AC7, condition: "For every direct JM1/JM2/JS1/JS2 P/V mapping, report PRE/POST platform mean rad and turns; activity endpoint phase rad/turns; actual-time direct-V area; and residual = phase_reported_turns - area_reported_turns using Phi0=2.067833848e-15 Wb. Treat this only as same-JJ descriptive consistency, with no global residual PASS band.", evidence: [analysis.json, analysis.md]}
  - {id: AC8, condition: "Report per-load terminal V/I observations and 1/50-ohm endpoint affine reference; independently report e12/e25 and named eligible intervals under frozen 0.5-uA/5-uV conditioning floors and abs(e)<=max(5uV,1% endpoint-voltage-span). Report peak-envelope separately; never call either result universal/fixed internal Thevenin/Norton impedance.", evidence: [analysis.json, analysis.md]}
  - {id: AC9, condition: "Report preregistered control-corrected JM1/JM2/JS1/JS2 p-star/v-star/a-star cross-load paths and the internal trajectory discriminator. If PRE is load-affected, use LOAD_EFFECT_ON_INITIALIZATION_OR_UNRESOLVED; if the exact two-witness/persistence/control-envelope/floor/direction requirements pass, the only permitted positive label is RESOLVED_LOAD_ASSOCIATED_INTERNAL_TRAJECTORY_DIFFERENCE.", evidence: [analysis.json, analysis.md]}
  - {id: AC10, condition: "Receipt hashes/maps all created artifacts and every AC. It records numerical_status=NOT_APPLICABLE because no S2 convergence procedure is registered, preserves S1 INCONCLUSIVE, and stops after delivery for Copilot skeptical evidence review before Codex audit.", evidence: [receipt.yaml, verify-task-log]}
invalid_conditions:
  - "Wrong binary, closure, netlist, internal R_SL, source/direct-JJ header, endpoint, direction, Phi0, residual definition, load matrix, timestep, PWL, hash/provenance, missing control, missing raw/log/input, solver/CSV/NaN/nonfinite/nonmonotonic/duplicate-time failure, or out-of-scope write."
  - "Any overwrite/delete/rename/reused run root; added load/timestep/case/probe/window/band; interpolation/resampling/alignment; receiver/JTL/BQ/DCSFQ_BVM/T1 attachment; parameter sweep/tuning; or logical/SFQ/fluxoid/Gate/universal/hardware claim."
inconclusive_conditions:
  - "Artifact is valid but readiness, matched-control isolation, exact common-time matching, input identity, terminal conditioning, or internal attribution requirements are unavailable or not met."
  - "A valid terminal result that is non-affine is NOT_SUPPORTED at a named time/feature, not a physical circuit FAIL; no numerical convergence conclusion is available because S2 deliberately registers no ladder."
stop_conditions:
  - "HEAD, issuer dirty snapshot, scope hash, binary provenance, current HANDOVER/MetricSpec hash, authority, lock, active closure, PWL, probe/header or fixture preflight differs."
  - "Need a different/new load, timestep, case, probe, window, band, source, solver setting, interpolation/alignment, parameter sweep, receiver/Gate interpretation, network/install/commit/delete/overwrite action, or any write outside scope."
  - "Run root exists, any raw artifact is already present, any required deliverable cannot be written without overwrite, or final verify-task fails: preserve evidence and report BLOCKED/DEVIATED."
