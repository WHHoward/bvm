stimulus:
  amplitude_uA: 100.0
  rise_time_ps: 1.0
  fall_time_ps: 1.0
  plateau_ps: 9.0
  stored_protocol: 1111
  final_read_mask: 1000
  target_read: BVM1 WL1=+100uA, BL1=0, SE1=+100uA
  quiet_final_read: BVM2/BVM3/BVM4 WL=BL=SE=0
  history: WRITE0 -> ZERO_STATE_READ_CONTROL -> WRITE1 -> selective FINAL_READ -> TAIL
  timing_ps:
    initial_settle: [0, 50]
    write0: [50, 61]
    post_write0_settle: [61, 70]
    zero_state_read_control: [70, 81]
    post_zero_read_settle: [81, 90]
    write1: [90, 101]
    pre_final: [101, 110]
    final_read: [110, 121]
    tail: [121, 200]

windows_ps:
  PRE_FINAL: [101.0, 110.0]
  EARLY_TRIGGER: [110.0, 116.0]
  FULL_READ: [110.0, 121.0]
  TAIL: [121.0, 200.0]
  FULL_FINAL: [110.0, 200.0]
  semantics: half-open; actual stored timestamps only
  reference_sample: exact stored sample at 110.0ps; if absent, nearest sample is recorded and classified UNKNOWN

probe_schema:
  bvm_each: >-
    P/V/I(B_JM1), P/V/I(B_JM2), P/V/I(B_JS1), P/V/I(B_JS2), I/V(L_M1),
    I/V(L_M2), I/V(L_M3), I/V(L_PM), I/V(R_JM1), I/V(L_S1), I/V(L_S2),
    I/V(L_S3), I/V(R_S), I/V(L_PSE), I/V(L_PSL), I/V(R_SL), I/V(L_SL)
  bvm_controls: I(I_WL1..4), I(I_BL1..4), I(I_SE1..4)
  bvm_derived: I_LSL1=I(L_SL|XBVM1); I_quiet_total=sum(I(L_SL|XBVM2..4))
  boundary: V(COMMON_SL); P/V/I(B_JSL1..8)
  qb: >-
    V(QBIN), V(QBOUT), P/V/I(BJS|XBQ1), P/V/I(BJ1|XBQ1),
    P/V/I(BJ2|XBQ1), I/V(LIN|XBQ1), I/V(RJ1|XBQ1), I/V(L1|XBQ1),
    I/V(IB|XBQ1), I/V(L2|XBQ1), I/V(RJ2|XBQ1), I/V(L3|XBQ1)
  jtl: >-
    P/V/I(B01|XJTL1_1..6), P/V/I(B02|XJTL1_1..6),
    V(JTL1_OUT..JTL6_OUT), I(R_TERM)
  missing_probe_policy: >-
    If JoSIM does not emit a requested optional branch column, preserve the
    requested probe in the deck and mark the missing column UNKNOWN in QA; do
    not fabricate a signal.

registered_metrics:
  source_interface_signals:
    - I(LSL|XBVM1)
    - I_quiet_total=sum(I(L_SL|XBVM2..4))
    - I(B_JSL1)
    - I(B_JSL8)
    - V(COMMON_SL)
    - V(QBIN)
  waveform_statistics: [max, min, max_abs, RMS, p2p, first, last, endpoint_delta, signed_area, positive_area, negative_area]
  waveform_area: trapezoid on actual stored time grid; area units remain signal_unit*s
  qbin_port_work:
    formula: W_QBIN = integral(V(QBIN)*I(LIN)*dt)
    windows: [EARLY_TRIGGER, FULL_READ]
    label: DERIVED port-work diagnostic; not a universal trigger-energy threshold
  bj1:
    phase_raw_unit: rad
    phase_display: continuous_unwrap(raw_rad)/(2*pi) turns
    relative_reference: phase_unwrap(t)-phase_unwrap(110ps), divided by 2*pi
    metrics: [phase_at_PRE_FINAL_last, max_positive_relative_progression, min_relative_progression, final_relative_progression, time_of_max_progression, V_max, V_min, V_p2p, positive_voltage_duration, I_RJ1_max, I_RJ1_min, I_RJ1_RMS]
    positive_voltage_rule: V(BJ1)>0 on actual stored intervals; no threshold and no event count
  l1:
    metrics: [value_at_or_nearest_110ps, max, min, first, last, endpoint_delta, p2p]
    sign_rule: detect stored-sample bracket from negative to nonnegative only; no interpolation
    bracket_fields: [last_negative_time_ps, last_negative_current_uA, first_nonnegative_time_ps, first_nonnegative_current_uA]
  regeneration:
    kcl_formula: I(L2)-I(IB)-I(L1)
    metrics: [KCL_residual_max_abs, KCL_residual_RMS, I(L2)_max, I(L2)_min, BJ2_phase_progression, V(BJ2)_max, V(BJ2)_min, I(BJ2)_max, I(BJ2)_min, I(RJ2)_max, I(RJ2)_min, I(L3)_max, I(L3)_min, V(QBOUT)_max, V(QBOUT)_min]
    order_diagnostic: registered descriptive peak-time comparison only; not causal event detection
  downstream:
    metrics: stage-wise P/V/I and same-JJ P/V area diagnostics for JTL1..JTL6 plus terminal voltage/current diagnostics
    classification: no SFQ/event count; missing frozen acceptance tolerance or convergence remains UNKNOWN/INCONCLUSIVE
  phase_area_rule: same JJ, same endpoint/direction, same run and same registered window; no wrapped subtraction

visualization:
  renderer_default: scripts/josim-plot2.py
  options: sep_comb dark -j 2pi
  stages: standalone_then_standalone_QA_then_comparison_then_final_QA
  standalone_blocks: [source_interface, qb_trigger, regeneration, downstream]
  critical_windows_ps: [[110.0, 116.0], [110.0, 121.0]]
  comparison_families:
