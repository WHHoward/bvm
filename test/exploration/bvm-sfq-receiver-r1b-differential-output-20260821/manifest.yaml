verdict_summary: >-
  Artifact-valid matched four-case Exploration.  The initial point exposed
  bias diversion through the parallel zero-voltage L_SEC return.  The one
  permitted series-return correction restored a direct 7 uA B_OUT bias and a
  state-dependent differential transient, while preserving the complete
  read1 B_TRIG guard.  Its largest read1 B_OUT monotonic segment was only
  0.02205835 turns with same-JJ voltage area 0.02206765 turns, so the required
  complete output transition was absent.  R1b is therefore FAIL, not INVALID;
  no R1c/JTL/Candidate action was started.
