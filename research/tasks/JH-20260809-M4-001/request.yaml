    - "不实现 M6 的同一 JJ 电压面积交叉校验。"
    - "不重算或覆盖 BASELINE、P0、P2、BQ v4 的历史 JSON/CSV。"
    - "不判定 BQ、DCSFQ、JTL 或系统物理 Gate。"
    - "不修改或删除失效的 v1 scripts/sfq_metrics.py；它保留为历史证据。"
  claim_ceiling: implementation_foundation_only_no_physical_gate
