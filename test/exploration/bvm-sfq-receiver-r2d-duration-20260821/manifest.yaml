event_criterion:
  definition: >-
    Continuous monotonic segment of adjacent-sample-unwrapped P(B_OUT|XTRIG)
    with abs(delta(phi))/(2*pi) >= 1.0 turn, segment start no later than 130 ps,
    same-segment direct V(B_OUT|XTRIG) trapezoid integral / Phi0 within 0.05
    turn of phase delta.  I_peak > Ic and voltage peaks are never oracles.
interpretation_plan:
  situation_A: >-
    Strong nonlinear growth toward >=1 turn with increasing duration; record
    first complete-transition duration and stop.
  situation_B: >-
    Phase stays sub-turn even at 20 ps; report
    NO_THRESHOLD_IN_BOUNDED_DURATION_MATRIX, analyze failure mode, no auto
    extension to 50/100 ps.
  situation_C: >-
    Multi-turn/free-running/strong ringing appears; record
    ACTIVATION_WITH_UNSTABLE_RUNNING; never call it exactly-one SFQ.
derived_quantities:
  per_pulse: [measured FWHM, measured base width, measured charge Q =
    integral of I_DIRECT dt, largest monotonic segment turns, same-segment
    V-area turns]
  correlation_note: observe whether phase tracks amplitude, duration, or charge;
    with only four points no empirical law is fitted.
