  - {id: AC1, condition: "Before any derived output, rerun the frozen S0-002 seal_check.py and retain its successful output. Hash every direct source input named in this request into source-evidence-manifest.sha256. Any mismatch or added/missing source artifact is BLOCKED; no source artifact may be edited.", evidence: [seal-check-log, source-evidence-manifest.sha256]}
  - {id: AC2, condition: "Create one stdlib-only regeneration/verifier script. From the twelve frozen CSVs using actual time and the registered windows/directions, it must independently reconstruct every phase-area and pre/post platform value printed in corrected-analysis.md and compare those results with frozen analysis.json. It must fail nonzero on any discrepancy, including the previously reported 0.1-ps positive/negative read discrepancies; it must not silently select a different case/timestep/window.", evidence: [regenerate_s0_report.py, regenerate-and-verify.log, corrected-analysis.json]}
  - {id: AC3, condition: "corrected-analysis.md must be deterministically rendered by the same script from corrected-analysis.json and must contain the four cases at all three timesteps, their direct-JJ phase-area/pre/post values, source-port waveform values, controls, registered convergence result, provenance paths/hashes, and a correction note identifying the old analysis.md as retained but superseded for human-readable numerical tables. A byte-for-byte re-render check is required.", evidence: [corrected-analysis.md, corrected-analysis.json, regenerate-and-verify.log]}
  - {id: AC4, condition: "The corrected report preserves numerical_status=INCONCLUSIVE and evidence_quality=INCONCLUSIVE because the preregistered 0.1-to-0.05 ps control-latency comparison exceeds its 0.5-ps task-local band. It must not change the fixture/stimulus/window/tolerance or promote any source fact to interface/Gate/logical/physical PASS/FAIL.", evidence: [corrected-analysis.md, corrected-analysis.json]}
  - {id: AC5, condition: "Receipt maps every created script/report/data/manifest/log artifact with SHA-256 and maps AC1-AC4. Final verify-task succeeds. After delivery, notify Copilot for a new read-only review of this successor correction before Codex final audit.", evidence: [receipt.yaml, verify-task-log]}
